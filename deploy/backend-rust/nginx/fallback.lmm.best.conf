# Isolated fallback test site. This file is installed only by
# install-fallback-nginx.sh on the machine approved by its target guard.
include /etc/nginx/lmm-api-http-map.conf;

server {
    listen 80;
    listen [::]:80;
    server_name fallback.lmm.best;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fallback.lmm.best;

    ssl_certificate /etc/letsencrypt/live/fallback.lmm.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fallback.lmm.best/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    root /srv/lmm-api-frontend/current;
    include /etc/nginx/lmm-api-mime.types;
    default_type application/octet-stream;

    location @fallback_lmm_api {
        # Intentional cleartext loopback hop: the Rust listener is bound only to
        # 127.0.0.1:3100. This is HTTP/1.1 for WebSocket upgrades, not h2c.
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /livez { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location = /readyz { try_files /.__lmm_backend__ @fallback_lmm_api; }
    # Build identity stays loopback-only for activation verification.
    location = /_internal/build { return 404; }
    location ^~ /api/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location = /api { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ^~ /v1/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location = /v1 { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ^~ /v1beta/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location = /v1beta { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ^~ /pg/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ^~ /mj/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ^~ /suno/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ^~ /kling/v1/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location = /jimeng { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ^~ /jimeng/ { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location = /dashboard/billing/subscription { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location = /dashboard/billing/usage { try_files /.__lmm_backend__ @fallback_lmm_api; }
    location ~ ^/[^/]+/mj(?:/|$) { try_files /.__lmm_backend__ @fallback_lmm_api; }

    location ^~ /static/ {
        alias /srv/lmm-api-frontend/current/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
}
