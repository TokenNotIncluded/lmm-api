# Include inside the canonical production TLS server block.
#
# Nginx performs the country lookup at the edge, then asks lmm-api-go whether
# the authenticated account's single L2 personal IP allowlist permits the
# request. The Go service owns the decision and the rendered 451 page; this
# file only transports trusted loopback headers and wires the edge hook.
auth_request /internal/access-ip-policy;
auth_request_set $lmm_access_policy_result $upstream_http_x_lmm_access_policy;
error_page 401 403 = /internal/errors/access-policy;

location = /internal/access-ip-policy {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3000/internal/access-ip-policy;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-Client-IP $remote_addr;
    proxy_set_header X-LMM-Edge-Country $lmm_geoip_country_code;
    proxy_set_header X-LMM-CN-Source $lmm_cn_source;
}

location = /internal/errors/access-policy {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3000/internal/errors/access-policy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-Client-IP $remote_addr;
    proxy_set_header X-LMM-Edge-Country $lmm_geoip_country_code;
    proxy_set_header X-LMM-CN-Source $lmm_cn_source;
    proxy_set_header X-LMM-Access-Policy $lmm_access_policy_result;
    proxy_set_header X-LMM-Internal-Error access-policy;
    proxy_intercept_errors off;
}
