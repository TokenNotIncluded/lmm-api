# Include inside the canonical production TLS server block.
#
# Nginx performs the country lookup at the edge, then asks lmm-api-go to apply
# the administrator's ordered IP access route rules. The Go service owns the
# decision and rendered rejection page; this file only transports trusted
# loopback metadata and wires the edge hook.
auth_request /internal/access-ip-policy;
auth_request_set $lmm_access_policy_result $upstream_http_x_lmm_access_policy;
error_page 401 403 = /internal/errors/access-policy;

location = /internal/access-ip-policy {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3000/internal/access-ip-policy;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-Client-IP $remote_addr;
    proxy_set_header X-LMM-Edge-Country $lmm_geoip_country_code;
    proxy_set_header X-LMM-Edge-Port $server_port;
    proxy_set_header X-LMM-Edge-Destination-IP "";
    proxy_set_header X-LMM-Edge-Domain $host;
    proxy_set_header X-LMM-Edge-Source-Port $remote_port;
    proxy_set_header X-LMM-Edge-Source-MAC "";
    proxy_set_header X-LMM-Edge-Process-Name "";
    proxy_set_header X-LMM-Edge-DSCP "";
    proxy_set_header X-LMM-CN-Source $lmm_cn_source;
}

location = /internal/errors/access-policy {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3000/internal/errors/access-policy;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-Client-IP $remote_addr;
    proxy_set_header X-LMM-Edge-Country $lmm_geoip_country_code;
    proxy_set_header X-LMM-Edge-Port $server_port;
    proxy_set_header X-LMM-Edge-Destination-IP "";
    proxy_set_header X-LMM-CN-Source $lmm_cn_source;
    proxy_set_header X-LMM-Access-Policy $lmm_access_policy_result;
    proxy_set_header X-LMM-Internal-Error access-policy;
    proxy_set_header X-LMM-Original-URI $lmm_access_policy_original_uri;
    proxy_set_header X-LMM-Original-Accept $http_accept;
    proxy_intercept_errors off;
}
