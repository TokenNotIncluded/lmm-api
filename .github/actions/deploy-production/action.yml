name: Deploy signed production release
description: Verify signed artifacts and require public acceptance plus native confirmation, with guarded failure rollback.

inputs:
  release-tag:
    description: The immutable go-v or web-v release tag
    required: true
  release-sha:
    description: The exact commit that passed release verification and publication
    required: true
  github-token:
    description: Read-only repository token for release downloads
    required: true
  ssh-private-key:
    description: Production SSH private key from the protected environment
    required: true
  ssh-known-hosts:
    description: Pinned production SSH host keys
    required: true

runs:
  using: composite
  steps:
    - name: Verify deployment context
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        RELEASE_SHA: ${{ inputs.release-sha }}
      run: |
        set -euo pipefail
        [[ "$GITHUB_REPOSITORY" == TokenNotIncluded/api.lmm.best ]]
        [[ "$RELEASE_TAG" =~ ^(go|web)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
        [[ "$RELEASE_SHA" == "$GITHUB_SHA" ]]
        [[ $(git rev-parse HEAD) == "$RELEASE_SHA" ]]
        [[ $(git rev-list -n 1 "$RELEASE_TAG") == "$RELEASE_SHA" ]]

    - name: Test release failure handling without production credentials
      shell: bash
      run: python3 -B scripts/test-production-release-transaction.py

    - name: Verify deployment credentials are configured
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PRODUCTION_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        PRODUCTION_SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        test -n "$GITHUB_TOKEN"
        test -n "$PRODUCTION_SSH_PRIVATE_KEY"
        test -n "$PRODUCTION_SSH_KNOWN_HOSTS"

    - name: Install deployment tools
      shell: bash
      run: |
        sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
        sudo apt-get update
        # Use the runner's Docker installation; docker.io conflicts with containerd.io.
        sudo apt-get install --yes jq openssh-client
        docker --version

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Stage, verify and confirm the release or recover its failed transaction
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        RELEASE_SHA: ${{ inputs.release-sha }}
        REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PRODUCTION_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        PRODUCTION_SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        PRODUCTION_RESULT_FILE: ${{ runner.temp }}/lmm-production-result-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: bash scripts/auto-deploy-production-release.sh

    - name: Record the native terminal state, not just HTTP success
      if: always()
      shell: bash
      env:
        PRODUCTION_RESULT_FILE: ${{ runner.temp }}/lmm-production-result-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        result = Path(os.environ['PRODUCTION_RESULT_FILE'])
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('## Native production transaction\n\n')
            if result.is_file():
                value = json.loads(result.read_text())
                summary.write('```json\n' + json.dumps(value, indent=2, sort_keys=True) + '\n```\n')
            else:
                summary.write('No transaction receipt was produced. Deployment success is not established; inspect the failed step.\n')
        PY

    - name: Retain only the non-secret transaction result
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: production-result-${{ inputs.release-tag }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lmm-production-result-${{ github.run_id }}-${{ github.run_attempt }}.json
        if-no-files-found: ignore
        retention-days: 14
