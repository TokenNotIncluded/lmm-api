name: Assistant contract regression
on:
  push:
    branches: ['assistant/l0-evidence-tools-20260916']
    paths: ['.github/workflows/assistant-contract-regression.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'LIghtJUNction/api.lmm.best' && github.ref == 'refs/heads/assistant/l0-evidence-tools-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: assistant/l0-evidence-tools-20260916
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Apply verified retirement contracts and regression assertions
        env:
          PATCH_DATA: ''
        run: |
          python3 - <<'PY'
          import os, pathlib, hashlib, base64, lzma, json
          blob = base64.b64decode(os.environ['PATCH_DATA'], validate=True)
          assert hashlib.sha256(blob).hexdigest() == '5d1fdfc6928eea8df6e0ce4358dbd9edc1026ad908d5fe0de800bf0911dadf42'
          out = {}
          for row in json.loads(lzma.decompress(blob)):
              path = pathlib.Path(row['path'])
              assert row['path'].startswith('apps/api-go/controller/') and '..' not in path.parts and not path.is_symlink()
              old = path.read_bytes()
              assert hashlib.sha256(old).hexdigest() == row['old'], str(path)
              lines = old.decode().splitlines(keepends=True)
              for i,j,text in reversed(row['changes']): lines[i:j] = [text]
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == row['new'], str(path)
              out[path] = result
          for path,content in out.items(): path.write_bytes(content)
          PY
      - name: Correct braces without touching unrelated frontend files
        working-directory: apps/web
        run: |
          bun x oxlint -c .oxlintrc.json --fix src/features/assistant/assistant-registration-state.ts src/features/assistant/assistant-registration-status.tsx src/features/system-settings/content/assistant-l1-review-settings.tsx src/features/system-settings/content/assistant-settings-section.test.tsx
      - name: Regenerate administrator operation contracts from real routes
        working-directory: apps/api-go
        run: go generate ./controller
      - name: Commit final source, remove temporary workflow
        run: |
          test "$GITHUB_REF" = refs/heads/assistant/l0-evidence-tools-20260916
          rm .github/workflows/assistant-contract-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps .github/workflows/assistant-contract-regression.yml
          git diff --cached --check
          git commit -m 'fix(assistant): complete tool admission chain and remove stale letter UI guidance'
          git push origin HEAD:refs/heads/assistant/l0-evidence-tools-20260916
          mkdir -p /tmp/assistant-checks
          git rev-parse HEAD > /tmp/assistant-checks/commit.txt
          git archive --format=tar HEAD > /tmp/assistant-checks/source.tar
      - name: Run complete affected Go package suites and race-check policy
        working-directory: apps/api-go
        shell: bash
        run: |
          status=0
          go test -p 2 -timeout 180s ./model ./controller ./service ./internal/registrationguard -count=1 2>&1 | tee /tmp/assistant-checks/go.log || status=1
          go test -race ./internal/registrationguard -count=1 2>&1 | tee /tmp/assistant-checks/race.log || status=1
          exit "$status"
      - name: Verify frontend and production build
        if: always()
        working-directory: apps/web
        shell: bash
        run: |
          mkdir -p /tmp/assistant-checks
          status=0
          bun run typecheck 2>&1 | tee /tmp/assistant-checks/typecheck.log || status=1
          bun run lint 2>&1 | tee /tmp/assistant-checks/lint.log || status=1
          bun run copyright:check 2>&1 | tee /tmp/assistant-checks/copyright.log || status=1
          for file in src/features/assistant/assistant-registration-state.test.ts src/features/assistant/assistant-activation-tool.test.tsx src/features/system-settings/content/assistant-settings-section.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" 2>&1 | tee "/tmp/assistant-checks/$(basename "$file").log" || status=1
          done
          bun run build 2>&1 | tee /tmp/assistant-checks/build.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assistant-completed-checks-and-source
          path: /tmp/assistant-checks
          retention-days: 3
