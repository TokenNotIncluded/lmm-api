name: Temporary L0 delivery formatter

on:
  push:
    branches:
      - assistant/l0-format-ci-fix-20260916
    paths:
      - .github/workflows/tmp-l0-format-ci-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Apply repository formatter
        run: bun run --filter @lmm/web format

      - name: Commit formatter output
        shell: bash
        run: |
          git add \
            apps/web/src/features/assistant/assistant-registration-state.ts \
            apps/web/src/features/assistant/assistant-registration-status.tsx \
            apps/web/src/features/system-settings/content/assistant-l1-review-settings.tsx \
            apps/web/src/features/system-settings/content/assistant-settings-section.test.tsx
          if git diff --cached --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(web): format L0 assistant delivery"
          git push origin HEAD:assistant/l0-format-ci-fix-20260916
