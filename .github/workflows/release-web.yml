name: LMM web release

on:
  push:
    tags:
      - 'web-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  web:
    name: Test, build, sign, and publish web package
    # The identity step below is the security gate: it requires the tag to
    # resolve to an immutable commit reachable from the default branch. GitHub
    # does not mark ordinary release tags as protected, so ref_protected would
    # silently skip every tag-triggered publication.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout immutable web release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify web release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == "refs/tags/$GITHUB_REF_NAME" ]]
          version=${GITHUB_REF_NAME#web-v}
          [[ "$GITHUB_REF_NAME" == "web-v${version}" ]]
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:$default_branch_ref"
          git merge-base --is-ancestor "$revision" "${default_branch_ref}^{commit}" || {
            echo "$revision is not reachable from default branch $DEFAULT_BRANCH" >&2
            exit 1
          }
          [[ $(git rev-list -n 1 "$GITHUB_REF_NAME") == "$revision" ]]
          aur_version=$(sed -n 's/^pkgver=//p' packaging/aur/lmm-api-web-bin/PKGBUILD)
          [[ "$aur_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$aur_version" != "$version" ]]
          [[ $(printf '%s\n%s\n' "$aur_version" "$version" | sort -V | tail -n 1) == "$version" ]]
          contract_file=contracts/api-route/VERSION
          [[ -f "$contract_file" && ! -L "$contract_file" ]]
          [[ $(wc -l <"$contract_file") -eq 1 ]]
          contract_version=$(<"$contract_file")
          [[ "$contract_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          contract_revision=$(sha256sum "$contract_file" | awk '{print $1}')
          {
            echo "contract_revision=$contract_revision"
            echo "version=$version"
            echo "revision=$revision"
          } >>"$GITHUB_OUTPUT"

      - name: Install checksum-pinned Bun
        run: |
          set -euo pipefail
          bun_version=1.3.14
          bun_archive="$RUNNER_TEMP/bun-linux-x64.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-x64.zip" \
            --output "$bun_archive"
          printf '%s  %s\n' \
            951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f \
            "$bun_archive" | sha256sum --check --status -
          unzip -q "$bun_archive" -d "$RUNNER_TEMP/bun-release"
          install -Dm0755 "$RUNNER_TEMP/bun-release/bun-linux-x64/bun" \
            "$RUNNER_TEMP/bun-bin/bun"
          echo "$RUNNER_TEMP/bun-bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bun-bin/bun" --version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Test and build the web frontend
        env:
          VITE_REACT_APP_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web test
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

      - name: Verify package activation contract
        run: |
          set -euo pipefail
          hook=packaging/common/lmm-api/lmm-api-web.install
          [[ -f "$hook" && ! -L "$hook" ]]
          bash -n "$hook"
          # Inspect the literal signed-package activation command.
          # shellcheck disable=SC2016
          grep -Fq '/usr/bin/lmm-api deploy frontend package-activate --package-version "$1"' "$hook"
          [[ ! -e deploy ]]
          [[ ! -e packaging/aur/lmm-api-web-bin/lmm-api-web-activate ]]

      - name: Package immutable web artifact
        env:
          EXPECTED_CONTRACT_REVISION: ${{ steps.identity.outputs.contract_revision }}
          RELEASE_REVISION: ${{ steps.identity.outputs.revision }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          bundle=release-web/bundle
          mkdir -p "$bundle"
          cp -a apps/web/dist "$bundle/"
          cp packaging/common/lmm-api/lmm-api-web.install "$bundle/lmm-api-web.install"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' "$RELEASE_REVISION" >"$bundle/REVISION"
          printf '%s\n' "$EXPECTED_CONTRACT_REVISION" >"$bundle/API_ROUTE_CONTRACT_REVISION"
          [[ -f "$bundle/API_ROUTE_CONTRACT_REVISION" && ! -L "$bundle/API_ROUTE_CONTRACT_REVISION" ]]
          [[ $(<"$bundle/API_ROUTE_CONTRACT_REVISION") == "$EXPECTED_CONTRACT_REVISION" ]]
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          tar -czf "$archive" -C "$bundle" \
            dist lmm-api-web.install \
            LICENSE NOTICE THIRD-PARTY-LICENSES.md REVISION \
            API_ROUTE_CONTRACT_REVISION
          (cd release-web && sha256sum "${archive##*/}" >"${archive##*/}.sha256")
          (cd release-web && sha256sum --check "${archive##*/}.sha256")
          rm -rf -- "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify web artifact
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-web.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$archive"

      - name: Publish immutable web release
        env:
          CONTRACT_REVISION: ${{ steps.identity.outputs.contract_revision }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ steps.identity.outputs.revision }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=${RELEASE_TAG#web-v}
          expected_names=(
            "lmm-api-web-${version}.tar.gz"
            "lmm-api-web-${version}.tar.gz.sha256"
            "lmm-api-web-${version}.tar.gz.sigstore.json"
          )
          assets=(release-web/*)
          mapfile -t actual_names < <(printf '%s\n' "${assets[@]##*/}" | sort)
          mapfile -t expected_names < <(printf '%s\n' "${expected_names[@]}" | sort)
          [[ "${actual_names[*]}" == "${expected_names[*]}" ]] || {
            echo 'Signed web release assets do not match the exact three-file contract.' >&2
            exit 1
          }
          notes="$RUNNER_TEMP/web-release-notes.md"
          printf "%s\n\nRevision: \`%s\`\nAPI/route contract revision: \`%s\`\n" \
            'Independent production web frontend release.' \
            "$RELEASE_REVISION" "$CONTRACT_REVISION" > "$notes"

          verify_release() {
            local readback=$1 asset name local_digest published_digest published_list
            [[ $(jq -r '.tagName' <<<"$readback") == "$RELEASE_TAG" ]] || return 1
            [[ $(jq -r '.targetCommitish' <<<"$readback") == "$RELEASE_REVISION" ]] || return 1
            [[ $(jq -r '.name' <<<"$readback") == "LMM web $RELEASE_TAG" ]] || return 1
            [[ $(jq -r '.body' <<<"$readback") == "$(<"$notes")" ]] || return 1
            [[ $(jq -r '.isDraft, .isPrerelease' <<<"$readback") == $'false\nfalse' ]] || return 1
            published_list=$(jq -er '.assets | map(.name) | sort | .[]' <<<"$readback") || return 1
            mapfile -t published_names <<<"$published_list"
            [[ "${published_names[*]}" == "${expected_names[*]}" ]] || return 1
            for asset in "${assets[@]}"; do
              name=${asset##*/}
              local_digest=$(sha256sum "$asset" | cut -d' ' -f1) || return 1
              published_digest=$(jq -er --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest' <<<"$readback") || return 1
              [[ "$published_digest" == "sha256:$local_digest" ]] || return 1
            done
          }

          if readback=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,name,body,isDraft,isPrerelease,assets 2>/dev/null); then
            verify_release "$readback" || {
              echo "Release $RELEASE_TAG exists but differs; immutable releases cannot be edited or overwritten." >&2
              exit 1
            }
            echo "Release $RELEASE_TAG already exists and exactly matches the immutable contract."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$RELEASE_REVISION" --title "LMM web $RELEASE_TAG" \
            --notes-file "$notes" --latest=false

          readback=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,name,body,isDraft,isPrerelease,assets)
          verify_release "$readback"
