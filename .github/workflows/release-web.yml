name: LMM web release

on:
  push:
    tags:
      - 'web-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  web:
    name: Test, build, sign, and publish web package
    # The identity step below is the security gate: it requires the tag to
    # resolve to an immutable commit reachable from the default branch. GitHub
    # does not mark ordinary release tags as protected, so ref_protected would
    # silently skip every tag-triggered publication.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout immutable web release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify web release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == "refs/tags/$GITHUB_REF_NAME" ]]
          version=${GITHUB_REF_NAME#web-v}
          [[ "$GITHUB_REF_NAME" == "web-v${version}" ]]
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:$default_branch_ref"
          git merge-base --is-ancestor "$revision" "${default_branch_ref}^{commit}" || {
            echo "$revision is not reachable from default branch $DEFAULT_BRANCH" >&2
            exit 1
          }
          [[ $(git rev-list -n 1 "$GITHUB_REF_NAME") == "$revision" ]]
          aur_version=$(sed -n 's/^pkgver=//p' packaging/aur/lmm-api-web-bin/PKGBUILD)
          [[ "$aur_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$aur_version" != "$version" ]]
          [[ $(printf '%s\n%s\n' "$aur_version" "$version" | sort -V | tail -n 1) == "$version" ]]
          contract_revision=$(deploy/production/api-route-contract-revision.sh print)
          {
            echo "contract_revision=$contract_revision"
            echo "version=$version"
            echo "revision=$revision"
          } >>"$GITHUB_OUTPUT"

      - name: Install checksum-pinned Bun
        run: |
          set -euo pipefail
          bun_version=1.3.14
          bun_archive="$RUNNER_TEMP/bun-linux-x64.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-x64.zip" \
            --output "$bun_archive"
          printf '%s  %s\n' \
            951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f \
            "$bun_archive" | sha256sum --check --status -
          unzip -q "$bun_archive" -d "$RUNNER_TEMP/bun-release"
          install -Dm0755 "$RUNNER_TEMP/bun-release/bun-linux-x64/bun" \
            "$RUNNER_TEMP/bun-bin/bun"
          echo "$RUNNER_TEMP/bun-bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bun-bin/bun" --version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Test and build the web frontend
        env:
          VITE_REACT_APP_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web test
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

      - name: Verify package activation contract
        run: |
          if ! command -v bsdtar >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/compat-tools"
            ln -s "$(command -v tar)" "$RUNNER_TEMP/compat-tools/bsdtar"
            echo "$RUNNER_TEMP/compat-tools" >> "$GITHUB_PATH"
          fi
          bsdtar --version | head -1
          TMPDIR="$RUNNER_TEMP" bash deploy/test-frontend-release.sh
          TMPDIR="$RUNNER_TEMP" bash packaging/aur/test-web-activation.sh
          TMPDIR="$RUNNER_TEMP" bash deploy/production/test-api-route-contract.sh
          TMPDIR="$RUNNER_TEMP" bash deploy/production/test-release-artifact-contract.sh

      - name: Package immutable web artifact
        env:
          EXPECTED_CONTRACT_REVISION: ${{ steps.identity.outputs.contract_revision }}
          RELEASE_REVISION: ${{ steps.identity.outputs.revision }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          bundle=release-web/bundle
          mkdir -p "$bundle"
          cp -a apps/web/dist "$bundle/"
          cp packaging/aur/lmm-api-web-bin/lmm-api-web-activate "$bundle/"
          cp packaging/aur/lmm-api-web-bin/lmm-api-web.install "$bundle/"
          cp deploy/frontend-release.sh "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' "$RELEASE_REVISION" >"$bundle/REVISION"
          deploy/production/api-route-contract-revision.sh generate \
            "$bundle/API_ROUTE_CONTRACT_REVISION"
          deploy/production/api-route-contract-revision.sh verify \
            "$bundle/API_ROUTE_CONTRACT_REVISION"
          [[ $(<"$bundle/API_ROUTE_CONTRACT_REVISION") == "$EXPECTED_CONTRACT_REVISION" ]]
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          tar -czf "$archive" -C "$bundle" \
            dist lmm-api-web-activate lmm-api-web.install frontend-release.sh \
            LICENSE NOTICE THIRD-PARTY-LICENSES.md REVISION \
            API_ROUTE_CONTRACT_REVISION
          (cd release-web && sha256sum "${archive##*/}" >"${archive##*/}.sha256")
          (cd release-web && sha256sum --check "${archive##*/}.sha256")
          rm -rf -- "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify web artifact
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-web.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$archive"

      - name: Publish immutable web release
        env:
          CONTRACT_REVISION: ${{ steps.identity.outputs.contract_revision }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ steps.identity.outputs.revision }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-web/*)
          (( ${#assets[@]} > 0 )) || {
            echo 'No signed web release assets were produced.' >&2
            exit 1
          }
          notes="$RUNNER_TEMP/web-release-notes.md"
          printf '%s\n\nRevision: `%s`\nAPI/route contract revision: `%s`\n' \
            'Independent production web frontend release.' \
            "$RELEASE_REVISION" "$CONTRACT_REVISION" > "$notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$RELEASE_REVISION" \
              --title "LMM web $RELEASE_TAG" \
              --notes-file "$notes" --latest=false
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$RELEASE_REVISION" --title "LMM web $RELEASE_TAG" \
              --notes-file "$notes" --latest=false
          fi
