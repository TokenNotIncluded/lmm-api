name: LMM API release bundles

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed artifacts after every release gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_TOOLCHAIN: '1.88.0'

jobs:
  prepare:
    name: Resolve and verify immutable release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
      revision: ${{ steps.identity.outputs.revision }}
      tag_name: ${{ steps.identity.outputs.tag_name }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Test release metadata tooling
        run: node --test scripts/release.test.mjs

      - name: Verify version, tag, and changelog
        id: identity
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$GITHUB_SHA" ]]
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "VERSION must be a stable semantic version, got: $version" >&2
            exit 1
          }
          tag_name="v$version"

          publish=false
          case "$GITHUB_EVENT_NAME" in
            push)
              publish=true
              ;;
            workflow_dispatch)
              if [[ "$PUBLISH_REQUESTED" == true ]]; then
                [[ "$GITHUB_REF" == "refs/tags/$tag_name" ]] || {
                  echo 'publishing a manual release requires dispatching from its exact version tag' >&2
                  exit 1
                }
                publish=true
              fi
              ;;
            *)
              echo "unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            tag_revision=$(git rev-list -n 1 "$tag_name")
            [[ "$tag_revision" == "$revision" ]] || {
              echo "$tag_name already points to $tag_revision, not $revision" >&2
              exit 1
            }
          fi

          node scripts/release.mjs verify --version "$version"
          mkdir -p release-metadata
          node scripts/release.mjs notes --version "$version" \
            --output release-metadata/release-notes.md
          jq -n \
            --arg version "$version" \
            --arg tag "$tag_name" \
            --arg revision "$revision" \
            '{version: $version, tag: $tag, revision: $revision}' \
            > release-metadata/release-manifest.json

          {
            echo "version=$version"
            echo "tag_name=$tag_name"
            echo "revision=$revision"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release identity"
            echo
            echo "- Version: \`$version\`"
            echo "- Tag: \`$tag_name\`"
            echo "- Revision: \`$revision\`"
            echo "- Publish after gates: \`$publish\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata-${{ github.run_id }}
          path: release-metadata/*
          if-no-files-found: error

  parity:
    name: Go and Rust route/behavior alignment gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Install parity tooling
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Enforce Go and Rust alignment contracts
        run: |
          bash apps/api-rust/tests/scripts/check-go-route-manifest.sh
          bash apps/api-rust/tests/scripts/check-complete-route-coverage.sh
          bash apps/api-rust/tests/scripts/test-check-complete-route-coverage.sh
          bash apps/api-rust/tests/behavior-oracle/tests/check-fixtures.sh
          bash apps/api-rust/tests/scripts/check-behavior-deviations.sh
          bash apps/api-rust/tests/scripts/test-check-behavior-deviations.sh
          bash apps/api-rust/tests/scripts/check-migration-plan.sh
          bash apps/api-rust/tests/scripts/test-check-migration-plan.sh

  web:
    name: Build and sign web artifact
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Test and build shared web frontend
        env:
          VITE_REACT_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web test
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

      - name: Verify protected frontend deployment contract
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools
          TMPDIR="$RUNNER_TEMP" bash deploy/test-frontend-release.sh

      - name: Package web artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          bundle="release-web/bundle"
          mkdir -p "$bundle"
          cp -a apps/web/dist "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' "$RELEASE_REVISION" > "$bundle/REVISION"
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          tar -czf "$archive" -C "$bundle" \
            dist LICENSE NOTICE THIRD-PARTY-LICENSES.md REVISION
          (cd release-web && sha256sum "${archive##*/}" > "${archive##*/}.sha256")
          rm -rf -- "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign web artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload signed web release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: release-web/*
          if-no-files-found: error

  go-test:
    name: Test Go backend and independent relaykit
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum

      - name: Check and test default Go module
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -p 2 ./...

      - name: Check, test, and build independent relaykit module
        working-directory: apps/api-go/relaykit
        env:
          GOWORK: 'off'
        run: |
          go vet ./...
          go test -p 2 ./...
          go build -p 2 ./...

  go-build:
    name: Build and sign complete Go linux/${{ matrix.arch }} artifact
    needs: [prepare, web, go-test, parity]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web
          path: release-web

      - name: Build static Go backend and package the complete application
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: '0'
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          artifact="lmm-api-go-${RELEASE_VERSION}-linux-${GOARCH}"
          bundle="release-go/${artifact}"
          mkdir -p "$bundle/frontend-dist"
          (
            cd apps/api-go
            go build -p 2 -trimpath \
              -ldflags="-s -w -X github.com/LIghtJUNction/api.lmm.best/common.Version=${RELEASE_VERSION}" \
              -o "../../${bundle}/lmm-api-go" .
          )
          file "$bundle/lmm-api-go"
          if ldd "$bundle/lmm-api-go" 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo 'Go release binary is dynamically linked' >&2
            exit 1
          fi
          tar -xzf "release-web/lmm-api-web-${RELEASE_VERSION}.tar.gz" \
            -C "$bundle/frontend-dist" --strip-components=1
          cp packaging/common/lmm-api/lmm-api.service "$bundle/"
          cp packaging/common/lmm-api/lmm-api-go.env "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' "$RELEASE_REVISION" > "$bundle/REVISION"
          tar -czf "release-go/${artifact}.tar.gz" -C release-go "$artifact"
          (cd release-go && sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256")
          rm -rf -- "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Go artifact
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-go/lmm-api-go-${RELEASE_VERSION}-linux-${ARCH}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload Go artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-go-linux-${{ matrix.arch }}
          path: release-go/*
          if-no-files-found: error

  rust:
    name: Test, build, and sign Rust linux/amd64 artifact
    needs: [prepare, parity]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Verify Rust backend
        working-directory: apps/api-rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Build and package Rust binaries
        env:
          LMM_BUILD_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --manifest-path apps/api-rust/Cargo.toml --release --locked \
            --package lmm-api-rs --package lmm-db-migrate
          artifact="lmm-api-rs-${RELEASE_VERSION}-linux-amd64"
          bundle="release-rust/${artifact}"
          mkdir -p "$bundle"
          cp apps/api-rust/target/release/lmm-api-rs "$bundle/"
          cp apps/api-rust/target/release/lmm-db-migrate "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' "$RELEASE_REVISION" > "$bundle/REVISION"
          tar -czf "release-rust/${artifact}.tar.gz" -C release-rust "$artifact"
          (cd release-rust && sha256sum "${artifact}.tar.gz" > "${artifact}.tar.gz.sha256")
          rm -rf -- "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Rust artifact
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-rust/lmm-api-rs-${RELEASE_VERSION}-linux-amd64.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload Rust artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rust-linux-amd64
          path: release-rust/*
          if-no-files-found: error

  packaging:
    name: Verify AUR, rollback, and production package contracts
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      - name: Install package contract tools
        run: |
          pacman --sync --refresh --noconfirm git jq libarchive shellcheck
          useradd --create-home package-builder
          install -d -o package-builder -g package-builder /home/package-builder/lmm-ci-tmp

      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Validate release and production packages
        run: |
          chown --recursive package-builder:package-builder "$GITHUB_WORKSPACE"
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-matrix.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-bin-makepkg.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-web-activation.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash deploy/production/test-precutover-packages.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash deploy/production/test-go-package-roundtrip.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash deploy/production/test-go-deploy-contract.sh

  publish:
    name: Publish signed release assets
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.prepare.result == 'success' &&
      needs.parity.result == 'success' &&
      needs.web.result == 'success' &&
      needs.go-build.result == 'success' &&
      needs.rust.result == 'success' &&
      needs.packaging.result == 'success'
    needs: [prepare, parity, web, go-build, rust, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Download verified release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metadata-${{ github.run_id }}
          path: release-metadata

      - name: Publish immutable tag and signed artifacts
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          name: LMM API ${{ needs.prepare.outputs.tag_name }}
          body_path: release-metadata/release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
