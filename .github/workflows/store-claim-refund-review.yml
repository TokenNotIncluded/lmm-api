name: Store claim and refund review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-claim-refund-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: store_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: store_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U store_test -d store_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Install native package fixture tools
        run: sudo apt-get update -qq && sudo apt-get install -y libarchive-tools
      - name: Store, auth and refund regression
        working-directory: apps/api-go
        run: |
          set -o pipefail
          go test -p 2 -count=1 -json -run 'Test(MerchantStore|StoreClaim|ProductionMerchantStore(WriterStatus|WriterTargets|SignedMarkerInventory|ContractCannot|CapsuleClosed))' ./model ./service ./controller ./router . ./internal/appcli ./internal/deploycli | tee "$RUNNER_TEMP/store-go-tests.jsonl"
      - name: Deployment CLI and documentation contracts
        run: |
          python3 -B scripts/check-docs-brand.py --docs-only
          python3 -B -m unittest discover -s scripts -p test_check_docs_brand.py
          python3 -B -m unittest discover -s scripts -p test_qualify_merchant_store_postgres.py
          cd apps/api-go
          go test -p 2 -count=1 ./internal/appcli
      - name: Refund receipt race and actual PostgreSQL locks
        if: ${{ !cancelled() }}
        env:
          MERCHANT_STORE_POSTGRES_TEST_DSN: postgres://store_test:disposable_test_only@127.0.0.1:5432/store_test?sslmode=disable
        working-directory: apps/api-go
        run: |
          set -o pipefail
          go test -p 2 -race -count=1 -json -run 'TestMerchantStore(RefundSync|PickupDenials)' ./model ./service | tee "$RUNNER_TEMP/store-go-race.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-refund-backend-results
          path: ${{ runner.temp }}/store-go-*.jsonl
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.3.14'}
      - name: Install frozen frontend dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Validate complete translations
        run: |
          node --test .agents/skills/i18n-translate/scripts/apply-translations.test.mjs
          cd apps/web
          bun run i18n:sync
          git diff --exit-code -- src/i18n/locales/*.json
      - name: Check frontend types
        working-directory: apps/web
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/store-web-typecheck.log"
      - name: Store and login regression (isolated test processes)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: |
          set -o pipefail
          {
            status=0
            while IFS= read -r -d '' file; do
              bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" || status=1
            done < <(find src/features/store src/features/auth/lib -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/lib/http-client.test.ts || status=1
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/features/forge/home-directory-gesture.test.ts || status=1
            exit "$status"
          } 2>&1 | tee "$RUNNER_TEMP/store-web-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-refund-frontend-results
          path: ${{ runner.temp }}/store-web-*.log
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.3.14'}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/refund-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/refund-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile pickup, sign-in and refund acceptance
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/refund-browser/node_modules/playwright/index.mjs
          STORE_REVIEW_URL: http://127.0.0.1:4183
          STORE_REVIEW_OUTPUT: ${{ runner.temp }}/store-refund-browser
        run: |
          mkdir -p "$STORE_REVIEW_OUTPUT"
          git rev-parse HEAD > "$STORE_REVIEW_OUTPUT/revision.txt"
          bun run build > "$STORE_REVIEW_OUTPUT/build.log" 2>&1
          bun run bundle:check > "$STORE_REVIEW_OUTPUT/bundle-check.log" 2>&1
          bun run preview --host 127.0.0.1 --port 4183 > "$STORE_REVIEW_OUTPUT/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4183/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/store-refund-login-review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-refund-browser-results
          path: ${{ runner.temp }}/store-refund-browser
          retention-days: 7
