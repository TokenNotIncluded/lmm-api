name: Store claim and refund review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-claim-refund-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The legacy monolith tests remain on main. This branch validates the actual
  # Rust core, Go extensions, and store/support PostgreSQL implementation.
  # Module checks do not establish complete migrated payment/refund acceptance.
  backend:
    uses: ./.github/workflows/core-protocol.yml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.3.14'}
      - name: Install frozen frontend dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Validate complete translations
        run: |
          node --test .agents/skills/i18n-translate/scripts/apply-translations.test.mjs
          cd apps/web
          bun run i18n:sync
          git diff --exit-code -- src/i18n/locales/*.json
      - name: Check frontend types
        working-directory: apps/web
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/store-web-typecheck.log"
      - name: Store and login regression (isolated test processes)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: |
          set -o pipefail
          {
            status=0
            while IFS= read -r -d '' file; do
              bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" || status=1
            done < <(find src/features/store src/features/auth/lib -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/lib/http-client.test.ts || status=1
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/features/forge/home-directory-gesture.test.ts || status=1
            exit "$status"
          } 2>&1 | tee "$RUNNER_TEMP/store-web-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-refund-frontend-results
          path: ${{ runner.temp }}/store-web-*.log
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.3.14'}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/refund-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/refund-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile pickup, sign-in and refund acceptance
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/refund-browser/node_modules/playwright/index.mjs
          STORE_REVIEW_URL: http://127.0.0.1:4183
          STORE_REVIEW_OUTPUT: ${{ runner.temp }}/store-refund-browser
        run: |
          mkdir -p "$STORE_REVIEW_OUTPUT"
          git rev-parse HEAD > "$STORE_REVIEW_OUTPUT/revision.txt"
          bun run build > "$STORE_REVIEW_OUTPUT/build.log" 2>&1
          bun run bundle:check > "$STORE_REVIEW_OUTPUT/bundle-check.log" 2>&1
          bun run preview --host 127.0.0.1 --port 4183 > "$STORE_REVIEW_OUTPUT/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4183/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/store-refund-login-review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-refund-browser-results
          path: ${{ runner.temp }}/store-refund-browser
          retention-days: 7
