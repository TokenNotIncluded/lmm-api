name: Settings design review

on:
  push:
    branches: [design/settings-workspace-20260922]
  pull_request:
    paths:
      - 'apps/web/src/features/system-settings/**'
      - 'apps/web/src/components/layout/**'
      - 'apps/web/scripts/visual-review/**'
      - '.github/workflows/settings-design-review.yml'

permissions:
  contents: read

concurrency:
  group: settings-design-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck:web
      - name: Settings regression tests
        working-directory: apps/web
        shell: bash
        run: |
          while IFS= read -r test; do
            bun test "$test"
          done < <(find src/features/system-settings -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
      - name: Build
        run: bun run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated review browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Record real browser interactions
        run: |
          mkdir -p output/settings-review
          git rev-parse HEAD > output/settings-review/commit.txt
          python apps/web/scripts/visual-review/settings_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-visual-review
          path: output/settings-review
          retention-days: 7
