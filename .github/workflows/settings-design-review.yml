name: Settings design review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-design-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck:web
      - name: Settings regression tests
        working-directory: apps/web
        shell: bash
        run: |
          while IFS= read -r test; do
            bun test "$test"
          done < <(find src/features/system-settings -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
      - name: Build
        run: bun run build:web
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install isolated review browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Record real browser interactions
        run: |
          mkdir -p output/settings-review
          git rev-parse HEAD > output/settings-review/commit.txt
          python apps/web/scripts/visual-review/settings_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: settings-visual-review
          path: output/settings-review
          retention-days: 7
