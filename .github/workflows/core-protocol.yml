name: Microkernel implementation checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [wip/rust-core-go-extensions]
    paths:
      - .github/workflows/*.yml
      - services/core/**
      - deployment/docker/**
      - scripts/test-core-*.py
      - scripts/test_core_rpc_fixture.py
      - scripts/workflow-topology.test.mjs
      - .dockerignore
  push:
    branches: [wip/rust-core-go-extensions]
    paths:
      - .github/workflows/core-protocol.yml
      - .github/workflows/ci.yml
      - .github/workflows/server-release-qualification.yml
      - scripts/workflow-topology.test.mjs
      - scripts/local-release-tests.py
      - scripts/test-local-release-tests.py
      - config/*.toml
      - services/core/**
      - services/extensions/**
      - contracts/**
      - deployment/docker/**
      - scripts/generate-core-protocol.sh
      - scripts/test-core-*.py
      - scripts/test_core_rpc_fixture.py
      - scripts/build-distribution.py
      - scripts/test-distribution.py
      - scripts/test-legal-process.py
      - scripts/check-docs-brand.py
      - scripts/test_docs_brand.py
      - scripts/test-docs-microservices.py
      - .github/workflows/microservice-distribution.yml
      - config/legal/**
      - packaging/distribution.json
      - docs/**
      - README.md
      - README_EN.md
      - docs/contributing.md
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: microkernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOWORK: "off"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Initialize the pinned CLI only for archive contract checks
        run: git submodule update --init --depth 1 -- apps/cli
      - name: Record exact integration source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/core-source-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/core-source.tar.gz" HEAD \
            services/core services/extensions contracts deployment/docker scripts \
            .github/workflows config/legal packaging docs/core-migration.md
          sha256sum "$RUNNER_TEMP/core-source.tar.gz" > "$RUNNER_TEMP/core-source.sha256"
      - name: Preserve source before checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: microkernel-source-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-source.tar.gz
            ${{ runner.temp }}/core-source-sha.txt
            ${{ runner.temp }}/core-source.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/extensions/go.sum
      - name: Install pinned Rust and protobuf compiler
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes protobuf-compiler postgresql-client
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Workflow and source boundaries
        run: |
          node --test scripts/workflow-topology.test.mjs
          python3 -B scripts/test-core-boundaries.py
          python3 -B scripts/test-local-release-tests.py
          python3 -B scripts/check-docs-brand.py
          python3 -B scripts/test_docs_brand.py
          python3 -B scripts/test-distribution.py
          python3 -B scripts/test-docs-microservices.py
      - name: Check generated Go bindings
        run: bash scripts/generate-core-protocol.sh --check
      - name: Build actual Go host for Rust stream isolation
        if: ${{ !cancelled() }}
        working-directory: services/extensions
        run: |
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/lmm-extensions" ./cmd/extensions
          echo "LMM_RELAY_EXTENSION_BIN=$RUNNER_TEMP/lmm-extensions" >> "$GITHUB_ENV"
      - name: Public legal reads with the actual Go host
        run: LMM_EXTENSION_TEST_BIN="$RUNNER_TEMP/lmm-extensions" python3 -B scripts/test-legal-process.py
      - name: File-only Compose and private RPC fixture contracts
        run: python3 -B scripts/test_core_rpc_fixture.py -v
      - name: Rust formatting
        working-directory: services/core
        run: cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/core-format.log"
      - name: Rust checks and real database tests
        if: ${{ !cancelled() }}
        working-directory: services/core
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          # Compile once, then bind the real Core child used by all six process tests.
          cargo test --locked --all-targets --no-run
          LMM_MODEL_PROCESS_CORE_BIN="$(realpath target/debug/lmm-core)"
          LMM_MODEL_PROCESS_CORE_SHA256="$(sha256sum "$LMM_MODEL_PROCESS_CORE_BIN" | cut -d ' ' -f1)"
          LMM_MODEL_PROCESS_ROOT="$(mktemp -d /tmp/lmm-model-XXXXXXXX)"
          export LMM_MODEL_PROCESS_CORE_BIN LMM_MODEL_PROCESS_CORE_SHA256 LMM_MODEL_PROCESS_ROOT
          # The non-ignored payment recovery case requires sealed Core, Go host
          # and bootstrap binaries. The 302-second case stays ignored.
          CGO_ENABLED=0 go test -C ../extensions -mod=readonly -c -o "$RUNNER_TEMP/lmm-payment-bootstrap" ./internal/modules/payments
          LMM_PAYMENT_CORE_BIN="$LMM_MODEL_PROCESS_CORE_BIN"
          LMM_PAYMENT_CORE_SHA256="$LMM_MODEL_PROCESS_CORE_SHA256"
          LMM_PAYMENT_GO_BIN="$(realpath "$LMM_RELAY_EXTENSION_BIN")"
          LMM_PAYMENT_GO_SHA256="$(sha256sum "$LMM_PAYMENT_GO_BIN" | cut -d ' ' -f1)"
          LMM_PAYMENT_BOOTSTRAP_BIN="$(realpath "$RUNNER_TEMP/lmm-payment-bootstrap")"
          LMM_PAYMENT_BOOTSTRAP_SHA256="$(sha256sum "$LMM_PAYMENT_BOOTSTRAP_BIN" | cut -d ' ' -f1)"
          export LMM_PAYMENT_CORE_BIN LMM_PAYMENT_CORE_SHA256 LMM_PAYMENT_GO_BIN LMM_PAYMENT_GO_SHA256 LMM_PAYMENT_BOOTSTRAP_BIN LMM_PAYMENT_BOOTSTRAP_SHA256
          cargo test --locked --all-targets --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Go contract and race tests
        if: ${{ !cancelled() }}
        working-directory: services/extensions
        run: |
          bash ../../scripts/check-go-format.sh .
          go mod verify
          go vet ./...
          go test -race ./... -count=1 -json | tee "$RUNNER_TEMP/extension-tests.jsonl"
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/lmm-extensions" ./cmd/extensions
      - name: Store and support real PostgreSQL acceptance
        if: ${{ !cancelled() }}
        env:
          LMM_STORE_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/lmm_store_test?sslmode=disable
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lmm_store_test'
          trap 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS lmm_store_test"' EXIT
          cd services/extensions/internal/modules/store/pgtest
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -json ./... | tee "$RUNNER_TEMP/store-postgres.jsonl"
      - name: Durable cross-language event process recovery
        if: ${{ !cancelled() }}
        run: |
          (cd services/core && cargo build --locked --example protocol-events-fixture)
          (cd contracts/proto/tests/go && go vet -mod=readonly ./... && go build -mod=readonly -o "$RUNNER_TEMP/mk06-go-fixture" .)
          MK06_GO_FIXTURE="$RUNNER_TEMP/mk06-go-fixture" python3 contracts/proto/tests/process_recovery.py 2>&1 | tee "$RUNNER_TEMP/events-process.log"
      - name: Native protobuf round trips and failure recovery
        if: ${{ !cancelled() }}
        run: |
          # Absolute, symlink-free, and absent: the fixture creates a private empty 0700 root.
          evidence="$(realpath -m -- "$RUNNER_TEMP/core-rpc-docker-evidence")"
          if [[ -e "$evidence" || -L "$evidence" ]]; then
            echo "RPC evidence root must be absent before the fixture creates it" >&2
            exit 1
          fi
          python3 -B scripts/test-core-rpc-docker.py --output-root "$evidence" 2>&1 | tee "$RUNNER_TEMP/core-rpc-docker.log"
      - name: Stage readable core RPC evidence
        if: ${{ always() }}
        run: |
          # Secret files are chowned to container uid 65532 and mode 0400.
          # upload-artifact fails the whole zip if any selected file is unreadable.
          src="$RUNNER_TEMP/core-rpc-docker-evidence"
          dest="$RUNNER_TEMP/core-rpc-docker-evidence-readable"
          rm -rf -- "$dest"
          if [[ ! -d "$src" ]]; then
            echo "No core RPC evidence directory to stage"
            exit 0
          fi
          mkdir -- "$dest"
          chmod 0700 -- "$dest"
          while IFS= read -r -d '' dir; do
            rel="${dir#"$src"/}"
            mkdir -p -- "$dest/$rel"
            chmod 0700 -- "$dest/$rel"
          done < <(find "$src" -mindepth 1 -type d -print0)
          while IFS= read -r -d '' file; do
            rel="${file#"$src"/}"
            parent="$dest/$(dirname -- "$rel")"
            mkdir -p -- "$parent"
            chmod 0700 -- "$parent"
            cp -p -- "$file" "$dest/$rel"
          done < <(find "$src" -type f -readable -print0)
      - name: Service boundary contracts
        if: ${{ !cancelled() }}
        run: python3 -B scripts/test-core-boundaries.py
      - name: Preserve implementation test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: microkernel-checks-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-source-sha.txt
            ${{ runner.temp }}/core-format.log
            ${{ runner.temp }}/core-tests.log
            ${{ runner.temp }}/extension-tests.jsonl
            ${{ runner.temp }}/core-rpc-docker.log
            ${{ runner.temp }}/core-rpc-docker-evidence-readable
            ${{ runner.temp }}/store-postgres.jsonl
            ${{ runner.temp }}/events-process.log
          if-no-files-found: warn
          retention-days: 7
  web-billing-management:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact Web source
        run: git rev-parse HEAD > "$RUNNER_TEMP/upstream-web-source.txt"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked Web dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Check frontend types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck:web 2>&1 | tee "$RUNNER_TEMP/upstream-web-types.log"
      - name: Verify billing and management behavior
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: |
          status=0
          for test in \
            src/features/pricing/catalog-contract.test.ts \
            src/features/pricing/components/cache-write-prices.test.tsx \
            src/features/pricing/components/search-prices.test.tsx \
            src/features/pricing/components/embedding-prices.test.tsx \
            src/features/pricing/lib/native-tool-samples.test.ts \
            src/features/usage-logs/lib/__tests__/cache-write-12h.test.ts \
            src/features/usage-logs/components/__tests__/cache-write-12h-display.test.tsx \
            src/features/usage-logs/lib/search-usage.test.ts \
            src/features/usage-logs/lib/embedding-usage.test.ts \
            src/features/usage-logs/lib/csv-export.test.ts \
            src/features/dashboard/lib/usage-bucket.test.ts \
            src/features/dashboard/lib/stats.test.ts \
            src/features/dashboard/components/models/log-stat-cards.test.tsx \
            src/features/profile/lib/notification-preferences.test.ts \
            src/features/routing-admin/helpers.test.ts \
            src/features/routing-admin/api.test.ts \
            src/features/routing-admin/publication-review.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" 2>&1 | tee -a "$RUNNER_TEMP/upstream-web-tests.log" || status=1
          done
          exit "$status"
      - name: Build the production Web bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build:web 2>&1 | tee "$RUNNER_TEMP/upstream-web-build.log"
      - name: Preserve Web evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-web-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-web-*
          if-no-files-found: warn
          retention-days: 7
