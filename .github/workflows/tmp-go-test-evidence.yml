name: TEMP Go test evidence

on:
  push:
    branches:
      - automation/go-321-assistant-contracts

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Capture default Go module tests
        id: gotest
        working-directory: apps/api-go
        shell: bash
        run: |
          set +e
          go test -json -p 2 ./... > "${RUNNER_TEMP}/go-test.json" 2>&1
          status=$?
          grep -E '"Action":"fail"|--- FAIL:|^FAIL([[:space:]]|$)' "${RUNNER_TEMP}/go-test.json" > "${RUNNER_TEMP}/go-test-failures.txt" || true
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload Go test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-go-test-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/go-test.json
            ${{ runner.temp }}/go-test-failures.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test result
        if: steps.gotest.outputs.exit_code != '0'
        run: exit 1
