name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional explicit stable version (overrides bump)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.88.0'

jobs:
  prepare:
    name: Bump versions and finalize changelog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main with complete tag history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Test release metadata tooling
        run: node --test scripts/release.test.mjs

      - name: Prepare version and changelog
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=(prepare --bump "$BUMP")
          if [[ -n "$EXPLICIT_VERSION" ]]; then
            args+=(--version "$EXPLICIT_VERSION")
          fi
          version=$(node scripts/release.mjs "${args[@]}")
          node scripts/release.mjs verify --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate the locked Rust release graph
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup run "$RUST_TOOLCHAIN" cargo metadata \
            --manifest-path apps/api-rust/Cargo.toml --locked --format-version 1 >/dev/null
          node scripts/release.mjs verify --version "$RELEASE_VERSION"

      - name: Reject unexpected release-preparation changes
        run: |
          set -euo pipefail
          allowed=$(mktemp)
          actual=$(mktemp)
          trap 'rm -f -- "$allowed" "$actual"' EXIT
          printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            package.json \
            apps/api-rust/Cargo.lock \
            apps/api-rust/Cargo.toml \
            packaging/aur/lmm-api-go-bin/.SRCINFO \
            packaging/aur/lmm-api-go-bin/PKGBUILD \
            packaging/aur/lmm-api-rs-bin/.SRCINFO \
            packaging/aur/lmm-api-rs-bin/PKGBUILD \
            packaging/local/lmm-api-go/PKGBUILD | sort > "$allowed"
          git diff --name-only | sort > "$actual"
          if ! cmp -s "$allowed" "$actual"; then
            echo 'release preparation changed an unexpected file or missed a version source' >&2
            diff -u "$allowed" "$actual" || true
            exit 1
          fi

      - name: Open or update the release pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: release/v${{ steps.release.outputs.version }}
          delete-branch: true
          commit-message: 'chore(release): prepare v${{ steps.release.outputs.version }}'
          title: 'chore(release): prepare v${{ steps.release.outputs.version }}'
          body: |
            Prepares `${{ steps.release.outputs.tag }}`.

            - Synchronizes every authoritative product version source.
            - Moves `CHANGELOG.md` Unreleased notes into the dated release section.
            - Refreshes GitHub comparison links and validates locked Rust metadata.

            Merging this PR runs the full CI suite. After CI succeeds, the promotion
            workflow creates the immutable version tag and dispatches the signed
            release-bundle workflow from that tag. Publication remains gated on every
            release build and verification job succeeding.

      - name: Summarize release preparation
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Release preparation"
            echo
            echo "- Version: \`$RELEASE_TAG\`"
            echo "- Pull request: $PR_URL"
            echo "- Publication: gated on main CI, immutable tag promotion, and successful signed builds"
          } >> "$GITHUB_STEP_SUMMARY"
