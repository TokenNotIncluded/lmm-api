name: Rust security audit

on:
  push:
    paths:
      - 'apps/api-rust/Cargo.toml'
      - 'apps/api-rust/Cargo.lock'
      - '.github/workflows/rust-security-audit.yml'
  pull_request:
    paths:
      - 'apps/api-rust/Cargo.toml'
      - 'apps/api-rust/Cargo.lock'
      - '.github/workflows/rust-security-audit.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: rust-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24 support
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/api-rust
