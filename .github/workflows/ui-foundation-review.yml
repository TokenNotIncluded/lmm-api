name: UI foundation review

on:
  pull_request:
    paths:
      - 'apps/web/src/components/ui/**'
      - 'apps/web/src/features/auth/otp/**'
      - 'apps/web/src/features/debug/ui-foundation-*.tsx'
      - 'apps/web/src/debug-main.tsx'
      - 'apps/web/scripts/ui-foundation-review.mjs'
      - 'apps/web/package.json'
      - 'bun.lock'
      - '.github/workflows/ui-foundation-review.yml'

permissions:
  contents: read

concurrency:
  group: ui-foundation-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated browser tooling
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/ui-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Validate foundation behavior and capture actual components
        working-directory: apps/web
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ui-browser/node_modules/playwright/index.mjs
          CONSOLE_REVIEW_OUTPUT: ${{ runner.temp }}/ui-foundation
        run: |
          mkdir -p "$CONSOLE_REVIEW_OUTPUT"
          git rev-parse HEAD > "$CONSOLE_REVIEW_OUTPUT/revision.txt"
          LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$CONSOLE_REVIEW_OUTPUT/dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/ui-foundation-review.mjs
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-foundation-review
          path: ${{ runner.temp }}/ui-foundation
          retention-days: 7
          if-no-files-found: error
