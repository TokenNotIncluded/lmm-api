name: LMM CLI

on:
  workflow_dispatch:

permissions:
  contents: read

# Only retained client/frontend code is checked here. The old Go business
# implementation was removed; this does not qualify its future replacement.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - name: Initialize the pinned CLI only
        working-directory: .
        run: git submodule update --init --depth 1 -- apps/cli
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: lmm-preview-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/cli/target/release/lmm
            apps/cli/target/release/lmm.exe
