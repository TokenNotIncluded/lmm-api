name: LMM Go backend release

on:
  push:
    tags:
      - 'go-v*.*.*'

permissions:
  contents: read

concurrency:
  group: go-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  GOMAXPROCS: '2'

jobs:
  prepare:
    name: Verify immutable Go release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify version and tag
        id: identity
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$GITHUB_SHA" ]]
          version=${GITHUB_REF_NAME#go-v}
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # AUR metadata remains on the last published version until signed
          # assets exist and their immutable hashes can be pinned.  Requiring
          # pkgver to equal the tag here creates a circular, wrong-hash commit.
          aur_version=$(sed -n 's/^pkgver=//p' packaging/aur/lmm-api-go-bin/PKGBUILD)
          [[ "$aur_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$aur_version" != "$version" ]]
          [[ $(printf '%s\n%s\n' "$aur_version" "$version" | sort -V | tail -n 1) == "$version" ]]
          [[ $(git rev-list -n 1 "$GITHUB_REF_NAME") == "$revision" ]]
          {
            echo "version=$version"
            echo "revision=$revision"
          } >>"$GITHUB_OUTPUT"

  web:
    name: Build bundled fallback frontend
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify and build fallback frontend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          VITE_REACT_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web test
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

      - name: Upload fallback frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-release-web-${{ github.run_id }}
          path: apps/web/dist
          if-no-files-found: error

  test:
    name: Test Go backend
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum

      - name: Check and test default Go module
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -p 2 ./...

      - name: Check independent relaykit module
        working-directory: apps/api-go/relaykit
        env:
          GOWORK: 'off'
        run: |
          go vet ./...
          go test -p 2 ./...
          go build -p 2 ./...

  package-contract:
    name: Verify Go AUR and deployment contracts
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      - name: Install package contract tools
        run: |
          pacman --sync --refresh --noconfirm git jq libarchive shellcheck
          useradd --create-home package-builder
          install -d -o package-builder -g package-builder /home/package-builder/lmm-ci-tmp

      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Validate Go package metadata
        run: |
          set -euo pipefail
          pkg=packaging/aur/lmm-api-go-bin
          bash -n "$pkg/PKGBUILD"
          shellcheck -s bash -e SC2034,SC2154 "$pkg/PKGBUILD"
          chown --recursive package-builder:package-builder "$GITHUB_WORKSPACE"
          runuser --user package-builder -- makepkg --printsrcinfo --dir "$pkg" >generated.SRCINFO
          cmp -s generated.SRCINFO "$pkg/.SRCINFO"
          grep -Fq 'cosign verify-blob' "$pkg/PKGBUILD"
          grep -Fq '.github/workflows/release-go.yml@refs/tags/' "$pkg/PKGBUILD"
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp \
            bash deploy/production/test-go-package-roundtrip.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp \
            bash deploy/production/test-go-rollback-state-machine.sh

  build:
    name: Build and sign Go linux/${{ matrix.arch }}
    needs: [prepare, web, test, package-contract]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Download fallback frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-release-web-${{ github.run_id }}
          path: frontend-dist

      - name: Build static backend and immutable archive
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: '0'
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          artifact="lmm-api-go-${RELEASE_VERSION}-linux-${GOARCH}"
          bundle="release-go/${artifact}"
          mkdir -p "$bundle/frontend-dist"
          (
            cd apps/api-go
            go build -p 2 -trimpath \
              -ldflags="-s -w -X github.com/LIghtJUNction/api.lmm.best/common.Version=${RELEASE_VERSION}" \
              -o "../../${bundle}/lmm-api-go" .
          )
          file "$bundle/lmm-api-go"
          if ldd "$bundle/lmm-api-go" 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo 'Go release binary is dynamically linked' >&2
            exit 1
          fi
          cp -a frontend-dist/. "$bundle/frontend-dist/"
          cp packaging/common/lmm-api/lmm-api.service "$bundle/"
          cp packaging/common/lmm-api/lmm-api-go.env "$bundle/"
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "$bundle/"
          printf '%s\n' "$RELEASE_REVISION" >"$bundle/REVISION"
          tar -czf "release-go/${artifact}.tar.gz" -C release-go "$artifact"
          (cd release-go && sha256sum "${artifact}.tar.gz" >"${artifact}.tar.gz.sha256")
          rm -rf -- "$bundle"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Go artifact
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="release-go/lmm-api-go-${RELEASE_VERSION}-linux-${ARCH}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Upload signed Go artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-release-linux-${{ matrix.arch }}
          path: release-go/*
          if-no-files-found: error

  publish:
    name: Publish signed Go release
    needs: [prepare, web, test, package-contract, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Go artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: go-release-linux-*
          path: release-assets
          merge-multiple: true

      - name: Publish immutable Go release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          name: LMM Go backend ${{ github.ref_name }}
          body: |
            Independent production Go backend release.

            Revision: `${{ needs.prepare.outputs.revision }}`
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
