name: Apply assistant agent liveness patch

on:
  push:
    branches: [fix/assistant-agent-liveness]
    paths: [.github/workflows/assistant-agent-repair.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/assistant-repair/patch.* | base64 -d | xz -d > "$RUNNER_TEMP/assistant-agent-liveness.patch"
          actual="$(sha256sum "$RUNNER_TEMP/assistant-agent-liveness.patch" | awk '{print $1}')"
          test "$actual" = "3d970275e309e63730a5a53778a39e1aca2ce1e6532ce1d9a5e702c580b66532"
          git apply --check "$RUNNER_TEMP/assistant-agent-liveness.patch"
          git apply "$RUNNER_TEMP/assistant-agent-liveness.patch"
          git diff --check
      - name: Remove staging transport
        shell: bash
        run: |
          rm -rf .github/assistant-repair
          rm -f .github/workflows/assistant-agent-repair.yml
      - name: Commit repaired agent loop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LIghtJUNction"
          git config user.email "lightjunction.me@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(assistant): bound agent execution and recovery"
          git push origin HEAD:fix/assistant-agent-liveness
