name: Assistant final validation
on:
  push:
    branches: ['assistant/l0-evidence-tools-20260916']
    paths: ['.github/workflows/assistant-final-validation.yml']
permissions:
  contents: read
jobs:
  fix-and-web:
    if: github.repository == 'LIghtJUNction/api.lmm.best' && github.ref == 'refs/heads/assistant/l0-evidence-tools-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: assistant/l0-evidence-tools-20260916
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Correct validated contracts
        env:
          FIX_DATA: ''
        run: |
          python3 - <<'PY'
          import os, pathlib, base64, lzma, json, hashlib
          blob = base64.b64decode(os.environ['FIX_DATA'], validate=True)
          assert hashlib.sha256(blob).hexdigest() == 'f67db6130b797ae2e4ff17e0c13831d3615329b229c5488cfb26d2f6883bfca8'
          outputs = {}
          for row in json.loads(lzma.decompress(blob)):
              p = pathlib.Path(row['path'])
              assert row['path'].startswith('apps/web/src/') and '..' not in p.parts and not p.is_symlink()
              old = p.read_bytes()
              assert hashlib.sha256(old).hexdigest() == row['old'], str(p)
              lines = old.decode().splitlines(keepends=True)
              for i,j,text in reversed(row['changes']): lines[i:j] = [text]
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == row['new'], str(p)
              outputs[p] = result
          for p,b in outputs.items(): p.write_bytes(b)
          PY
      - name: Format changed frontend files using protected-header formatter
        run: |
          git diff --name-only 44ac6af15180d9de0b81ed2f358660a181a3e31e -- apps/web > /tmp/assistant-allowed-format-paths
          bun run --filter @lmm/web format
          python3 - <<'PY'
          import pathlib, subprocess
          allowed = set(pathlib.Path('/tmp/assistant-allowed-format-paths').read_text().splitlines())
          changed = subprocess.check_output(['git','diff','--name-only','--','apps/web'],text=True).splitlines()
          for path in changed:
              if path not in allowed: subprocess.run(['git','restore','--',path],check=True)
          PY
      - name: Commit corrections to the feature branch
        id: commit
        run: |
          test "$GITHUB_REF" = refs/heads/assistant/l0-evidence-tools-20260916
          rm .github/workflows/assistant-final-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web .github/workflows/assistant-final-validation.yml
          git diff --cached --check
          git commit -m 'fix(assistant): align registration UI contracts and regression coverage'
          git push origin HEAD:refs/heads/assistant/l0-evidence-tools-20260916
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/assistant-final-results
          git archive --format=tar HEAD > /tmp/assistant-final-results/source.tar
      - name: Validate web contracts, regressions and production build
        working-directory: apps/web
        shell: bash
        run: |
          status=0
          bun run typecheck 2>&1 | tee /tmp/assistant-final-results/typecheck.log || status=1
          bun run lint 2>&1 | tee /tmp/assistant-final-results/lint.log || status=1
          bun run copyright:check 2>&1 | tee /tmp/assistant-final-results/copyright.log || status=1
          for file in src/features/assistant/assistant-registration-state.test.ts src/features/assistant/assistant-activation-tool.test.tsx src/features/system-settings/content/assistant-settings-section.test.tsx; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$file" 2>&1 | tee "/tmp/assistant-final-results/$(basename "$file").log" || status=1
          done
          bun run build 2>&1 | tee /tmp/assistant-final-results/build.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assistant-final-web-and-source
          path: /tmp/assistant-final-results
          retention-days: 3
  go-regression:
    needs: fix-and-web
    if: always() && needs.fix-and-web.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.fix-and-web.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Run full affected-package regression suites
        working-directory: apps/api-go
        shell: bash
        run: |
          mkdir -p /tmp/assistant-final-go
          go test -p 2 -timeout 180s ./model ./controller ./service ./internal/registrationguard -count=1 2>&1 | tee /tmp/assistant-final-go/regression.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assistant-final-go-regression
          path: /tmp/assistant-final-go
          retention-days: 3
