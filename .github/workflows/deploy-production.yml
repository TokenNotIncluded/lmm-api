name: LMM production auto deploy

on:
  workflow_run:
    workflows:
      - LMM Go backend release
      - LMM web release
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-auto-deploy
  cancel-in-progress: false

jobs:
  legacy-route:
    name: Select legacy release deployment
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'go-v') ||
       startsWith(github.event.workflow_run.head_branch, 'web-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.route.outputs.required }}
    steps:
      - name: Inspect immutable release source without production credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip releases that already own their deployment job
        id: route
        run: |
          if [[ -f .github/actions/deploy-production/action.yml ]]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  reject-legacy-deploy:
    needs: legacy-route
    name: Reject the retired overwrite-deployment fallback
    if: needs.legacy-route.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deliberately no production environment, credentials or remote commands.
    steps:
      - name: Require a release with the reviewed deployment action
        run: |
          echo '::error::This legacy release has no deployment action. Automatic fallback deployment is retired; use a newly verified release or explicit native incident recovery.'
          exit 1
