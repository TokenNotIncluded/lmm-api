name: LMM production auto deploy

on:
  push:
    branches: [main]
    paths: [.github/server-ops-343-request.json]
  workflow_run:
    workflows:
      - LMM Go backend release
      - LMM web release
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-auto-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified release to ArchDmit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'go-v') ||
       startsWith(github.event.workflow_run.head_branch, 'web-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - name: Checkout the exact released revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install deployment tools
        run: |
          sudo apt-get update
          # Use the runner Docker installation, not the conflicting docker.io package.
          sudo apt-get install --yes jq openssh-client
          docker --version
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify deployment credentials are configured
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PRODUCTION_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
      - name: Stage and promote the verified release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/auto-deploy-production-release.sh
      - name: Verify public pages, backend version and referenced assets
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          arguments=()
          if [[ "$RELEASE_TAG" == go-v* ]]; then
            arguments+=(--expected-backend-version "${RELEASE_TAG#go-v}")
          fi
          python3 -B scripts/verify-public-production.py "${arguments[@]}"
          {
            echo '## Public release acceptance passed'
            echo 'The public API, frontend entry pages and their JavaScript/CSS resources were checked.'
            echo 'This read-only check does not confirm or bypass the native production transaction. Follow its recorded confirmation/rollback state.'
          } >> "$GITHUB_STEP_SUMMARY"

  owner-incident-diagnosis:
    name: Owner-requested read-only startup diagnosis
    if: >-
      github.event_name == 'push' &&
      github.repository == 'TokenNotIncluded/api.lmm.best' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'LIghtJUNction' &&
      github.triggering_actor == 'LIghtJUNction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout the exact owner request and parent
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Test diagnosis and authorization before credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/server-ops-transport.py)" = 291b68df38ec40005872060aac98a4a4631a79af
          python3 scripts/test-server-repair-startup.py
          python3 scripts/test-server-ops-commit-request.py
      - name: Validate explicit owner request
        run: python3 scripts/server-ops-commit-request.py --validate-only
      - name: Run only the pinned read-only diagnostic in the existing production environment
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: python3 scripts/server-ops-commit-request.py
