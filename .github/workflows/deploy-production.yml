name: LMM production auto deploy

on:
  push:
    branches: [main]
    paths: [.github/server-ops-343-request.json]
  workflow_run:
    workflows:
      - LMM Go backend release
      - LMM web release
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-auto-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified release to ArchDmit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'go-v') ||
       startsWith(github.event.workflow_run.head_branch, 'web-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - name: Checkout the exact released revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install deployment tools
        run: |
          sudo apt-get update
          # Use the runner Docker installation, not the conflicting docker.io package.
          sudo apt-get install --yes jq openssh-client
          docker --version
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify deployment credentials are configured
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PRODUCTION_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
      - name: Stage and promote the verified release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/auto-deploy-production-release.sh
      - name: Verify public pages, backend version and referenced assets
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          arguments=()
          if [[ "$RELEASE_TAG" == go-v* ]]; then
            arguments+=(--expected-backend-version "${RELEASE_TAG#go-v}")
          fi
          python3 -B scripts/verify-public-production.py "${arguments[@]}"
          {
            echo '## Public release acceptance passed'
            echo 'The public API, frontend entry pages and their JavaScript/CSS resources were checked.'
            echo 'This read-only check does not confirm or bypass the native production transaction. Follow its recorded confirmation/rollback state.'
          } >> "$GITHUB_STEP_SUMMARY"

  owner-incident-diagnosis:
    name: Owner-requested incident operation
    if: >-
      github.event_name == 'push' &&
      github.repository == 'TokenNotIncluded/api.lmm.best' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'LIghtJUNction' &&
      github.triggering_actor == 'LIghtJUNction'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lmm_test_release
          POSTGRES_USER: lmm_test_release
          POSTGRES_PASSWORD: lmm-release-postgres-password
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U lmm_test_release -d lmm_test_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout the exact owner request and parent
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Test authorization and transport before credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/server-ops-transport.py)" = 291b68df38ec40005872060aac98a4a4631a79af
          python3 scripts/test-server-repair-startup.py
          python3 scripts/test-server-ops-commit-request.py
          python3 scripts/test-server-ops-helper-payload.py
      - name: Validate explicit owner request
        id: request
        run: python3 scripts/server-ops-commit-request.py --validate-only
      - name: Set up Go for the fixed recovery helper
        if: steps.request.outputs.operation == 'recover-red-packet-schema-343'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Install local recovery test tools
        if: steps.request.outputs.operation == 'recover-red-packet-schema-343'
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools
      - name: Retest and build the exact helper without production credentials
        if: steps.request.outputs.operation == 'recover-red-packet-schema-343'
        working-directory: apps/api-go
        env:
          LMM_INCIDENT343_TEST_DSN: postgres://lmm_test_release:lmm-release-postgres-password@127.0.0.1:5432/lmm_test_release?sslmode=disable
        run: |
          set -euo pipefail
          git diff --exit-code
          go test -race -count=1 ./internal/appcli ./cmd/incident343-recovery -timeout 180s
          mkdir -p "$RUNNER_TEMP/lmm-incident343"
          CGO_ENABLED=0 go build -p 2 -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/lmm-incident343/incident343-recovery" ./cmd/incident343-recovery
          git diff --exit-code
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'lmm-incident343'
          binary=root/'incident343-recovery'
          receipt={'revision':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(binary.read_bytes()).hexdigest()}
          (root/'receipt.json').write_text(json.dumps(receipt)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Execute only the explicitly requested fixed operation
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: python3 scripts/server-ops-commit-request.py
