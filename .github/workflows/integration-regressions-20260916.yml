name: Integrated interaction regressions

on:
  push:
    branches: [integration/pr-merge-20260916]
    paths: [.github/workflows/integration-regressions-20260916.yml]

permissions:
  contents: write

concurrency:
  group: integrated-interaction-regressions
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply reviewed compatibility fixes and test contracts
        run: |
          mkdir -p integration-evidence
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, before, after, count=1):
              p=Path(path);s=p.read_text();assert s.count(before)==count,(path,before);p.write_text(s.replace(before,after))
          path='apps/web/src/features/home/home-motion.ts'
          replace(path,'new IntersectionObserver(', 'new window.IntersectionObserver(')
          replace(path,'new ResizeObserver(', 'new window.ResizeObserver(')
          path='apps/web/src/features/assistant/assistant-support-review.test.tsx'
          replace(path,"'#assistant-handoff-message'", "'[role=\"dialog\"] textarea'", 2)
          replace(path,"    assert.equal(textarea.value, '')", "    assert.ok(textarea.id)\n    const label = [...document.querySelectorAll<HTMLLabelElement>('[role=\"dialog\"] label')].find((candidate) => candidate.htmlFor === textarea.id)\n    assert.ok(label, 'The unique message input must retain its visible label')\n    assert.equal(textarea.value, '')")
          path='apps/web/src/features/forge/forge-home.test.tsx'
          replace(path,'.forge-home-destinations a[href=', '.lmm-destinations a[href=',2)
          path='apps/web/src/features/forge/forge-home-mobile.test.ts'
          p=Path(path);s=p.read_text();start=s.index("test('scroll animation is progressive and has a reduced-motion fallback'")
          s=s[:start]+'''const motion = readFileSync(
            new URL('../home/home-motion.ts', import.meta.url),
            'utf8'
          )

          test('scroll animation owns a bounded lifecycle and retains a static fallback', () => {
            assert.match(css, /prefers-reduced-motion: reduce/)
            assert.match(css, /animation: none !important/)
            assert.match(css, /transition: none !important/)
            assert.ok(css.includes(".lmm-story:not([data-chapter]) [data-story-panel='2']"))
            assert.match(motion, /IntersectionObserver.*in window/)
            assert.match(motion, /ResizeObserver.*in window/)
            assert.match(motion, /new window\\.IntersectionObserver/)
            assert.match(motion, /new window\\.ResizeObserver/)
            assert.match(motion, /prefers-reduced-motion: reduce/)
            assert.match(motion, /document\\.hidden/)
            assert.match(motion, /cancelAnimationFrame\\(frame\\)/)
            assert.match(motion, /observer\\.disconnect\\(\\)/)
            assert.match(motion, /resizeObserver\\.disconnect\\(\\)/)
            assert.match(motion, /removeEventListener\\('scroll', update, true\\)/)
            assert.doesNotMatch(source, /addEventListener\\(['"]scroll/)
          })
          '''
          p.write_text(s)
          PY
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile 2>&1 | tee integration-evidence/install.log
      - name: Format source with preserved license headers
        run: bun run --filter @lmm/web format 2>&1 | tee integration-evidence/format.log
      - name: Lint, copyright, and typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --filter @lmm/web lint 2>&1 | tee integration-evidence/lint.log
          bun run --filter @lmm/web copyright:check 2>&1 | tee integration-evidence/copyright.log
          bun run --filter @lmm/web typecheck 2>&1 | tee integration-evidence/typecheck.log
      - name: Execute all source and script tests with repository preload and timeout
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          web=Path('apps/web')
          tests=sorted(p for p in (web/'src').rglob('*.test.*') if p.suffix in ('.ts','.tsx'))
          tests+=sorted((web/'scripts').rglob('*.test.mjs'))
          result=[]
          with Path('integration-evidence/test.log').open('w') as output:
            for path in tests:
              relative=str(path.relative_to(web))
              command=['node','--test','./'+relative] if path.suffix=='.mjs' else ['bun','test','--preload','./scripts/test-preload.mjs','--timeout','15000','./'+relative]
              completed=subprocess.run(command,cwd=web,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              output.write(completed.stdout+'\n');output.flush()
              result.append({'file':relative,'exit_code':completed.returncode})
              print(relative,completed.returncode,flush=True)
          Path('integration-evidence/test-report.json').write_text(json.dumps(result,indent=2))
          raise SystemExit(any(row['exit_code'] for row in result))
          PY
      - name: Publish reviewed source to isolated integration branch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/integration/pr-merge-20260916'
          test "$(git ls-remote origin refs/heads/integration/pr-merge-20260916 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/integration-regressions-20260916.yml
          git add -- apps/web/src/features/home/home-motion.ts apps/web/src/features/assistant/assistant-support-review.test.tsx apps/web/src/features/forge/forge-home.test.tsx apps/web/src/features/forge/forge-home-mobile.test.ts
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(web): align observer ownership and integrated interaction contracts'
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$basic_auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" push origin HEAD:refs/heads/integration/pr-merge-20260916
          git rev-parse HEAD > integration-evidence/source-head.txt
      - name: Build and enforce unchanged resource budgets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --filter @lmm/web build 2>&1 | tee integration-evidence/build.log
          bun run --filter @lmm/web bundle:check 2>&1 | tee integration-evidence/bundle-check.log
      - name: Archive source and evidence
        if: ${{ always() }}
        run: |
          git diff -- apps > integration-evidence/uncommitted-source.patch
          git bundle create integration-evidence/integration.bundle HEAD
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-interaction-regressions-${{ github.sha }}
          path: integration-evidence/
          retention-days: 3
          if-no-files-found: error
