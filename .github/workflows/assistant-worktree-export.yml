name: Assistant worktree export
on:
  push:
    branches: ['assistant/l0-evidence-tools-20260916']
    paths: ['.github/workflows/assistant-worktree-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked worktree only
        run: git archive --format=tar HEAD > /tmp/assistant-worktree.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-worktree
          path: /tmp/assistant-worktree.tar
          retention-days: 1
