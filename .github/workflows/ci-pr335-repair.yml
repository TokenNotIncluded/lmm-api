name: PR 335 one-shot generated repairs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pr335-generated-repairs
  cancel-in-progress: false

env:
  TARGET_BRANCH: ci/fail-closed-quality-gates-20260916
  EXPECTED_PARENT: ba209e95b38a7e4a109b628129814fd9e0a1c471
  ALLOWED_PATHS: |
    apps/api-go/controller/assistant_admin_operation_contracts.json
    apps/web/scripts/assistant-tool-copy.mjs
    apps/web/src/components/ui/markdown.test.ts
    apps/web/src/components/ui/markdown.tsx
    apps/web/src/features/assistant/assistant-activation-tool.tsx
    apps/web/src/features/assistant/assistant-panel.test.tsx
    apps/web/src/features/onboarding/getting-started.tsx
    apps/web/src/features/red-packets/index.tsx
    apps/web/src/features/red-packets/public.tsx
    apps/web/src/features/redemption-codes/components/__tests__/redemptions-mutate-drawer.test.tsx
    apps/web/src/features/redemption-codes/components/redemptions-mutate-drawer.tsx
    apps/web/src/features/users/components/developer-access-requests-panel.test.tsx
    apps/web/src/features/users/components/developer-access-requests-panel.tsx
    apps/web/src/features/wallet/hooks/use-redemption.ts

jobs:
  generate:
    if: >-
      github.repository == 'TokenNotIncluded/api.lmm.best' &&
      github.event.pull_request.number == 335 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/fail-closed-quality-gates-20260916' &&
      github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact PR head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Restrict this helper to its single initial commit
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Install locked formatter dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply the repository's copyright-preserving formatter
        run: |
          bun run --filter @lmm/web format
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
      - name: Regenerate the source-derived request contracts
        working-directory: apps/api-go
        env:
          GOWORK: "off"
        run: go run ./cmd/assistant-contracts -root .
      - name: Reject out-of-scope changes and export the patch
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          allowed = set(os.environ['ALLOWED_PATHS'].splitlines())
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changes: {sorted(unexpected)}')
          print('Generated changes:', *sorted(changed), sep='\n')
          PY
          git diff --check
          git diff --binary > "$RUNNER_TEMP/generated.patch"
      - name: Upload only the generated source patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr335-generated-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/generated.patch
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the exact PR head without executing repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download this run's generated patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr335-generated-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr335-repair
      - name: Validate and stage only the reviewed file allowlist
        run: |
          patch="$RUNNER_TEMP/pr335-repair/generated.patch"
          if [ ! -s "$patch" ]; then
            exit 0
          fi
          git apply --check "$patch"
          git apply "$patch"
          python3 - <<'PY'
          import os
          import subprocess
          allowed = set(os.environ['ALLOWED_PATHS'].splitlines())
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changes: {sorted(unexpected)}')
          if changed:
              subprocess.run(['git', 'add', '--', *sorted(changed)], check=True)
          PY
          git diff --cached --check
      - name: Commit the generated fixes without overwriting concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(ci): format protected web sources and refresh assistant contracts'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
