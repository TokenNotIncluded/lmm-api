name: CI
on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Git ref for the translation regression comparison
        default: HEAD^
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: "true"
jobs:
  microkernel:
    uses: ./.github/workflows/core-protocol.yml
  web:
    name: Web checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run --filter @lmm/web format:check

      - name: Check copyright headers
        run: bun run --filter @lmm/web copyright:check

      - name: Lint and typecheck
        run: |
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck

      - name: Test web workspace
        run: |
          bun run --filter @lmm/web test
          node --test scripts/service-unavailable.test.mjs

      - name: Human-support confirmation regressions
        working-directory: apps/web
        run: |
          for test in \
            assistant-handoff-confirmation.test.ts \
            assistant-handoff-tool.test.tsx \
            assistant-handoff-review.test.tsx
          do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./src/features/assistant/$test"
          done

      - name: Build production web assets
        env:
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: |
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

  translations:
    name: Translation regression check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Use the PR merge ref so older branches receive the current checker.
          fetch-depth: 0
          persist-credentials: false

      - name: Test the translation checker
        run: node --test scripts/check-i18n.test.mjs

      - name: Check added keys and removed translations
        # The checker still runs on tags; only the branch comparison is inapplicable.
        if: github.ref_type != 'tag'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base-ref || 'HEAD^' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            node scripts/check-i18n.mjs --base "$BASE_REF" --merge-base
          else
            node scripts/check-i18n.mjs --base "$BASE_REF"
          fi

  quality-gate:
    name: Implemented component checks
    if: ${{ always() }}
    needs: [microkernel, web, translations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every implemented component
        env:
          KERNEL_RESULT: ${{ needs.microkernel.result }}
          WEB_RESULT: ${{ needs.web.result }}
          TRANSLATION_RESULT: ${{ needs.translations.result }}
        run: |
          test "$KERNEL_RESULT" = success
          test "$WEB_RESULT" = success
          test "$TRANSLATION_RESULT" = success
          echo 'These checks do not authorize production deployment.'
