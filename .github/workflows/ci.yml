name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: "true"
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TOOLCHAIN: "1.91.0"

jobs:
  repository-contracts:
    name: Workflow and resource-safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go for actionlint
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Lint workflow definitions
        env:
          GOWORK: "off"
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Install repository contract tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nginx ripgrep
          test "$(command -v rg)" = /usr/bin/rg

      - name: Validate read-only production inspectors
        run: |
          shellcheck \
            .agents/skills/lmm-deploy-safely/scripts/inspect-state.sh \
            .agents/skills/lmm-deploy-safely/scripts/tests/test-inspect-state.sh \
            .agents/skills/lmm-deploy-safely/scripts/resource-pressure-report.sh \
            .agents/skills/lmm-deploy-safely/scripts/tests/test-resource-pressure-report.sh
          bash .agents/skills/lmm-deploy-safely/scripts/tests/test-inspect-state.sh
          bash .agents/skills/lmm-deploy-safely/scripts/tests/test-resource-pressure-report.sh

      - name: Test component release governance tooling
        run: |
          shellcheck \
            scripts/verify-release-commit-checks.sh \
            scripts/test-verify-release-commit-checks.sh \
            packaging/aur/check-candidate-version.sh \
            packaging/aur/export-go-package-base.sh \
            packaging/aur/test-export-go-package-base.sh
          bash scripts/test-verify-release-commit-checks.sh

      - name: Validate real integration gate contracts
        run: |
          shellcheck \
            apps/api-rust/tests/scripts/check-real-integration-gates.sh \
            apps/api-rust/tests/scripts/run-real-integration-gates.sh
          bash apps/api-rust/tests/scripts/check-real-integration-gates.sh

  release-artifact-contract:
    name: Release artifact contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Install archive inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libarchive-tools
          test "$(command -v bsdtar)" = /usr/bin/bsdtar

      - name: Verify immutable release, provider, and package contracts
        working-directory: apps/api-go
        env:
          TMPDIR: ${{ runner.temp }}
        run: go test -p 2 ./internal/appcli -count=1

  web:
    name: Web checks, route manifest, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and copyright headers
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check

      - name: Lint and typecheck
        run: |
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck

      - name: Test web workspace
        run: bun run --filter @lmm/web test

      - name: Validate frontend API route manifest
        run: bash apps/api-rust/tests/behavior-oracle/tests/test-frontend-api-route-manifest.sh

      - name: Build production web assets
        env:
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: |
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

  go:
    name: Go default backend, relaykit, and static build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum

      - name: Check formatting and static analysis
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Install production contract tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libarchive-tools
          test "$(command -v bsdtar)" = /usr/bin/bsdtar
          bsdtar --version | head -1

      - name: Test default Go module
        working-directory: apps/api-go
        run: go test -p 2 ./...

      - name: Test and build independent relaykit module
        working-directory: apps/api-go/relaykit
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          go test -p 2 ./...
          go build -p 2 ./...

      - name: Build static Go production binary
        working-directory: apps/api-go
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          go build -p 2 -trimpath -ldflags="-s -w" -o out/lmm-api .
          file out/lmm-api
          if ldd out/lmm-api 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo 'Go production binary is dynamically linked' >&2
            exit 1
          fi

  rust-preview:
    name: Rust backend formatting, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install route coverage tooling
        run: |
          rg_version=14.1.1
          rg_archive="ripgrep-${rg_version}-x86_64-unknown-linux-musl.tar.gz"
          rg_dir="$RUNNER_TEMP/ripgrep"
          mkdir -p "$rg_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/BurntSushi/ripgrep/releases/download/${rg_version}/${rg_archive}" \
            --output "$rg_dir/$rg_archive"
          printf '%s  %s\n' \
            4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e \
            "$rg_dir/$rg_archive" | sha256sum --check --status -
          tar -xzf "$rg_dir/$rg_archive" -C "$rg_dir"
          install -m0755 "$rg_dir/ripgrep-${rg_version}-x86_64-unknown-linux-musl/rg" "$rg_dir/rg"
          echo "$rg_dir" >> "$GITHUB_PATH"
          "$rg_dir/rg" --version | head -1

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose

      - name: Check formatting
        working-directory: apps/api-rust
        run: cargo fmt --all --check

      - name: Lint workspace
        working-directory: apps/api-rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        working-directory: apps/api-rust
        run: cargo test --workspace --all-targets --all-features --locked

  route-coverage-contract:
    name: Go and Rust route/behavior alignment gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go for route manifest checks
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Install route coverage tooling
        run: |
          rg_version=14.1.1
          rg_archive="ripgrep-${rg_version}-x86_64-unknown-linux-musl.tar.gz"
          rg_dir="$RUNNER_TEMP/ripgrep"
          mkdir -p "$rg_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/BurntSushi/ripgrep/releases/download/${rg_version}/${rg_archive}" \
            --output "$rg_dir/$rg_archive"
          printf '%s  %s\n' \
            4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e \
            "$rg_dir/$rg_archive" | sha256sum --check --status -
          tar -xzf "$rg_dir/$rg_archive" -C "$rg_dir"
          install -m0755 "$rg_dir/ripgrep-${rg_version}-x86_64-unknown-linux-musl/rg" "$rg_dir/rg"
          echo "$rg_dir" >> "$GITHUB_PATH"
          "$rg_dir/rg" --version | head -1

      - name: Run route coverage and fixture contracts
        id: route-coverage
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/route-coverage-contract"
          mkdir -p "$artifact_dir"
          summary="$artifact_dir/results.jsonl"
          : > "$summary"
          overall_status=0

          run_check() {
            local name=$1
            shift
            local output="$artifact_dir/$name.log"
            local exit_code

            if "$@" >"$output" 2>&1; then
              exit_code=0
            else
              exit_code=$?
            fi
            cat "$output"

            if (( exit_code == 0 )); then
              printf '{"check":"%s","exit_code":0,"status":"passed"}\n' "$name" >> "$summary"
            else
              printf '{"check":"%s","exit_code":%d,"status":"failed"}\n' "$name" "$exit_code" >> "$summary"
              overall_status=1
            fi
          }

          run_check complete-route-coverage \
            bash apps/api-rust/tests/scripts/check-complete-route-coverage.sh
          run_check go-route-manifest \
            bash apps/api-rust/tests/scripts/check-go-route-manifest.sh
          run_check complete-route-coverage-tests \
            bash apps/api-rust/tests/scripts/test-check-complete-route-coverage.sh
          run_check fixture-contract \
            bash apps/api-rust/tests/behavior-oracle/tests/check-fixtures.sh
          run_check behavior-deviations \
            bash apps/api-rust/tests/scripts/check-behavior-deviations.sh
          run_check behavior-deviations-tests \
            bash apps/api-rust/tests/scripts/test-check-behavior-deviations.sh
          run_check migration-plan \
            bash apps/api-rust/tests/scripts/check-migration-plan.sh
          run_check migration-plan-tests \
            bash apps/api-rust/tests/scripts/test-check-migration-plan.sh
          run_check draft-route-coverage \
            bash apps/api-rust/tests/scripts/check-draft-route-coverage.sh
          run_check draft-route-completion \
            bash apps/api-rust/tests/scripts/check-draft-route-completion.sh
          run_check draft-route-coverage-tests \
            bash apps/api-rust/tests/scripts/test-check-draft-route-coverage.sh

          {
            echo "route coverage contract status: $([[ $overall_status == 0 ]] && echo passed || echo failed)"
            echo "results: $summary"
          } | tee "$artifact_dir/summary.txt" >> "$GITHUB_STEP_SUMMARY"

          cp "$summary" route-coverage-results.jsonl
          cp "$artifact_dir/summary.txt" route-coverage-summary.txt
          cp -r "$artifact_dir" route-coverage-logs
          exit "$overall_status"

      - name: Upload route coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-coverage-contract-${{ github.run_id }}
          path: |
            route-coverage-results.jsonl
            route-coverage-summary.txt
            route-coverage-logs/
          if-no-files-found: error

  rust-real-integration:
    name: Rust PostgreSQL 18 and Valkey integration gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lmm_ci
          POSTGRES_USER: lmm_ci
          POSTGRES_PASSWORD: lmm-ci-postgres-password
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U lmm_ci -d lmm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LMM_AUTH_TEST_ALLOW_SCHEMA_RESET: "1"
      LMM_AUTH_TEST_DATABASE_URL: postgresql://lmm_ci:lmm-ci-postgres-password@127.0.0.1:5432/lmm_ci
      LMM_AUTH_TEST_VALKEY_URL: redis://:lmm-ci-valkey-password@127.0.0.1:6379/0
      LMM_MODELS_TEST_DATABASE_URL: postgresql://lmm_ci:lmm-ci-postgres-password@127.0.0.1:5432/lmm_ci
      LMM_MODELS_TEST_VALKEY_URL: redis://:lmm-ci-valkey-password@127.0.0.1:6379/0
      LMM_API_TOKEN_TEST_DATABASE_URL: postgresql://lmm_ci:lmm-ci-postgres-password@127.0.0.1:5432/lmm_ci
      LMM_API_TOKEN_TEST_VALKEY_URL: redis://:lmm-ci-valkey-password@127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose

      - name: Require authenticated loopback Valkey
        env:
          VALKEY_CONTAINER_ID: ${{ job.services.valkey.id }}
          VALKEY_PASSWORD: lmm-ci-valkey-password
        run: |
          set -euo pipefail
          docker exec "$VALKEY_CONTAINER_ID" valkey-cli CONFIG SET requirepass "$VALKEY_PASSWORD" >/dev/null
          test "$(docker exec "$VALKEY_CONTAINER_ID" valkey-cli --no-auth-warning -a "$VALKEY_PASSWORD" ping)" = PONG
          unauthenticated=$(docker exec "$VALKEY_CONTAINER_ID" valkey-cli ping 2>&1 || true)
          [[ $unauthenticated != *PONG* ]]

      - name: Run real integration suites
        run: bash apps/api-rust/tests/scripts/run-real-integration-gates.sh all

  aur-package-matrix:
    name: AUR direct-backend package contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - name: Install checkout and package validation tools
        run: |
          pacman --sync --refresh --noconfirm clang cosign curl git jq libarchive rust shellcheck
          paru_revision=9ac3578807a87858651e81a02586ceb947686e7c
          paru_archive=/tmp/paru.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/Morganamilo/paru/archive/${paru_revision}.tar.gz" \
            --output "$paru_archive"
          echo 'fa1e2da402283f9584f98458c61ae8d0bb04c92b2cddb1d2727c8ce944da457e  /tmp/paru.tar.gz' | sha256sum --check --strict
          bsdtar --extract --file "$paru_archive" --directory /tmp
          CARGO_TARGET_DIR=/tmp/paru-target cargo build --release --locked \
            --manifest-path "/tmp/paru-${paru_revision}/Cargo.toml"
          install -m0755 /tmp/paru-target/release/paru /usr/local/bin/paru
          useradd --create-home package-builder
          install -d -o package-builder -g package-builder /home/package-builder/lmm-ci-tmp

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate all public AUR packages
        run: |
          chown --recursive package-builder:package-builder "$GITHUB_WORKSPACE"
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-matrix.sh
          runuser --user package-builder -- env \
            TMPDIR=/home/package-builder/lmm-ci-tmp \
            GITHUB_TOKEN='${{ github.token }}' \
            bash packaging/aur/verify-go-release-pins.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-bin-makepkg.sh
