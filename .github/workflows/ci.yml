name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: 'true'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_TOOLCHAIN: '1.88.0'

jobs:
  repository-contracts:
    name: Workflow and resource-safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go for actionlint
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Lint workflow definitions
        env:
          GOWORK: 'off'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Validate read-only production inspectors
        run: |
          shellcheck \
            .agents/skills/lmm-deploy-safely/scripts/inspect-state.sh \
            .agents/skills/lmm-deploy-safely/scripts/tests/test-inspect-state.sh \
            .agents/skills/lmm-deploy-safely/scripts/resource-pressure-report.sh \
            .agents/skills/lmm-deploy-safely/scripts/tests/test-resource-pressure-report.sh
          bash .agents/skills/lmm-deploy-safely/scripts/tests/test-inspect-state.sh
          bash .agents/skills/lmm-deploy-safely/scripts/tests/test-resource-pressure-report.sh

      - name: Test release version and changelog tooling
        run: node --test scripts/release.test.mjs

  web:
    name: Web checks, route manifest, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and copyright headers
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check

      - name: Lint and typecheck
        run: |
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck

      - name: Test web workspace
        run: bun run --filter @lmm/web test

      - name: Validate frontend API route manifest
        run: bash apps/api-rust/tests/behavior-oracle/tests/test-frontend-api-route-manifest.sh

      - name: Build production web assets
        env:
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: |
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check

      - name: Install production contract tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools

      - name: Verify protected production deployment contract
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash deploy/test-frontend-release.sh

  go:
    name: Go default backend, relaykit, and static build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum

      - name: Check formatting and static analysis
        working-directory: apps/api-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Test default Go module
        working-directory: apps/api-go
        run: go test -p 2 ./...

      - name: Test and build independent relaykit module
        working-directory: apps/api-go/relaykit
        env:
          GOWORK: 'off'
        run: |
          go vet ./...
          go test -p 2 ./...
          go build -p 2 ./...

      - name: Build static Go production binary
        working-directory: apps/api-go
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p out
          go build -p 2 -trimpath -ldflags="-s -w" -o out/lmm-api-go .
          file out/lmm-api-go
          if ldd out/lmm-api-go 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo 'Go production binary is dynamically linked' >&2
            exit 1
          fi

  rust-preview:
    name: Rust backend formatting, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install route coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose

      - name: Check formatting
        working-directory: apps/api-rust
        run: cargo fmt --all --check

      - name: Lint workspace
        working-directory: apps/api-rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        working-directory: apps/api-rust
        run: cargo test --workspace --all-targets --all-features --locked

  route-coverage-contract:
    name: Go and Rust route/behavior alignment gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go for route manifest checks
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Install route coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Run route coverage and fixture contracts
        id: route-coverage
        shell: bash
        run: |
          set -uo pipefail
          artifact_dir="$RUNNER_TEMP/route-coverage-contract"
          mkdir -p "$artifact_dir"
          summary="$artifact_dir/results.jsonl"
          : > "$summary"
          overall_status=0

          run_check() {
            local name=$1
            shift
            local output="$artifact_dir/$name.log"
            local exit_code

            set +e
            "$@" >"$output" 2>&1
            exit_code=$?
            set -e
            cat "$output"

            if (( exit_code == 0 )); then
              printf '{"check":"%s","exit_code":0,"status":"passed"}\n' "$name" >> "$summary"
            else
              printf '{"check":"%s","exit_code":%d,"status":"failed"}\n' "$name" "$exit_code" >> "$summary"
              overall_status=1
            fi
          }

          run_check complete-route-coverage \
            bash apps/api-rust/tests/scripts/check-complete-route-coverage.sh
          run_check go-route-manifest \
            bash apps/api-rust/tests/scripts/check-go-route-manifest.sh
          run_check complete-route-coverage-tests \
            bash apps/api-rust/tests/scripts/test-check-complete-route-coverage.sh
          run_check fixture-contract \
            bash apps/api-rust/tests/behavior-oracle/tests/check-fixtures.sh
          run_check behavior-deviations \
            bash apps/api-rust/tests/scripts/check-behavior-deviations.sh
          run_check behavior-deviations-tests \
            bash apps/api-rust/tests/scripts/test-check-behavior-deviations.sh
          run_check migration-plan \
            bash apps/api-rust/tests/scripts/check-migration-plan.sh
          run_check migration-plan-tests \
            bash apps/api-rust/tests/scripts/test-check-migration-plan.sh

          {
            echo "route coverage contract status: $([[ $overall_status == 0 ]] && echo passed || echo failed)"
            echo "results: $summary"
          } | tee "$artifact_dir/summary.txt" >> "$GITHUB_STEP_SUMMARY"

          cp "$summary" route-coverage-results.jsonl
          cp "$artifact_dir/summary.txt" route-coverage-summary.txt
          cp -r "$artifact_dir" route-coverage-logs
          exit "$overall_status"

      - name: Upload route coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-coverage-contract-${{ github.run_id }}
          path: |
            route-coverage-results.jsonl
            route-coverage-summary.txt
            route-coverage-logs/
          if-no-files-found: error

  aur-package-matrix:
    name: AUR direct-backend package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base-devel
    steps:
      - name: Install checkout and package validation tools
        run: |
          pacman --sync --refresh --noconfirm git jq libarchive shellcheck
          useradd --create-home package-builder
          install -d -o package-builder -g package-builder /home/package-builder/lmm-ci-tmp

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate all public AUR packages
        run: |
          chown --recursive package-builder:package-builder "$GITHUB_WORKSPACE"
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-matrix.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-bin-makepkg.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash packaging/aur/test-web-activation.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash deploy/production/test-precutover-packages.sh
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash deploy/production/test-go-package-roundtrip.sh
          runtime_dir="/run/user/$(id -u package-builder)"
          install -d -m0700 -o package-builder -g package-builder "$runtime_dir"
          runuser --user package-builder -- env TMPDIR=/home/package-builder/lmm-ci-tmp bash deploy/production/test-go-deploy-contract.sh
