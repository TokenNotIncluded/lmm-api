name: automation-go-321-refresh-assistant-contracts

on:
  push:
    branches:
      - automation/go-321-assistant-contracts

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/go-321-assistant-contracts
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: true
          cache-dependency-path: apps/api-go/go.sum
      - name: Regenerate assistant admin operation contracts
        working-directory: apps/api-go
        run: go generate ./controller
      - name: Verify targeted contract test
        working-directory: apps/api-go
        run: go test ./controller -run '^TestAssistantAdminOperationContractsMatchSources$' -count=1
      - name: Commit generated artifact
        run: |
          if git diff --quiet -- apps/api-go/controller/assistant_admin_operation_contracts.json; then
            echo "assistant contracts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api-go/controller/assistant_admin_operation_contracts.json
          git commit -m "chore(go): refresh assistant operation contracts"
          git push origin HEAD:automation/go-321-assistant-contracts
