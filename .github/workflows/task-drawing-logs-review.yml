# Fresh-install branch: retained frontend/client coverage only.
# The removed monolith backend is not a verified extension implementation.
name: Task and drawing logs review

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: task-drawing-logs-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Capture exact source under review
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs-source"
          git rev-parse HEAD > "$RUNNER_TEMP/logs-source/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/logs-source/source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-drawing-logs-source
          path: ${{ runner.temp }}/logs-source
          retention-days: 3
          if-no-files-found: error
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck the application
        working-directory: apps/web
        run: bun run typecheck
      - name: Run log regression tests
        if: ${{ !cancelled() }}
        working-directory: apps/web
        shell: bash
        run: |
          failed=0
          while IFS= read -r test_file; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test_file" || failed=1
          done < <(find src/features/usage-logs -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          exit "$failed"
      - name: Build the frontend without deployment
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: bun run build
