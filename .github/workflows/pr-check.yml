name: PR Check

on:
  # Only trusted base code reads PR metadata; never check out or execute the head.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/PULL_REQUEST_TEMPLATE.md
            scripts/pr-quality.mjs
          sparse-checkout-cone-mode: false

      - name: Validate current PR description
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-quality.mjs
