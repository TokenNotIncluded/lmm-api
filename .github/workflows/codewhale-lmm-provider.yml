name: Codewhale LMM provider
on:
  workflow_dispatch:

permissions:
  contents: read
# Only retained client/frontend code is checked here. The old Go business
# implementation was removed; this does not qualify its future replacement.
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
      - name: Initialize adapter when extracted as a submodule
        run: |
          if git ls-files --stage packages/codewhale-lmm-provider | grep -q '^160000 '; then
            git submodule update --init --depth 1 -- packages/codewhale-lmm-provider
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check && npm test && npm run pack:check
        working-directory: packages/codewhale-lmm-provider
