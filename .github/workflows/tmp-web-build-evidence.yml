name: TEMP web build evidence

on:
  push:
    branches:
      - automation/go-321-assistant-contracts

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Capture production web build
        id: webbuild
        shell: bash
        env:
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: |
          set +e
          {
            bun run --filter @lmm/web build
            build_status=$?
            echo "__BUILD_EXIT__=${build_status}"
            if (( build_status == 0 )); then
              bun run --filter @lmm/web bundle:check
              bundle_status=$?
            else
              bundle_status=0
            fi
            echo "__BUNDLE_EXIT__=${bundle_status}"
            if (( build_status != 0 )); then exit "${build_status}"; fi
            exit "${bundle_status}"
          } > "${RUNNER_TEMP}/web-build.log" 2>&1
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload web build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-web-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/web-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve build result
        if: steps.webbuild.outputs.exit_code != '0'
        run: exit 1
