name: Pending PR integration review

on:
  push:
    branches: [integration/pr-merge-20260916]
    paths:
      - .github/workflows/pr-integration-review-20260916.yml
      - .github/scripts/integrate-pr-snapshot.py

permissions:
  contents: write

concurrency:
  group: pending-pr-integration-review
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply reviewed resolutions to the fixed PR heads
        run: python3 .github/scripts/integrate-pr-snapshot.py
      - name: Install exact dependencies
        id: install
        run: bun install --frozen-lockfile 2>&1 | tee integration-evidence/install.log
      - name: Normalize source using protected repository formatters
        id: format
        run: |
          bun run --filter @lmm/web format 2>&1 | tee integration-evidence/format.log
          gofmt -w $(git ls-files 'apps/api-go/*.go' 'apps/api-go/**/*.go')
      - name: Publish only the isolated integration branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/integration/pr-merge-20260916'
          test "$(git ls-remote origin refs/heads/integration/pr-merge-20260916 | cut -f1)" = "$EXPECTED_SHA"
          git rm -- .github/workflows/pr-integration-review-20260916.yml .github/scripts/integrate-pr-snapshot.py
          git add -u -- apps
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix: reconcile pending PR integration and normalize protected source formatting'
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$basic_auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" push origin HEAD:refs/heads/integration/pr-merge-20260916
          git rev-parse HEAD > integration-evidence/integrated-head.txt
          git diff --stat 67bf1826b10b57e6e0eab3b2ef5845d4db8ff7b8 > integration-evidence/combined-stat.txt
          git bundle create integration-evidence/integration.bundle HEAD
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter @lmm/web lint 2>&1 | tee integration-evidence/lint.log
      - name: Copyright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter @lmm/web copyright:check 2>&1 | tee integration-evidence/copyright.log
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter @lmm/web typecheck 2>&1 | tee integration-evidence/typecheck.log
      - name: Full web tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter @lmm/web test 2>&1 | tee integration-evidence/test.log
      - name: Production build with module-size diagnostics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cp apps/web/rsbuild.config.ts integration-evidence/rsbuild.config.original.ts
          trap 'cp integration-evidence/rsbuild.config.original.ts apps/web/rsbuild.config.ts' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/rsbuild.config.ts')
          s = p.read_text()
          s = "import fs from 'node:fs'\n" + s
          marker = '          tanstackRouter({'
          assert s.count(marker) == 1
          plugin = '''          { apply(compiler: any) {
                      compiler.hooks.done.tap('IntegrationModuleSizes', (stats: any) => {
                        const data = stats.toJson({ all: false, chunks: true, chunkModules: true, nestedModules: true, chunkModulesSpace: 100000, ids: true });
                        fs.writeFileSync('../../integration-evidence/bundle-stats.json', JSON.stringify(data));
                      });
                    } },
          '''
          s = s.replace(marker, plugin + marker)
          p.write_text(s)
          PY
          bun run --filter @lmm/web build 2>&1 | tee integration-evidence/build.log
          bun run --filter @lmm/web bundle:check 2>&1 | tee integration-evidence/bundle-check.log
      - name: Upload code and review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pending-pr-integration-review-${{ github.sha }}
          path: integration-evidence/
          retention-days: 3
          if-no-files-found: error
