name: Sitewide UI review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitewide-ui-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Type, lint, complete test suite and production build
        working-directory: apps/web
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          git rev-parse HEAD > "$RUNNER_TEMP/checks/revision.txt"
          failed=0
          for command in typecheck lint test build; do
            if bun run "$command" > "$RUNNER_TEMP/checks/$command.log" 2>&1; then
              echo "$command PASS" | tee -a "$RUNNER_TEMP/checks/status.txt"
            else
              echo "$command FAIL" | tee -a "$RUNNER_TEMP/checks/status.txt"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sitewide-checks
          path: ${{ runner.temp }}/checks
          retention-days: 7
          if-no-files-found: error

  browsers:
    name: Browser review (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [focused, console, public, store]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review synthetic local pages without production requests
        working-directory: apps/web
        env:
          SUITE: ${{ matrix.suite }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
          CONSOLE_REVIEW_OUTPUT: ${{ runner.temp }}/pages
          POLISH_REVIEW_OUTPUT: ${{ runner.temp }}/pages
          MOBILE_REVIEW_OUTPUT: ${{ runner.temp }}/pages
          STORE_REVIEW_OUTPUT: ${{ runner.temp }}/pages
          STORE_REVIEW_URL: http://127.0.0.1:4175
          MOBILE_REVIEW_CASES: public-pages,phone,phone-dark,reduced,desktop
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          git rev-parse HEAD > "$RUNNER_TEMP/pages/revision.txt"
          if [ "$SUITE" = public ] || [ "$SUITE" = store ]; then
            bun run build > "$RUNNER_TEMP/pages/build.log" 2>&1
            bun run preview --port 4175 > "$RUNNER_TEMP/pages/server.log" 2>&1 &
            port=4175
          else
            LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$RUNNER_TEMP/pages/server.log" 2>&1 &
            port=4174
          fi
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          case "$SUITE" in
            focused) script=sitewide-polish-review;;
            console) script=console-page-review;;
            public) script=mobile-experience-review;;
            store) script=store-pickup-review;;
          esac
          node "scripts/$script.mjs" > "$RUNNER_TEMP/pages/review.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sitewide-${{ matrix.suite }}
          path: ${{ runner.temp }}/pages
          retention-days: 7
          if-no-files-found: error
