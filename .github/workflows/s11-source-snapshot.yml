name: S11 source snapshot

on:
  push:
    branches: [wip/rust-core-go-extensions]
    paths: [.github/workflows/s11-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed source and history only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s11-source"
          git cat-file -e a28f06e88b7adf3701937f2a4018689bdc96ad85^{commit}
          git cat-file -e 3948a0a1ee1cefdd016a7aa45a11851545bb4b85^{commit}
          git update-ref refs/s11/wip a28f06e88b7adf3701937f2a4018689bdc96ad85
          git update-ref refs/s11/main 3948a0a1ee1cefdd016a7aa45a11851545bb4b85
          git bundle create "$RUNNER_TEMP/s11-source/repository.bundle" refs/s11/wip refs/s11/main
          git bundle verify "$RUNNER_TEMP/s11-source/repository.bundle"
          cd "$RUNNER_TEMP/s11-source"
          sha256sum repository.bundle | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: s11-source-snapshot
          path: ${{ runner.temp }}/s11-source/
          retention-days: 2
          if-no-files-found: error
