name: S11 source snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'TokenNotIncluded/api.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze prerequisite sources without changing remote refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s11-prerequisites"
          git fetch --no-tags origin \
            refs/heads/wip/rust-core-go-extensions:refs/s11/development \
            refs/pull/878/head:refs/s11/a09 \
            refs/pull/875/head:refs/s11/a04 \
            refs/pull/880/head:refs/s11/a10
          git bundle create "$RUNNER_TEMP/s11-prerequisites/prerequisites.bundle" \
            refs/s11/development refs/s11/a09 refs/s11/a04 refs/s11/a10
          git for-each-ref --format='%(refname) %(objectname)' refs/s11 \
            > "$RUNNER_TEMP/s11-prerequisites/refs.txt"
          cd "$RUNNER_TEMP/s11-prerequisites"
          sha256sum prerequisites.bundle > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s11-prerequisite-sources
          path: ${{ runner.temp }}/s11-prerequisites/
          retention-days: 2
          if-no-files-found: error
