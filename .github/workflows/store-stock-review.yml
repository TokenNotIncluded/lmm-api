name: Store stock regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-stock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            apps/api-go/relaykit/go.sum
      - name: Stock, sales quota and fixed-content database tests
        working-directory: apps/api-go
        run: go test -race -p 2 ./model -run 'TestMerchantStore(Catalogue|Sales|Remaining|Fixed|Stock)' -count=1 -timeout=10m

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Static checks
        working-directory: apps/web
        run: |
          bun run lint
          bun run typecheck
      - name: Check workflow boundaries and translations
        run: |
          node --test scripts/workflow-topology.test.mjs scripts/check-i18n.test.mjs
          node scripts/check-i18n.mjs --base origin/main
      - name: Stock unit and catalogue interaction tests
        working-directory: apps/web
        run: |
          bun test src/features/store/stock-status.test.ts
          bun test src/features/store/catalogue-interactions.test.tsx
          bun test src/features/store/interactions.test.tsx
      - name: Install isolated Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/stock-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/stock-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile stock acceptance
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/stock-browser/node_modules/playwright/index.mjs
          STOCK_REVIEW_OUTPUT: ${{ runner.temp }}/stock-review
          STOCK_REVIEW_URL: http://127.0.0.1:4189
        run: |
          mkdir -p "$STOCK_REVIEW_OUTPUT"
          git rev-parse HEAD > "$STOCK_REVIEW_OUTPUT/revision.txt"
          bun run build > "$STOCK_REVIEW_OUTPUT/build.log" 2>&1
          bun run preview --host 127.0.0.1 --port 4189 > "$STOCK_REVIEW_OUTPUT/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4189/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/store-stock-review.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-stock-review
          path: ${{ runner.temp }}/stock-review
          retention-days: 7
          if-no-files-found: warn
