name: Assistant implementation validation
on:
  push:
    branches: ['assistant/l0-evidence-tools-20260916']
    paths: ['.github/workflows/assistant-apply-test.yml']
permissions:
  contents: read
concurrency:
  group: assistant-l0-implementation-validation
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'LIghtJUNction/api.lmm.best' && github.ref == 'refs/heads/assistant/l0-evidence-tools-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: assistant/l0-evidence-tools-20260916
      - name: Verify and apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd().resolve()
          parts = sorted(root.glob('.assistant-transfer/*.b64'))
          assert [p.name for p in parts] == ['00.b64','01.b64','02.b64','03.b64']
          blob = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(blob).hexdigest() == 'ab227d03816f0c641389f3386163fd6d19f1171a50d94cf08919764ba345153e'
          rows = json.loads(lzma.decompress(blob))
          assert len(rows) == 36
          outputs = {}
          for row in rows:
              relative = pathlib.PurePosixPath(row['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in ('apps','docs')
              path = root / relative
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              assert path not in outputs
              if row['old'] is None:
                  assert not path.exists(), row['path']
                  old = b''
              else:
                  old = path.read_bytes()
                  assert hashlib.sha256(old).hexdigest() == row['old'], row['path']
              lines = old.decode('utf-8').splitlines(keepends=True)
              previous = len(lines) + 1
              for start, end, text in reversed(row['changes']):
                  assert 0 <= start <= end <= len(lines) and end < previous
                  lines[start:end] = [text]
                  previous = start
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == row['new'], row['path']
              outputs[path] = result
          for path, content in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          print('Verified and applied', len(outputs), 'source files')
          PY
      - name: Commit only to the feature branch and remove temporary transfer files
        id: commit
        run: |
          test "$GITHUB_REF" = refs/heads/assistant/l0-evidence-tools-20260916
          rm -rf .assistant-transfer
          rm .github/workflows/assistant-worktree-export.yml .github/workflows/assistant-apply-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps docs .assistant-transfer .github/workflows/assistant-worktree-export.yml .github/workflows/assistant-apply-test.yml
          git diff --cached --check
          git commit -m 'feat(assistant): evidence-gated L0 onboarding and risk inbox'
          git push origin HEAD:refs/heads/assistant/l0-evidence-tools-20260916
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  go:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Run policy, database, controller and retention regression tests
        working-directory: apps/api-go
        shell: bash
        run: |
          mkdir -p /tmp/assistant-go-results
          status=0
          go test -p 2 -race ./internal/registrationguard -count=1 2>&1 | tee /tmp/assistant-go-results/policy.log || status=1
          go test -p 2 ./model -run 'TestRegistrationGuard|TestAssistantDirectL1Grant|TestAssistantNewUserGift|TestAssistantGift' -count=1 2>&1 | tee /tmp/assistant-go-results/model.log || status=1
          go test -p 2 ./controller -run 'TestRegistrationGuard|TestAssistantDirectL1Grant|TestExecuteAssistantDirectL1Grant' -count=1 2>&1 | tee /tmp/assistant-go-results/controller.log || status=1
          go test -p 2 ./service -run 'TestAssistantRetention' -count=1 2>&1 | tee /tmp/assistant-go-results/retention.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assistant-go-results
          path: /tmp/assistant-go-results
          retention-days: 3
  web:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Frontend typecheck, targeted tests, lint and build
        working-directory: apps/web
        shell: bash
        run: |
          mkdir -p /tmp/assistant-web-results
          status=0
          bun run typecheck 2>&1 | tee /tmp/assistant-web-results/typecheck.log || status=1
          bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/features/assistant/assistant-registration-state.test.ts 2>&1 | tee /tmp/assistant-web-results/state.log || status=1
          bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/features/assistant/assistant-activation-tool.test.tsx 2>&1 | tee /tmp/assistant-web-results/card.log || status=1
          bun run lint 2>&1 | tee /tmp/assistant-web-results/lint.log || status=1
          bun run build 2>&1 | tee /tmp/assistant-web-results/build.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assistant-web-results
          path: /tmp/assistant-web-results
          retention-days: 3
