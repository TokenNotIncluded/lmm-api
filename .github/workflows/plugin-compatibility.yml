name: Plugin compatibility

on:
  push:
    branches: [chore/plugin-compat-20261006]
    paths: [.github/workflows/plugin-compatibility.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record pinned and latest submodule revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compatibility-inputs
          git rev-parse HEAD > compatibility-inputs/parent-head.txt
          git ls-tree HEAD packages/ apps/ > compatibility-inputs/parent-tree.txt
          git submodule status --recursive > compatibility-inputs/pinned-submodules.txt
          git submodule foreach --recursive 'git fetch --depth=1 origin HEAD && git checkout --detach FETCH_HEAD'
          git submodule status --recursive > compatibility-inputs/latest-submodules.txt
          git submodule foreach 'git log -1 --format="%H %cI %s"' > compatibility-inputs/latest-commits.txt
      - name: Collect published host metadata and source packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compatibility-inputs/upstream
          for package in @earendil-works/pi-ai @earendil-works/pi-coding-agent @deepseek-ai/dsh @deepseek-ai/dsh-llm @deepseek-ai/dsh-llm-pi-ai @deepseek-ai/dsh-credentials @deepseek-ai/dsh-authorization @deepseek-ai/dsh-client-connection @deepseek-ai/cordis @opencode-ai/plugin @opencode-ai/sdk opencode-ai; do
            name="${package//@/}"
            name="${name//\//-}"
            npm view "$package" dist-tags version engines repository --json > "compatibility-inputs/upstream/$name.json"
            npm pack "$package" --ignore-scripts --pack-destination compatibility-inputs/upstream
          done
          git clone --depth 1 https://github.com/Hmbown/Codewhale.git compatibility-inputs/upstream/Codewhale
          git -C compatibility-inputs/upstream/Codewhale log -1 --format='%H %cI %s' > compatibility-inputs/upstream/codewhale-head.txt
      - name: Package source snapshot without Git metadata
        if: always()
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/plugin-compatibility-inputs.tar.gz" packages apps/coweft .gitmodules scripts .github compatibility-inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-compatibility-inputs
          path: ${{ runner.temp }}/plugin-compatibility-inputs.tar.gz
          retention-days: 3
          if-no-files-found: error
