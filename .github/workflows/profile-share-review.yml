name: Profile share SVG review

on:
  pull_request:
    paths:
      - "apps/web/src/features/profile/**"
      - "apps/api-go/controller/profile_share*.go"
      - "apps/api-go/model/profile_share*.go"
      - "apps/web/scripts/profile-share-review.mjs"
      - ".github/workflows/profile-share-review.yml"

permissions:
  contents: read

concurrency:
  group: profile-share-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  model-share:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: "2"
      PROFILE_SHARE_REVIEW_OUTPUT: ${{ github.workspace }}/profile-share-review
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Prepare reproducible formatting evidence
        run: |
          mkdir -p "$PROFILE_SHARE_REVIEW_OUTPUT"
          git rev-parse HEAD > "$PROFILE_SHARE_REVIEW_OUTPUT/revision.txt"
          bun run --filter @lmm/web format
          git diff --binary > "$PROFILE_SHARE_REVIEW_OUTPUT/format.patch"
          tar -czf "$PROFILE_SHARE_REVIEW_OUTPUT/formatted-source.tar.gz" apps/web/src/features/profile apps/web/scripts/profile-share-review.mjs
      - name: Upload formatting evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-share-format
          path: profile-share-review
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Verify real aggregation, consent, SVG rendering, and legacy layouts
        working-directory: apps/api-go
        run: go test -p 2 ./model ./controller -run '^TestProfileShare' -count=1 -v
      - name: Verify editor types and targeted regressions
        working-directory: apps/web
        run: |
          bun run typecheck
          bun test --preload ./scripts/test-preload.mjs --timeout 15000 src/features/profile/lib/share-badge.test.ts src/features/profile/api.test.ts
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/share-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/share-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review desktop and mobile without production requests
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/share-browser/node_modules/playwright/index.mjs
        run: |
          LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$PROFILE_SHARE_REVIEW_OUTPUT/dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/profile-share-review.mjs
      - name: Upload SVG and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-share-review
          path: profile-share-review
          retention-days: 7
          if-no-files-found: error
