name: L0 mobile chat review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l0-mobile-chat-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Repository contracts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/chat-review"
          git rev-parse HEAD > "$RUNNER_TEMP/chat-review/revision.txt"
          git diff --check
          node --test scripts/workflow-topology.test.mjs > "$RUNNER_TEMP/chat-review/workflow-contracts.log" 2>&1
      - name: Focused tests and type check
        working-directory: apps/web
        shell: bash
        run: |
          failed=0
          for test in src/features/onboarding/*.test.ts src/features/onboarding/*.test.tsx src/components/layout/components/authenticated-layout-responsive.test.ts src/components/layout/lib/mobile-scroll*.test.ts; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test" > "$RUNNER_TEMP/chat-review/$(basename "$test").log" 2>&1 || failed=1
          done
          bun run typecheck > "$RUNNER_TEMP/chat-review/typecheck.log" 2>&1 || failed=1
          bun run lint > "$RUNNER_TEMP/chat-review/lint.log" 2>&1 || failed=1
          exit "$failed"
      - name: Browser review
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/chat-browser/node_modules/playwright/index.mjs
          CONSOLE_REVIEW_OUTPUT: ${{ runner.temp }}/chat-review
        run: |
          npm install --prefix "$RUNNER_TEMP/chat-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/chat-browser/node_modules/playwright/cli.js" install --with-deps chromium
          LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$CONSOLE_REVIEW_OUTPUT/dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/l0-mobile-chat-review.mjs
      - name: Build
        working-directory: apps/web
        run: bun run build > "$RUNNER_TEMP/chat-review/build.log" 2>&1
      - name: Check source is unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: l0-mobile-chat-review
          path: ${{ runner.temp }}/chat-review
          retention-days: 7
          if-no-files-found: error
