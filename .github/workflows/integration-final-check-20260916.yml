name: Integrated production verification

on:
  push:
    branches: [integration/pr-merge-20260916]
    paths: [.github/workflows/integration-final-check-20260916.yml]

permissions:
  contents: write

concurrency:
  group: integrated-production-verification
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Align verification action labels with the retired letter workflow
        run: |
          mkdir -p integration-evidence
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/features/assistant/assistant-panel.tsx')
          s = p.read_text()
          assert s.count("label: t('Submit for review')") == 2
          s = s.replace("label: t('Submit for review')", "label: t('Registration verification')")
          s = s.replace('canSubmitWithoutAssistant', 'canShowVerificationWithoutAssistant')
          p.write_text(s)
          PY
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile 2>&1 | tee integration-evidence/install.log
      - name: Format the reviewed source
        id: format
        run: bun run --filter @lmm/web format 2>&1 | tee integration-evidence/format.log
      - name: Publish only the isolated source and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/integration/pr-merge-20260916'
          test "$(git ls-remote origin refs/heads/integration/pr-merge-20260916 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/integration-final-check-20260916.yml
          git add -- apps/web/src/features/assistant/assistant-panel.tsx
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(web): label all admission fallback actions as registration verification'
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$basic_auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" push origin HEAD:refs/heads/integration/pr-merge-20260916
          git rev-parse HEAD > integration-evidence/source-head.txt
      - name: Build the unmodified production configuration
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --filter @lmm/web build 2>&1 | tee integration-evidence/build.log
          cp apps/web/dist/index.html integration-evidence/production-index.html
          git diff --exit-code -- apps/web/src/routeTree.gen.ts
      - name: Enforce original bundle limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run --filter @lmm/web bundle:check 2>&1 | tee integration-evidence/bundle-check.log
      - name: Capture independent initial resource measurements
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import gzip,json,re
          from pathlib import Path
          root=Path('apps/web/dist')
          files=set(re.findall(r'(?:src|href)="(/static/[^"?#]+)"',(root/'index.html').read_text()))
          data=[{'path':f,'raw':len((root/f.lstrip('/')).read_bytes()),'gzip':len(gzip.compress((root/f.lstrip('/')).read_bytes(),compresslevel=9))} for f in files]
          Path('integration-evidence/initial-resources.json').write_text(json.dumps(sorted(data,key=lambda row:-row['gzip']),indent=2))
          PY
      - name: Lint and copyright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --filter @lmm/web lint 2>&1 | tee integration-evidence/lint.log
          bun run --filter @lmm/web copyright:check 2>&1 | tee integration-evidence/copyright.log
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --filter @lmm/web typecheck 2>&1 | tee integration-evidence/typecheck.log
      - name: Run every web test file and report all failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          web=Path('apps/web')
          result=[]
          with Path('integration-evidence/test.log').open('w') as output:
            for path in sorted(web.rglob('*.test.*')):
              if path.suffix not in ('.ts','.tsx','.js','.mjs') or 'node_modules' in path.parts: continue
              relative=str(path.relative_to(web))
              completed=subprocess.run(['bun','test','./'+relative],cwd=web,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=180)
              output.write(completed.stdout+'\n');output.flush()
              result.append({'file':relative,'exit_code':completed.returncode})
              print(relative,completed.returncode,flush=True)
          Path('integration-evidence/test-report.json').write_text(json.dumps(result,indent=2))
          raise SystemExit(any(row['exit_code'] for row in result))
          PY
      - name: Save evidence and source
        if: ${{ always() }}
        run: |
          git diff -- apps > integration-evidence/uncommitted-source.patch
          git bundle create integration-evidence/integration.bundle HEAD
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-production-verification-${{ github.sha }}
          path: integration-evidence/
          retention-days: 3
          if-no-files-found: error
