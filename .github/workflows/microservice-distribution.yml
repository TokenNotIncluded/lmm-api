name: Microservice preview distributions
on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview archive version, not a release tag
        default: 0.1.0-preview
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        default: 0.1.0-preview
        type: string
      source_ref:
        description: Exact source commit for isolated review
        default: ''
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.27.2'
          cache-dependency-path: apps/lmm-extensions/go.sum
      - name: Source, documents and archive contracts
        run: |
          python3 -B scripts/check-docs-brand.py
          python3 -B scripts/test_docs_brand.py
          python3 -B scripts/test-distribution.py
          python3 -B scripts/test-docs-microservices.py
          python3 -B scripts/test-core-boundaries.py
          node --test scripts/workflow-topology.test.mjs
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Go policy and host checks
        working-directory: apps/lmm-extensions
        run: |
          bash ../../scripts/check-go-format.sh .
          go vet ./internal/legal ./internal/app
          go test -mod=readonly -race -count=1 -v ./internal/legal ./internal/app ./internal/modules
  build:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        component: [core, extensions, cli, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPONENT: ${{ matrix.component }}
      PACKAGE_VERSION: ${{ inputs.version }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Record actual source identity
        run: |
          echo "SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build core or extension binaries using their Docker compiler stage
        if: matrix.component == 'core' || matrix.component == 'extensions'
        run: |
          docker buildx build -f "deployment/docker/${COMPONENT}.Dockerfile"             --target binaries --output "type=local,dest=out/${COMPONENT}" .
      - name: Build runtime image and inspect shipped resources
        if: matrix.component == 'core' || matrix.component == 'extensions'
        run: |
          docker buildx build -f "deployment/docker/${COMPONENT}.Dockerfile" --load -t "lmm-preview-${COMPONENT}" .
          docker run --rm --entrypoint /bin/sh "lmm-preview-${COMPONENT}" -ec '
            test -s /usr/share/licenses/lmm/LICENSE
            test -s /usr/share/licenses/lmm/NOTICE
            test -s /usr/share/licenses/lmm/THIRD-PARTY-LICENSES.md
          '
          if [[ "$COMPONENT" == extensions ]]; then
            docker run --rm --entrypoint /bin/sh lmm-preview-extensions -ec '
              test -s /usr/share/lmm/legal/site.example.json
              test "$(find /usr/share/lmm/legal/templates -name "*.md" | wc -l)" -eq 6
              test ! -e /usr/share/lmm/legal/site.json
            '
          fi
      - name: Actual extension policy process checks
        if: matrix.component == 'extensions'
        run: LMM_EXTENSION_TEST_BIN="$PWD/out/extensions/lmm-extensions" python3 -B scripts/test-legal-process.py
      - name: Install CLI toolchain
        if: matrix.component == 'cli'
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - name: Build and test CLI
        if: matrix.component == 'cli'
        run: |
          cargo +1.99.0 test --manifest-path apps/lmm/Cargo.toml --locked --all-targets
          cargo +1.99.0 build --manifest-path apps/lmm/Cargo.toml --locked --release
          mkdir -p out/cli
          cp apps/lmm/target/release/lmm out/cli/
      - name: Install Bun
        if: matrix.component == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Build and inspect frontend
        if: matrix.component == 'web'
        env:
          VITE_REACT_APP_VERSION: ${{ inputs.version }}
        run: |
          bun install --frozen-lockfile
          (cd apps/web && bun test --preload ./scripts/test-preload.mjs ./src/components/ai-elements/openui/library.test.tsx)
          bun run --filter @lmm/web build
          bun run --filter @lmm/web bundle:check
          mkdir -p out/web
          cp -a apps/web/dist/. out/web/
      - name: Build and inspect an independent preview archive
        run: |
          platform=linux-amd64
          if [[ "$COMPONENT" == web ]]; then platform=any; fi
          python3 scripts/build-distribution.py build --component "$COMPONENT"             --version "$PACKAGE_VERSION" --revision "$SOURCE_REVISION"             --platform "$platform" --input "out/$COMPONENT"
          for archive in out/distributions/*.tar.gz; do
            python3 scripts/build-distribution.py verify "$archive" --revision "$SOURCE_REVISION"
          done
          (cd out/distributions && sha256sum --check ./*.sha256)
      - name: Preserve preview archives only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lmm-preview-${{ matrix.component }}-${{ env.SOURCE_REVISION }}
          path: out/distributions/*
          if-no-files-found: error
          retention-days: 7
