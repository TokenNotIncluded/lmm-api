name: Console page review

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/console-page-review.yml"

permissions:
  contents: read

concurrency:
  group: console-page-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Capture exact review source and revision
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/console-source"
          git rev-parse HEAD > "$RUNNER_TEMP/console-source/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/console-source/source.tar.gz" HEAD apps/web package.json bun.lock
      - name: Upload reproducible source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-review-source
          path: ${{ runner.temp }}/console-source
          retention-days: 7
          if-no-files-found: error
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated browser tooling
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/console-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/console-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review all console pages without production requests
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/console-browser/node_modules/playwright/index.mjs
          CONSOLE_REVIEW_OUTPUT: ${{ runner.temp }}/console-pages
        run: |
          mkdir -p "$CONSOLE_REVIEW_OUTPUT"
          git rev-parse HEAD > "$CONSOLE_REVIEW_OUTPUT/revision.txt"
          LMM_ENABLE_PERSONA_DEBUG=1 bun run dev --port 4174 > "$CONSOLE_REVIEW_OUTPUT/dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          # Collect the route gallery even when an interaction assertion fails.
          failed=0
          node scripts/console-interaction-review.mjs || failed=1
          node scripts/console-page-review.mjs || failed=1
          exit "$failed"
      - name: Upload route-by-route evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-pages
          path: ${{ runner.temp }}/console-pages
          retention-days: 7
          if-no-files-found: error
