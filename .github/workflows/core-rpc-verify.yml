name: Core protobuf implementation verification
on:
  push:
    branches: [wip/rust-core-go-extensions]
    paths: [.github/workflows/core-rpc-verify.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: core-rpc-implementation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/wip/rust-core-go-extensions'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOWORK: "off"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install compilers
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/prepare-ci-apt.py
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes protobuf-compiler
      - name: Generate protobuf bindings and normalize source
        run: |
          bash scripts/generate-core-protocol.sh
          (cd apps/extensions-go && go mod tidy && gofmt -w .)
          (cd apps/core-rust && cargo fmt --all && cargo check --all-targets)
      - name: Rust locked checks and real database tests
        working-directory: apps/core-rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Go race tests and build
        working-directory: apps/extensions-go
        run: |
          go vet ./...
          go test -race ./... -count=1
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/lmm-extensions" ./cmd/extensions
      - name: Existing Docker isolation and persistence
        run: |
          python3 -B scripts/test-core-docker.py
          python3 -B scripts/test-core-identity-docker.py
      - name: Real protobuf round trips and failure recovery
        run: python3 -B scripts/test-core-rpc-docker.py
      - name: Core boundary contracts
        run: python3 -B scripts/test-core-boundaries.py
      - name: Preserve generated files on this WIP branch
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -u -- apps/core-rust apps/extensions-go
          if [[ -f apps/extensions-go/go.sum ]]; then git add apps/extensions-go/go.sum; fi
          if [[ -d apps/extensions-go/internal/corepb ]]; then git add apps/extensions-go/internal/corepb; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(core): persist generated protobuf bindings and dependency locks'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/wip/rust-core-go-extensions
          git rev-parse HEAD
