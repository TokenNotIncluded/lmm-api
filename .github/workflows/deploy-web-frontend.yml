name: Deploy web frontend
run-name: Deploy ${{ inputs.release_tag }} frontend

# Frontend-only manual deployment. The backend is never deployed by Actions:
# Go releases stay on the manual, signed package transaction path described in
# docs/production-release-transaction.md. A web release is a static archive and
# is published with the native `frontend publish` entry point, which switches an
# atomic symlink and keeps the previous release for rollback.
#
# The production key is restricted to a single forced command
# (/usr/local/sbin/lmm-web-deploy), so possession of the key alone cannot run
# arbitrary commands on either host.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed web release tag to publish, e.g. web-v0.1.85
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-web-frontend
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  deploy:
    name: Publish web release to production origins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          [[ "$tag" =~ ^web-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "unexpected web release tag: $tag" >&2
            exit 1
          }
          version=${tag#web-v}
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Validate deployment targets
        env:
          # Defaults preserve the current two-origin topology. Override with production
          # environment variables; the restricted key/known-hosts policy still applies.
          API_HOST: ${{ vars.LMM_WEB_API_HOST || '45.59.187.63' }}
          API_PORT: ${{ vars.LMM_WEB_API_PORT || '222' }}
          INGRESS_HOST: ${{ vars.LMM_WEB_INGRESS_HOST || '174.136.205.93' }}
          INGRESS_PORT: ${{ vars.LMM_WEB_INGRESS_PORT || '22' }}
          PUBLIC_ORIGIN: ${{ vars.LMM_WEB_PUBLIC_ORIGIN || 'https://api.lmm.best' }}
        run: |
          set -euo pipefail
          for host in "$API_HOST" "$INGRESS_HOST"; do
            [[ "$host" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || {
              echo 'Deployment hosts must be DNS names or IPv4 addresses' >&2
              exit 1
            }
          done
          for port in "$API_PORT" "$INGRESS_PORT"; do
            [[ "$port" =~ ^[1-9][0-9]{0,4}$ ]] && (( port <= 65535 )) || {
              echo 'Deployment ports must be integers from 1 to 65535' >&2
              exit 1
            }
          done
          [[ "$PUBLIC_ORIGIN" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?/?$ ]] || {
            echo 'PUBLIC_ORIGIN must be an HTTPS origin without credentials or a path' >&2
            exit 1
          }
          # Export only validated values after the production environment exists.
          printf '%s\n' "API_HOST=$API_HOST" "API_PORT=$API_PORT" \
            "INGRESS_HOST=$INGRESS_HOST" "INGRESS_PORT=$INGRESS_PORT" \
            "PUBLIC_ORIGIN=$PUBLIC_ORIGIN" >>"$GITHUB_ENV"

      - name: Download signed release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          archive="lmm-api-web-${VERSION}.tar.gz"
          # Retry only the failed GET. A missing signature must not cause the
          # large archive to be discarded and downloaded up to six times.
          # curl retries transient failures, not permanent 404s or bad hashes.
          for suffix in '' '.sha256' '.sigstore.json'; do
            max_time=30
            if [[ -z "$suffix" ]]; then max_time=120; fi
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-max-time 180 \
              --connect-timeout 10 --max-time "$max_time" \
              "$base/${archive}${suffix}" --output "deploy/${archive}${suffix}"
          done
          cd deploy
          sha256sum --check "lmm-api-web-${VERSION}.tar.gz.sha256"
          [[ -s "lmm-api-web-${VERSION}.tar.gz" ]]
          # List once into a file: piping tar into `grep -q` makes grep exit on
          # the first match, and the resulting SIGPIPE fails the whole pipeline
          # under `set -o pipefail`.
          tar -tzf "lmm-api-web-${VERSION}.tar.gz" > archive-contents.txt
          grep -qx 'dist/index.html' archive-contents.txt
          grep -qx 'REVISION' archive-contents.txt
          grep -qx 'dist/legal/terms.html' archive-contents.txt
          grep -qx 'dist/legal/privacy.html' archive-contents.txt
          grep -qx 'dist/legal/forge-legal.css' archive-contents.txt
          revision=$(tar -xzOf "lmm-api-web-${VERSION}.tar.gz" REVISION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')
          target=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}?fresh=${GITHUB_RUN_ID}-$(date +%s%N)" --jq '.target_commitish')
          [[ "$target" == "$revision" ]]

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify release signature
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="deploy/lmm-api-web-${VERSION}.tar.gz"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-web.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$archive"

      - name: Install restricted deploy key
        env:
          DEPLOY_KEY: ${{ secrets.LMM_WEB_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LMM_WEB_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" >"$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Publish to both production origins
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="deploy/lmm-api-web-${VERSION}.tar.gz"
          # Targets come from production configuration, not a local SSH config.
          # The restricted key remains bound to a forced command per host.
          #
          # Both origins serve the same immutable release; publishing the same
          # archive to each keeps them byte-identical.
          publish() {
            local label=$1 host=$2 port=$3
            echo "::group::publishing ${VERSION} to ${label} (${host}:${port})"
            ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o StrictHostKeyChecking=yes \
              -p "$port" "root@${host}" "${VERSION}:1" <"$archive"
            echo "::endgroup::"
          }
          # Keep rollout order and stop on failure; do not retry a host mutation.
          publish "API origin" "$API_HOST" "$API_PORT"
          publish "Public ingress" "$INGRESS_HOST" "$INGRESS_PORT"

      - name: Verify the public origin serves this release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # A reachability check would pass on a cached or stale document, so
          # compare the served document against the archive that was published.
          # Each host also verifies its own active symlink inside the forced
          # command, so a host that did not switch fails the publish step above.
          archive="deploy/lmm-api-web-${VERSION}.tar.gz"
          expected=$(tar -xzOf "$archive" dist/index.html | sha256sum | cut -d' ' -f1)
          echo "expected dist/index.html sha256: $expected"
          for attempt in $(seq 1 10); do
            served=$(curl -fsS --max-time 15 "${PUBLIC_ORIGIN%/}/index.html" \
              | sha256sum | cut -d' ' -f1 || true)
            if [[ "$served" == "$expected" ]]; then
              echo "public origin serves ${VERSION} (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: served=${served:-<none>}"
            if (( attempt < 10 )); then sleep 6; fi
          done
          echo "public origin does not serve the published release" >&2
          exit 1

      - name: Remove deploy key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
