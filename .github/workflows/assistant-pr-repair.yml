name: Assistant PR repair evidence

on:
  push:
    branches: [fix/assistant-handoff-confirmation-boundary]
    paths: [.github/workflows/assistant-pr-repair.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-pr-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-candidate:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/fix/assistant-handoff-confirmation-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: "2"
    steps:
      - name: Checkout complete candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record exact source identity
        run: |
          mkdir -p "$RUNNER_TEMP/assistant-pr-repair"
          git rev-parse HEAD | tee "$RUNNER_TEMP/assistant-pr-repair/source-sha.txt"
          git submodule status --recursive | tee "$RUNNER_TEMP/assistant-pr-repair/submodules.txt"
      - name: Set up repository Go version
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false
      - name: Generate Go formatting and module candidate
        working-directory: apps/api-go
        run: |
          set -euo pipefail
          go version
          go env GOMOD GOWORK
          mapfile -d '' files < <(git ls-files -z -- '*.go')
          if ((${#files[@]})); then
            gofmt -w "${files[@]}"
          fi
          go mod tidy
      - name: Set up repository Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Generate protected-header-safe web formatting candidate
        run: bun run --filter @lmm/web format
      - name: Export candidate without pushing or bypassing CI
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/assistant-pr-repair"
          mkdir -p "$artifact_dir/files"
          git diff --binary -- apps/api-go apps/web > "$artifact_dir/candidate.patch"
          git diff --stat -- apps/api-go apps/web > "$artifact_dir/diff-stat.txt"
          git diff --name-only -z -- apps/api-go apps/web > "$artifact_dir/changed-paths.nul"
          while IFS= read -r -d '' path; do
            if [[ -f "$path" ]]; then
              mkdir -p "$artifact_dir/files/$(dirname "$path")"
              cp -- "$path" "$artifact_dir/files/$path"
            fi
          done < "$artifact_dir/changed-paths.nul"
          cat "$artifact_dir/diff-stat.txt"
          head -c 60000 "$artifact_dir/candidate.patch"
          printf '\n'
          (cd "$artifact_dir" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload candidate and exact source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-pr329-repair-${{ github.sha }}
          path: ${{ runner.temp }}/assistant-pr-repair/
          retention-days: 7
          if-no-files-found: error
