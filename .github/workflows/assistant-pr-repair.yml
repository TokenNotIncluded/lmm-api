name: Publish reviewed assistant repair objects

on:
  push:
    branches: [fix/assistant-handoff-confirmation-boundary]
    paths: [.github/workflows/assistant-pr-repair.yml]

permissions:
  contents: read

jobs:
  publish-reviewed-objects:
    if: github.repository == 'TokenNotIncluded/api.lmm.best' && github.ref == 'refs/heads/fix/assistant-handoff-confirmation-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify reviewed artifact and publish only immutable blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile

          api = 'https://api.github.com/repos/TokenNotIncluded/api.lmm.best'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'assistant-reviewed-repair',
          }
          expected = {
              'apps/api-go/go.sum': ('cccbb025d70d9637390ac0ab04d53ec33d3fa8187f3fe9d950ee34024f142c29', '041a23a6ed0c25ecfd50c5bbba211b03f57ea40b'),
              'apps/web/src/features/assistant/assistant-handoff-confirmation.test.ts': ('50a386214cb420220e4378ca845679dbc4d97fa8143b846400c12c25afee7128', '27cd8d122ba8ef8637e7c6d3299dd60a7b3e63c7'),
              'apps/web/src/features/assistant/assistant-handoff-confirmation.ts': ('0e629dcce1b94f6c5eff76b01363d365b2c56bf87a6e48bd8a5c950f4f872a10', '93b8e8ad8aec271833a0046f6e21ef556b5704be'),
              'apps/web/src/features/assistant/assistant-handoff-review.test.tsx': ('49e0443d64b624e3ac8337db6a8ad95f9b2508fc1cb16e7fb9cd277c201b6687', 'c076197358878d230c38ece3ae5cb30e2d6e130e'),
              'apps/web/src/features/assistant/assistant-handoff-tool.tsx': ('569c6d6d2dd9be08148212761d5804c4068127f1b06425b56a40ab93c7257dbf', 'a401650fe317ed3fef0c90fc78b028e9fe409c58'),
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None

          request = urllib.request.Request(api + '/actions/artifacts/10446951827/zip', headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as response:
                  archive = response.read()
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise
              location = error.headers['Location']
              if not location.startswith('https://'):
                  raise RuntimeError('Refusing non-HTTPS artifact redirect')
              # Never forward the GitHub credential to the artifact storage host.
              with urllib.request.urlopen(location, timeout=60) as response:
                  archive = response.read()

          if hashlib.sha256(archive).hexdigest() != 'c5ee0009292d32d551d42aacd9e85d58a3712d763fcfa19464248eadf0bf5926':
              raise RuntimeError('Reviewed artifact digest mismatch')
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              if bundle.read('source-sha.txt').decode().strip() != 'aa5931a84db7ecc8908ad4a81cbb3083d865370c':
                  raise RuntimeError('Reviewed source revision mismatch')
              candidates = []
              for path, (digest, blob_sha) in expected.items():
                  content = bundle.read('files/' + path)
                  if hashlib.sha256(content).hexdigest() != digest:
                      raise RuntimeError('Reviewed file digest mismatch: ' + path)
                  actual_blob = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  if actual_blob != blob_sha:
                      raise RuntimeError('Reviewed Git blob mismatch: ' + path)
                  candidates.append((path, content.decode('utf-8'), blob_sha))

          # Only upload the five pre-reviewed immutable objects. No refs, branches,
          # commits, PRs, checks, or production deployment are modified by this job.
          for path, content, expected_sha in candidates:
              body = json.dumps({'content': content, 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request(api + '/git/blobs', data=body, headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              if result.get('sha') != expected_sha:
                  raise RuntimeError('Published object identity mismatch: ' + path)
              print(json.dumps({'path': path, 'sha': result['sha']}), flush=True)
