name: Promote verified release tag

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  checks: read
  contents: write

concurrency:
  group: promote-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  promote:
    name: Tag the CI-verified version and dispatch release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact CI-verified revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Promote a changed version only from current main
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$VERIFIED_REVISION" ]]

          git fetch --no-tags origin main
          [[ "$revision" == "$(git rev-parse origin/main)" ]] || {
            echo 'A newer main revision exists; this completed CI run will not promote a tag.'
            exit 0
          }
          git rev-parse "$revision^" >/dev/null
          if ! git diff --name-only "$revision^" "$revision" -- VERSION | grep -Fxq VERSION; then
            echo 'VERSION did not change in this revision; no release promotion is required.'
            exit 0
          fi

          GITHUB_TOKEN=$GH_TOKEN bash scripts/verify-release-commit-checks.sh "$revision"

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          node scripts/release.mjs verify --version "$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >tag-ref; then
            tag_revision=$(awk 'NR == 1 { print $1 }' tag-ref)
            [[ "$tag_revision" == "$revision" ]] || {
              echo "$tag already points to $tag_revision, not $revision" >&2
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$revision" >/dev/null
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published; no release dispatch is required."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$tag" -f publish=true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Summarize promotion
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo '## Release promoted'
            echo
            echo "- Immutable tag: \`$RELEASE_TAG\`"
            echo '- Release workflow dispatched from the tag after main CI passed.'
          } >> "$GITHUB_STEP_SUMMARY"
