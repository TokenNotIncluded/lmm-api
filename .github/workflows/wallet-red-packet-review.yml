name: Wallet and red packet review

on:
  pull_request:
    paths:
      - 'apps/web/src/features/wallet/**'
      - 'apps/web/src/features/red-packets/**'
      - 'apps/web/src/components/frontend-update-notice.tsx'
      - 'apps/web/src/lib/frontend-*.ts'
      - 'apps/web/scripts/visual-review/wallet_red_packet_review.py'
      - 'apps/api-go/model/red_packet*.go'
      - 'apps/api-go/controller/topup*.go'
      - '.github/workflows/wallet-red-packet-review.yml'

permissions:
  contents: read

concurrency:
  group: wallet-red-packet-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Run focused frontend regression tests and production build
        working-directory: apps/web
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wallet-review"
          git rev-parse HEAD > "$RUNNER_TEMP/wallet-review/revision.txt"
          shopt -s globstar nullglob
          for test in src/features/wallet/**/*.test.ts src/features/wallet/**/*.test.tsx src/features/red-packets/*.test.ts src/features/red-packets/*.test.tsx src/lib/frontend-*.test.ts; do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "$test"
          done
          bun run build 2>&1 | tee "$RUNNER_TEMP/wallet-review/build.log"
      - name: Install isolated browser test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/wallet-browser"
          "$RUNNER_TEMP/wallet-browser/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/wallet-browser/bin/playwright" install --with-deps chromium
      - name: Verify browser interactions with synthetic local data
        working-directory: apps/web
        env:
          WALLET_REVIEW_OUTPUT: ${{ runner.temp }}/wallet-review
        shell: bash
        run: |
          bun run preview --host 127.0.0.1 --port 4185 > "$WALLET_REVIEW_OUTPUT/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4185/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          "$RUNNER_TEMP/wallet-browser/bin/python" scripts/visual-review/wallet_red_packet_review.py 2>&1 | tee "$WALLET_REVIEW_OUTPUT/browser.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wallet-red-packet-browser-evidence
          path: ${{ runner.temp }}/wallet-review
          retention-days: 7
          if-no-files-found: error
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lmm_test_wallet
          POSTGRES_PASSWORD: local-wallet-test-password
          POSTGRES_DB: lmm_test_wallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lmm_test_wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: |
            apps/api-go/go.sum
            packages/relaykit/go.sum
      - name: Model and controller regression tests
        working-directory: apps/api-go
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wallet-backend"
          git rev-parse HEAD > "$RUNNER_TEMP/wallet-backend/revision.txt"
          test -z "$(gofmt -l model/red_packet*.go controller/topup*.go)"
          go test -p 2 ./model ./controller -count=1 2>&1 | tee "$RUNNER_TEMP/wallet-backend/unit.log"
      - name: PostgreSQL concurrent claim versus deletion
        working-directory: apps/api-go
        env:
          TEST_POSTGRES_DSN: postgres://lmm_test_wallet:local-wallet-test-password@127.0.0.1:5432/lmm_test_wallet?sslmode=disable
          TEST_POSTGRES_ISOLATED_SCHEMA: '1'
        shell: bash
        run: |
          go test -race -p 2 -count=1 -v ./model -run '^TestRedPacketDeleteCannotEraseConcurrentClaimPostgres$' -timeout 180s 2>&1 | tee "$RUNNER_TEMP/wallet-backend/concurrency.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wallet-red-packet-backend-evidence
          path: ${{ runner.temp }}/wallet-backend
          retention-days: 7
          if-no-files-found: error
