name: Wallet and red packet review

on:
  push:
    branches: [fix/wallet-red-packet-recovery]
    paths: [.github/workflows/wallet-red-packet-review.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Export public source and locked test dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wallet-source"
          git rev-parse HEAD > "$RUNNER_TEMP/wallet-source/revision.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/wallet-source/source.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/wallet-source/dependencies.tar.gz" node_modules apps/web/node_modules
          cp "$(command -v bun)" "$RUNNER_TEMP/wallet-source/bun"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallet-regression-source
          path: ${{ runner.temp }}/wallet-source
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
