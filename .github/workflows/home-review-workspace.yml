name: Temporary homepage review workspace

on:
  push:
    branches: [codex/home-polish-20260927]
    paths: [.github/workflows/home-review-workspace.yml]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @lmm/web build
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/home-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/home-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Capture real baseline
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p artifacts/home-review
          bun run preview --host 127.0.0.1 --port 4175 >artifacts/home-review/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for ((attempt=0; attempt<60; attempt++)); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/home-browser/node_modules/playwright/index.mjs" node scripts/home-design-review.mjs
      - name: Package offline layout preview
        if: always()
        run: |
          mkdir -p apps/web/artifacts/home-review
          git rev-parse HEAD > apps/web/artifacts/home-review/revision.txt
          if [[ -d apps/web/dist ]]; then tar -czf apps/web/artifacts/home-review/dist.tar.gz -C apps/web dist; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: homepage-baseline
          path: apps/web/artifacts/home-review/
          retention-days: 1
          if-no-files-found: error
