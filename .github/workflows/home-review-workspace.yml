name: Temporary homepage review workspace

on:
  push:
    branches: [codex/home-polish-20260927]
    paths: [.github/workflows/home-review-workspace.yml]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Apply exact hash-verified source edits
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/codex/home-polish-20260927 ]]
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          allowed = {
              'apps/web/scripts/home-design-review.mjs',
              'apps/web/src/features/forge/forge-home-mobile.test.ts',
              'apps/web/src/features/forge/forge-home.css',
              'apps/web/src/features/home/home-landing.tsx',
              'apps/web/src/features/home/home-motion.ts',
          }
          edits = json.loads(Path('.agents/home-polish-recipe.json').read_text())
          assert {item['path'] for item in edits} == allowed
          assert len(edits) == len(allowed)
          for item in edits:
              path = Path(item['path'])
              assert path.is_file() and not path.is_symlink()
              original = path.read_bytes()
              assert hashlib.sha256(original).hexdigest() == item['before'], str(path)
              lines = original.decode().splitlines(True)
              previous = len(lines)
              for edit in reversed(item['edits']):
                  start, stop, text = edit['start'], edit['stop'], edit['text']
                  assert 0 <= start <= stop <= previous
                  # Restore a dropped final padding value in the transport recipe;
                  # the target digest below still pins the exact intended source.
                  if item['path'].endswith('forge-home.css') and start == 845:
                      assert text == '  padding: clamp(4rem, 7vw, 7rem) var(--home-gutter);\n'
                      text = '  padding: clamp(4rem, 7vw, 7rem) var(--home-gutter) 0;\n'
                  lines[start:stop] = [text]
                  previous = start
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == item['after'], str(path)
              path.write_bytes(result)
          PY
      - run: bun install --frozen-lockfile
      - name: Format with protected license headers
        run: bun run --filter @lmm/web format
      - name: Commit only the reviewed source paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed = {item['path'] for item in json.loads(Path('.agents/home-polish-recipe.json').read_text())}
          allowed |= {
              'apps/web/src/features/forge/forge-home.tsx',
              'apps/web/src/features/forge/forge-public-shell.tsx',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= allowed, sorted(changed - allowed)
          for name in sorted(changed):
              subprocess.run(['git', 'add', '--', name], check=True)
          PY
          git rm .agents/home-polish-recipe.json .github/workflows/home-review-workspace.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(web): refine homepage layout and keep mobile navigation in view'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/codex/home-polish-20260927
      - name: Build actual production frontend
        id: build
        run: bun run --filter @lmm/web build
      - name: Check frontend quality
        run: |
          bun run --filter @lmm/web format:check
          bun run --filter @lmm/web copyright:check
          bun run --filter @lmm/web lint
          bun run --filter @lmm/web typecheck
          bun run --filter @lmm/web test
          bun run --filter @lmm/web bundle:check
      - name: Install isolated browser
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/home-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/home-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review actual responsive layout and controls
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p artifacts/home-review
          bun run preview --host 127.0.0.1 --port 4175 >artifacts/home-review/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for ((attempt=0; attempt<60; attempt++)); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/home-browser/node_modules/playwright/index.mjs" node scripts/home-design-review.mjs
      - name: Preserve exact reviewed source and screenshots
        if: always()
        run: |
          mkdir -p apps/web/artifacts/home-review
          git rev-parse HEAD > apps/web/artifacts/home-review/revision.txt
          git archive --format=tar.gz --output=apps/web/artifacts/home-review/source.tar.gz HEAD
          if [[ -d apps/web/dist ]]; then tar -czf apps/web/artifacts/home-review/dist.tar.gz -C apps/web dist; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: homepage-candidate
          path: apps/web/artifacts/home-review/
          retention-days: 7
          if-no-files-found: error
