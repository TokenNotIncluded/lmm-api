name: Assistant support regressions

on:
  # Also run on branch pushes so an unrelated PR merge conflict cannot hide
  # regressions in the confirmation UI. This does not replace the main CI gates.
  push:
    paths:
      - ".github/workflows/assistant-support-regressions.yml"
      - "apps/web/src/features/assistant/**"
      - "apps/web/src/components/ai-elements/tool.tsx"
      - "apps/web/src/components/ui/**"
      - "apps/web/src/stores/auth-store.ts"
      - "apps/web/scripts/test-preload.mjs"
      - "apps/web/package.json"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support-confirmation:
    name: Human-support confirmation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Record tested source identity
        run: |
          git rev-parse HEAD
          sha256sum \
            apps/web/src/features/assistant/assistant-handoff-confirmation.ts \
            apps/web/src/features/assistant/assistant-handoff-tool.tsx \
            apps/web/src/features/assistant/assistant-tool-calls.tsx \
            apps/web/src/features/assistant/assistant-support-review-dialog.tsx \
            apps/web/src/features/assistant/assistant-handoff-review.test.tsx

      - name: Test actual support components serially
        working-directory: apps/web
        run: |
          for test in \
            assistant-handoff-confirmation.test.ts \
            assistant-handoff-tool.test.tsx \
            assistant-handoff-review.test.tsx
          do
            bun test --preload ./scripts/test-preload.mjs --timeout 15000 "./src/features/assistant/$test"
          done
