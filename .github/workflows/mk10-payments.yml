name: mk10-payment-safety
on:
  pull_request:
    paths:
      - 'services/extensions/internal/modules/payments/**'
      - 'services/extensions/internal/coreclient/payments.go'
      - 'services/extensions/internal/corepb/**'
      - 'services/extensions/go.*'
      - '.github/workflows/mk10-payments.yml'
  push:
    branches: ['wip/mk-10-payments']
    paths:
      - 'services/extensions/internal/modules/payments/**'
      - 'services/extensions/internal/coreclient/payments.go'
      - '.github/workflows/mk10-payments.yml'
permissions:
  contents: read
jobs:
  simulated-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payments_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: lmm_payments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payments_test -d lmm_payments_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: services/extensions/go.mod
          cache: false
      - name: Payment module, controlled RPC and host tests
        working-directory: services/extensions
        run: |
          go test -race -count=3 ./internal/modules/payments/... ./internal/coreclient ./internal/modules
          go vet ./internal/modules/payments/... ./internal/coreclient
      - name: Dedicated PostgreSQL persistence and concurrent writes
        working-directory: services/extensions/internal/modules/payments/pgtest
        env:
          PAYMENT_TEST_DSN: postgres://payments_test:disposable_test_password@localhost:5432/lmm_payments_test?sslmode=disable
        run: go test -race -count=1 -v ./...
