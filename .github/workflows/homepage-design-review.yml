name: Homepage design review

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/features/home/**'
      - 'apps/web/src/features/forge/forge-home*'
      - 'apps/web/scripts/home-design-review.mjs'
      - '.github/workflows/homepage-design-review.yml'
  pull_request:
    paths:
      - 'apps/web/src/features/home/**'
      - 'apps/web/src/features/forge/forge-home*'
      - 'apps/web/scripts/home-design-review.mjs'
      - '.github/workflows/homepage-design-review.yml'

permissions:
  contents: read

concurrency:
  group: homepage-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-review:
    name: Homepage browser layout and motion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build production frontend
        run: bun run --filter @lmm/web build
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/home-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/home-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Review responsive layout and motion
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/home-review
          bun run preview --host 127.0.0.1 --port 4175 >artifacts/home-review/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/home-browser/node_modules/playwright/index.mjs" node scripts/home-design-review.mjs
      - name: Preserve screenshots and review revision
        if: always()
        run: |
          mkdir -p apps/web/artifacts/home-review
          git rev-parse HEAD > apps/web/artifacts/home-review/revision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: homepage-browser-review
          path: apps/web/artifacts/home-review/
          retention-days: 7
          if-no-files-found: error
