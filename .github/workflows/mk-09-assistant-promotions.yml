name: Assistant and promotions checks
on:
  push:
    branches: [wip/mk-09-assistant-promotions]
  pull_request:
    branches: [wip/rust-core-go-extensions]
    paths:
      - apps/lmm-extensions/internal/modules/assistant/**
      - apps/lmm-extensions/internal/modules/promotions/**
      - scripts/test-core-boundaries.py
      - .github/workflows/mk-09-assistant-promotions.yml
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: mk09-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            apps/lmm-extensions/go.sum
            apps/lmm-extensions/internal/modules/assistant/pgtest/go.sum
      - name: Record exact tested source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/tested-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/mk09-source.tar.gz"
      - name: Source boundaries
        run: python3 -B scripts/test-core-boundaries.py
      - name: Go checks
        if: ${{ !cancelled() }}
        working-directory: apps/lmm-extensions
        run: |
          bash ../../scripts/check-go-format.sh .
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -json ./... | tee "$RUNNER_TEMP/extension-tests.jsonl"
          CGO_ENABLED=0 go build -mod=readonly -trimpath ./cmd/extensions
      - name: Real PostgreSQL isolation and recovery
        if: ${{ !cancelled() }}
        working-directory: apps/lmm-extensions/internal/modules/assistant/pgtest
        env:
          LMM_MK09_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go mod verify
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -json ./... | tee "$RUNNER_TEMP/postgres-tests.jsonl"
      - name: Preserve test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mk09-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tested-sha.txt
            ${{ runner.temp }}/extension-tests.jsonl
            ${{ runner.temp }}/postgres-tests.jsonl
            ${{ runner.temp }}/mk09-source.tar.gz
          retention-days: 7
          if-no-files-found: error
