name: LMM API 前端改进
description: 建议界面、无障碍或移动端体验改进
title: "[Frontend] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 有效反馈奖励

        经维护者审核并确认有效、非重复且属于本项目范围的反馈，可获得 **5 美元起**的奖励。提交 Issue 不代表自动获奖；最终资格和金额以审核结果为准。

        提交前请搜索本仓库的 Issues。请勿包含 API Key、Cookie、Token、密码、DSN 或其他敏感信息。

  - type: checkboxes
    id: submission-checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索本仓库的 [Issues](https://github.com/TokenNotIncluded/api.lmm.best/issues)，确认没有重复建议。
          required: true
        - label: 我已说明具体页面、使用场景和可验证的改进结果。
          required: true
        - label: 我已移除截图、链接和描述中的所有敏感信息。
          required: true

  - type: input
    id: affected-page
    attributes:
      label: 受影响的页面或流程
      description: 填写页面名称、站内路径或具体操作流程。
      placeholder: 例如：移动端 /pricing 页面、登录后的 API Key 创建流程
    validations:
      required: true

  - type: textarea
    id: current-experience
    attributes:
      label: 当前体验与影响
      description: 说明目前哪里难用、不清晰、不一致，或存在无障碍与移动端问题。
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: 建议的改进
      description: 描述期望的界面、交互或信息层级，以及如何验证改进有效。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 设备与环境
      description: 填写设备、操作系统、浏览器、窗口尺寸，以及是否使用键盘或辅助技术。
      placeholder: |
        设备与系统：
        浏览器：
        窗口或屏幕尺寸：
        输入方式或辅助技术：
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图、草图或补充证据
      description: 可附脱敏截图、短视频、草图或对比参考。
    validations:
      required: false
