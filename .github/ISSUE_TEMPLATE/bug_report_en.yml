name: LMM API Bug Report
description: Report a bug reproducible in LMM Forge or a compatibility regression
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting

        This repository handles issues reproducible in **LMM Forge** and regressions introduced by the current product or compatibility layers.

        - Usage and deployment: [project README](https://github.com/TokenNotIncluded/api.lmm.best#readme)
        - Bounty workflow: [open-source bounty guide](https://github.com/TokenNotIncluded/api.lmm.best/blob/main/docs/open-source-bounties.zh-CN.md)
        - For third-party hosted services, private forks, or external provider failures, contact the relevant maintainer or provider.
        - Remove API keys, cookies, tokens, passwords, DSNs, and all other secrets before posting.

        ## Rewards for valid feedback

        Reports confirmed by a maintainer as valid, non-duplicate, and in scope may earn a reward starting at **$5**. Submitting an Issue does not guarantee a reward; final eligibility and amount depend on the review.

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission checks
      options:
        - label: I searched this repository's [Issues](https://github.com/TokenNotIncluded/api.lmm.best/issues) and found no duplicate.
          required: true
        - label: I reproduced the issue with unmodified code from this repository; it is not limited to a third-party service or my private changes.
          required: true
        - label: I removed API keys, cookies, tokens, passwords, DSNs, and other sensitive data from requests, logs, and screenshots.
          required: true

  - type: input
    id: fork-version
    attributes:
      label: LMM API version
      description: Enter an exact commit SHA, release, or image tag. Do not use `latest` or `unknown`.
      placeholder: "For example: a1b2c3d or v1.2.3"
    validations:
      required: true

  - type: dropdown
    id: deployment-method
    attributes:
      label: Deployment method
      options:
        - Built from this repository
        - Container image built from this repository
        - Local development environment
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Describe the actual behavior, impact, and frequency.
      placeholder: |
        What happened:
        Affected functionality or users:
        Always or intermittently:
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal, complete, repeatable steps. Include a redacted request for API issues.
      placeholder: |
        1. Configure ...
        2. Send a request to ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected behavior
      description: Describe the correct behavior and the basis for that expectation.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, database, browser/client, and the relevant channel and model when applicable.
      placeholder: |
        OS and architecture:
        Database:
        Browser or client:
        Channel, model, and request protocol:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or minimal reproduction
      description: Add redacted server logs, response bodies, browser Console/Network output, or a minimal reproduction repository.
    validations:
      required: false
