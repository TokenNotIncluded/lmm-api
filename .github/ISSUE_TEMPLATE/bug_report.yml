name: LMM API 问题报告
description: 报告可在 LMM Forge 中复现的问题或兼容行为回归
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请确认

        本仓库只处理能够在 **LMM Forge** 中复现的问题，以及由当前产品层或兼容层修改引入的回归。

        - 使用与部署说明：[项目 README](https://github.com/TokenNotIncluded/api.lmm.best#readme)
        - 悬赏流程说明：[开源悬赏玩法](https://github.com/TokenNotIncluded/api.lmm.best/blob/main/docs/open-source-bounties.zh-CN.md)
        - 第三方托管站、私有修改版和外部供应商服务本身的问题，请联系相应维护者或服务商。
        - 请务必删除 API Key、Cookie、Token、密码、DSN 和其他敏感信息。

        ## 有效反馈奖励

        经维护者审核并确认有效、非重复且属于本项目范围的问题，可获得 **5 美元起**的奖励。提交 Issue 不代表自动获奖；最终资格和金额以审核结果为准。

  - type: checkboxes
    id: submission-checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索本仓库的 [Issues](https://github.com/TokenNotIncluded/api.lmm.best/issues)，确认没有重复问题。
          required: true
        - label: 我确认问题能够在本仓库未修改的代码中复现，而不是仅存在于第三方服务或我的私有修改中。
          required: true
        - label: 我已移除日志、截图和请求中的 API Key、Cookie、Token、密码、DSN 等敏感信息。
          required: true

  - type: input
    id: fork-version
    attributes:
      label: LMM API 版本
      description: 填写准确的 commit SHA、版本号或镜像标签；请勿填写 `latest` 或 `unknown`。
      placeholder: 例如：a1b2c3d 或 v1.2.3
    validations:
      required: true

  - type: dropdown
    id: deployment-method
    attributes:
      label: 部署方式
      options:
        - 从本仓库源码构建
        - 使用基于本仓库构建的容器镜像
        - 本地开发环境
        - 其他（请在环境信息中说明）
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述
      description: 说明实际现象、影响范围和发生频率。
      placeholder: |
        实际发生了什么：
        影响哪些功能或用户：
        每次发生还是偶发：
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤
      description: 提供最小、完整、可重复执行的步骤；API 问题请附脱敏请求。
      placeholder: |
        1. 使用以下配置……
        2. 请求以下端点……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: 预期结果
      description: 说明你认为正确的行为及依据。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请填写操作系统、架构、数据库、浏览器/客户端，以及相关渠道和模型（如适用）。
      placeholder: |
        操作系统与架构：
        数据库：
        浏览器或客户端：
        渠道、模型与请求协议：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志、截图或最小复现
      description: 粘贴脱敏后的服务端日志、响应体、浏览器 Console/Network 信息或最小复现仓库。
    validations:
      required: false
