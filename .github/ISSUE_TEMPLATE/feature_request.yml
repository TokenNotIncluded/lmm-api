name: LMM API 功能建议
description: 建议适合由 LMM Forge 维护的新功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请确认

        请说明该需求如何服务于 LMM Forge 的悬赏协作、交付跟踪或运营流程。

        提交前请搜索本仓库的 Issues，并查看[项目 README](https://github.com/TokenNotIncluded/api.lmm.best#readme)与[悬赏流程说明](https://github.com/TokenNotIncluded/api.lmm.best/blob/main/docs/open-source-bounties.zh-CN.md)。

        ## 有效反馈奖励

        经维护者审核并确认有效、非重复且属于本项目范围的建议，可获得 **5 美元起**的奖励。提交 Issue 不代表自动获奖；最终资格和金额以审核结果为准。

  - type: checkboxes
    id: submission-checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索本仓库的 [Issues](https://github.com/TokenNotIncluded/api.lmm.best/issues)，确认没有重复建议。
          required: true
        - label: 我已说明此功能如何服务于 LMM Forge 当前产品流程。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述实际使用场景、当前限制和受影响的用户，不要只给出解决方案名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的用户体验、接口或行为，并给出具体示例。
    validations:
      required: true

  - type: textarea
    id: fork-rationale
    attributes:
      label: 与当前产品流程的关系
      description: 说明该功能服务于哪些角色、状态或结算流程，以及如何验证它。
      placeholder: |
        受影响的角色：
        对应的悬赏或交付状态：
        可验证的预期结果：
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明目前的临时方案，以及为何不足。
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可附界面草图、协议资料、兼容性要求或实现建议；请勿包含敏感信息。
    validations:
      required: false
