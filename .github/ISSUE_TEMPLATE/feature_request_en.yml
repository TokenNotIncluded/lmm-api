name: LMM API Feature Request
description: Suggest a feature or improvement appropriate for LMM Forge
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting

        Explain how this request improves LMM Forge bounty collaboration, delivery tracking, or operations.

        Search this repository's Issues, then review the [project README](https://github.com/TokenNotIncluded/api.lmm.best#readme) and [bounty workflow guide](https://github.com/TokenNotIncluded/api.lmm.best/blob/main/docs/open-source-bounties.zh-CN.md) before submitting.

        ## Rewards for valid feedback

        Requests confirmed by a maintainer as valid, non-duplicate, and in scope may earn a reward starting at **$5**. Submitting an Issue does not guarantee a reward; final eligibility and amount depend on the review.

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission checks
      options:
        - label: I searched this repository's [Issues](https://github.com/TokenNotIncluded/api.lmm.best/issues) and found no duplicate request.
          required: true
        - label: I explained how this feature serves the current LMM Forge product workflow.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the real use case, current limitation, and affected users rather than only naming a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected user experience, API, or behavior and include concrete examples.
    validations:
      required: true

  - type: textarea
    id: fork-rationale
    attributes:
      label: Relationship to the current product workflow
      description: State which roles, states, or settlement flows this improves and how it can be verified.
      placeholder: |
        Affected roles:
        Related bounty or delivery state:
        Verifiable expected result:
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds and why they are insufficient.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, protocol references, compatibility constraints, or implementation ideas. Do not include secrets.
    validations:
      required: false
