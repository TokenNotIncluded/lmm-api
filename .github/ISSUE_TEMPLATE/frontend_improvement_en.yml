name: LMM API Frontend Improvement
description: Suggest an interface, accessibility, or mobile experience improvement
title: "[Frontend] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Rewards for valid feedback

        Feedback confirmed by a maintainer as valid, non-duplicate, and in scope may earn a reward starting at **$5**. Submitting an Issue does not guarantee a reward; final eligibility and amount depend on the review.

        Search existing Issues before submitting. Never include API keys, cookies, tokens, passwords, DSNs, or other secrets.

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission checks
      options:
        - label: I searched this repository's [Issues](https://github.com/TokenNotIncluded/api.lmm.best/issues) and found no duplicate suggestion.
          required: true
        - label: I identified the page, use case, and a verifiable improvement outcome.
          required: true
        - label: I removed all sensitive information from screenshots, links, and descriptions.
          required: true

  - type: input
    id: affected-page
    attributes:
      label: Affected page or workflow
      description: Enter the page name, application path, or specific workflow.
      placeholder: For example, mobile /pricing or the signed-in API key creation flow
    validations:
      required: true

  - type: textarea
    id: current-experience
    attributes:
      label: Current experience and impact
      description: Explain what is difficult, unclear, inconsistent, inaccessible, or poor on mobile.
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: Proposed improvement
      description: Describe the expected interface, interaction, or information hierarchy and how to verify the improvement.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Device and environment
      description: Include device, operating system, browser, viewport, and any keyboard or assistive technology use.
      placeholder: |
        Device and operating system:
        Browser:
        Viewport or screen size:
        Input method or assistive technology:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, mockups, or supporting evidence
      description: Add redacted screenshots, short recordings, mockups, or comparison references.
    validations:
      required: false
