<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMM Forge — 500 · Oat editorial</title>
    <style>
      :root {
        --oat: #e3dacc;
        --ivory: #faf9f5;
        --ink: #141413;
        --muted: #5e5a52;
        --clay: #d97757;
        --cactus: #bcd1ca;
        --paper-line: rgba(20, 20, 19, 0.24);
        --sans: "Public Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --serif: "Lora Variable", Lora, Georgia, serif;
      }

      * { box-sizing: border-box; }

      html { min-width: 320px; background: var(--oat); }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--oat);
        color: var(--ink);
        font-family: var(--sans);
      }

      button, a { font: inherit; }

      button:focus-visible, a:focus-visible {
        outline: 2px solid var(--clay);
        outline-offset: 4px;
      }

      .board {
        position: relative;
        min-height: 100vh;
        padding: clamp(28px, 5vw, 72px) clamp(24px, 6.5vw, 96px) clamp(36px, 6vw, 80px);
      }

      .direction-tag {
        position: absolute;
        top: 24px;
        right: clamp(24px, 6.5vw, 96px);
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .editorial {
        display: grid;
        grid-template-columns: minmax(300px, 0.74fr) minmax(0, 1.26fr);
        align-items: center;
        gap: clamp(36px, 7vw, 118px);
        width: min(100%, 1248px);
        min-height: calc(100vh - 120px);
        margin: 0 auto;
      }

      .copy { padding-top: 16px; }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand-mark {
        position: relative;
        display: inline-block;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--cactus);
      }

      .brand-mark::before {
        position: absolute;
        top: 6px;
        left: 7px;
        width: 9px;
        height: 11px;
        border: 2px solid var(--ink);
        border-top: 0;
        border-right: 0;
        border-radius: 0 0 0 3px;
        content: "";
      }

      .brand-mark::after {
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--clay);
        content: "";
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: clamp(58px, 8vh, 96px) 0 16px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .kicker::before {
        display: block;
        width: 28px;
        height: 5px;
        border-radius: 999px;
        background: var(--clay);
        content: "";
      }

      .status {
        margin: 0;
        color: var(--ink);
        font-family: var(--serif);
        font-size: clamp(5.2rem, 11vw, 9.8rem);
        font-weight: 400;
        letter-spacing: -0.09em;
        line-height: 0.78;
      }

      h1 {
        max-width: 530px;
        margin: 30px 0 0;
        font-family: var(--serif);
        font-size: clamp(2.35rem, 4.2vw, 4.25rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      .description {
        max-width: 410px;
        margin: 25px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .description span { display: block; }

      .note {
        max-width: 420px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 30px;
      }

      .action {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0 17px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .action:hover { background: var(--ivory); }

      .action.primary {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--ivory);
      }

      .action.primary:hover { background: #30302c; }

      .art-wrap {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        min-width: 0;
        padding-top: 54px;
      }

      .art {
        display: block;
        width: min(100%, 740px);
        height: auto;
        border-radius: 42% 58% 48% 52% / 46% 42% 58% 54%;
      }

      .rule {
        width: min(100%, 740px);
        height: 1px;
        margin: 18px 0 0 auto;
        background: var(--paper-line);
      }

      @media (max-width: 820px) {
        .direction-tag { position: static; margin-bottom: 28px; }
        .editorial {
          display: block;
          min-height: 0;
          margin: 0;
        }
        .copy { padding-top: 0; }
        .kicker { margin-top: 54px; }
        .art-wrap { padding-top: 54px; }
        .art { width: min(100%, 650px); margin-left: auto; }
      }

      @media (max-width: 480px) {
        .board { padding: 24px 20px 36px; }
        .direction-tag { font-size: 9px; }
        .kicker { margin-top: 48px; }
        .status { font-size: clamp(5rem, 27vw, 7rem); }
        h1 { margin-top: 24px; font-size: clamp(2.2rem, 11vw, 3.25rem); }
        .actions { align-items: stretch; }
        .action { flex: 1 1 auto; }
        .art-wrap { padding-top: 38px; }
        .art { width: calc(100% + 24px); max-width: none; margin-right: -12px; }
        .rule { margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="board" aria-labelledby="error-title">
      <p class="direction-tag" aria-hidden="true">Direction A · Oat editorial</p>
      <div class="editorial">
        <section class="copy" aria-label="Error details">
          <div class="brand" aria-label="LMM Forge">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>LMM Forge</span>
          </div>

          <p class="kicker">SYSTEM NOTE</p>
          <p class="status" aria-label="500">500</p>
          <h1 id="error-title">Oops! Something went wrong :')</h1>
          <p class="description">
            <span>We apologize for the inconvenience.</span>
            <span>Please try again later.</span>
          </p>
          <p class="note">If this keeps happening, please report it on GitHub Issues.</p>

          <nav class="actions" aria-label="Error recovery actions">
            <button class="action primary" type="button">Go Back</button>
            <a class="action" href="https://github.com/LIghtJUNction/api.lmm.best/issues">Report an issue</a>
            <button class="action" type="button">Back to Home</button>
          </nav>
        </section>

        <figure class="art-wrap" aria-label="A bent signal being gently supported back into alignment">
          <img class="art" src="../assets/error-recovery-oat.png" alt="" />
          <figcaption class="rule"></figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
