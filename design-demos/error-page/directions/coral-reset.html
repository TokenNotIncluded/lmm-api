<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMM Forge — 500 · Coral quiet reset</title>
    <style>
      :root {
        --coral: #ebcece;
        --oat: #e3dacc;
        --ivory: #faf9f5;
        --ink: #141413;
        --muted: #5e5a52;
        --clay: #d97757;
        --cactus: #bcd1ca;
        --sans: "Public Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --serif: "Lora Variable", Lora, Georgia, serif;
      }

      * { box-sizing: border-box; }

      figure { margin: 0; }

      html { min-width: 320px; background: var(--coral); }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--coral);
        color: var(--ink);
        font-family: var(--sans);
      }

      button, a { font: inherit; }

      button:focus-visible, a:focus-visible {
        outline: 2px solid var(--clay);
        outline-offset: 4px;
      }

      .board {
        position: relative;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        padding: clamp(26px, 4vw, 54px) clamp(20px, 5vw, 72px) clamp(30px, 4vw, 54px);
      }

      .direction-tag {
        position: absolute;
        top: 24px;
        right: clamp(20px, 5vw, 72px);
        color: rgba(20, 20, 19, 0.6);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .masthead {
        display: flex;
        width: min(100%, 980px);
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }

      .brand-mark {
        position: relative;
        display: inline-block;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--cactus);
      }

      .brand-mark::before {
        position: absolute;
        top: 6px;
        left: 7px;
        width: 9px;
        height: 11px;
        border: 2px solid var(--ink);
        border-top: 0;
        border-right: 0;
        border-radius: 0 0 0 3px;
        content: "";
      }

      .brand-mark::after {
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--clay);
        content: "";
      }

      .poster {
        display: flex;
        width: min(100%, 980px);
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        padding: 18px 0 0;
        text-align: center;
      }

      .kicker {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .status {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(5rem, 8vw, 7rem);
        font-weight: 400;
        letter-spacing: -0.1em;
        line-height: 0.76;
      }

      h1 {
        max-width: 860px;
        margin: 18px 0 0;
        font-family: var(--serif);
        font-size: clamp(2.3rem, 3.8vw, 3.7rem);
        font-weight: 400;
        letter-spacing: -0.06em;
        line-height: 0.98;
      }

      .description {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .description span { display: block; }

      .note {
        max-width: 520px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .art {
        display: block;
        width: min(100%, 520px);
        height: auto;
        margin: 18px auto 0;
        border: 1px solid var(--ink);
        border-radius: 28px 28px 86px 28px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
      }

      .action {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0 17px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .action:hover { background: var(--ivory); }

      .action.primary {
        background: var(--ink);
        color: var(--ivory);
      }

      .action.primary:hover { background: #30302c; }

      @media (max-width: 760px) {
        .direction-tag { position: static; align-self: flex-end; margin-bottom: 22px; }
        .masthead { width: 100%; }
        .poster { padding-top: 12px; }
      }

      @media (max-width: 480px) {
        .board { padding: 22px 18px 28px; }
        .direction-tag { margin-bottom: 25px; font-size: 9px; }
        .poster { padding-top: 12px; }
        .status { font-size: clamp(4.8rem, 25vw, 6.7rem); }
        h1 { margin-top: 23px; font-size: clamp(2.15rem, 10.5vw, 3.2rem); }
        .description { margin-top: 20px; }
        .art { width: calc(100% + 8px); max-width: none; margin-top: 28px; margin-left: -4px; border-radius: 22px 22px 56px 22px; }
        .actions { display: grid; width: min(100%, 320px); grid-template-columns: 1fr; margin-top: 22px; }
        .action { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="board" aria-labelledby="error-title">
      <p class="direction-tag" aria-hidden="true">Direction C · Coral quiet reset</p>

      <header class="masthead">
        <div class="brand" aria-label="LMM Forge">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>LMM Forge</span>
        </div>
      </header>

      <section class="poster" aria-label="Error details">
        <p class="kicker">SYSTEM NOTE</p>
        <p class="status" aria-label="500">500</p>
        <h1 id="error-title">Oops! Something went wrong :')</h1>
        <p class="description">
          <span>We apologize for the inconvenience.</span>
          <span>Please try again later.</span>
        </p>
        <p class="note">If this keeps happening, please report it on GitHub Issues.</p>

        <figure aria-label="A bent signal being gently supported back into alignment">
          <img class="art" src="../assets/error-recovery-oat.png" alt="" />
        </figure>

        <nav class="actions" aria-label="Error recovery actions">
          <button class="action primary" type="button">Go Back</button>
          <a class="action" href="https://github.com/LIghtJUNction/api.lmm.best/issues">Report an issue</a>
          <button class="action" type="button">Back to Home</button>
        </nav>
      </section>
    </main>
  </body>
</html>
