<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMM Forge — 500 · Cactus recovery</title>
    <style>
      :root {
        --cactus: #bcd1ca;
        --oat: #e3dacc;
        --ivory: #faf9f5;
        --ink: #141413;
        --muted: #5e5a52;
        --clay: #d97757;
        --sans: "Public Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --serif: "Lora Variable", Lora, Georgia, serif;
      }

      * { box-sizing: border-box; }

      html { min-width: 320px; background: var(--cactus); }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--cactus);
        color: var(--ink);
        font-family: var(--sans);
      }

      button, a { font: inherit; }

      button:focus-visible, a:focus-visible {
        outline: 2px solid var(--clay);
        outline-offset: 4px;
      }

      .board {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 72px clamp(20px, 5vw, 72px) 48px;
      }

      .direction-tag {
        position: absolute;
        top: 24px;
        right: clamp(20px, 5vw, 72px);
        color: rgba(20, 20, 19, 0.6);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .recovery-panel {
        display: grid;
        grid-template-columns: minmax(260px, 0.82fr) minmax(0, 1.18fr);
        align-items: stretch;
        gap: clamp(26px, 5vw, 78px);
        width: min(100%, 1180px);
        min-height: 650px;
        padding: clamp(30px, 5vw, 64px);
        border: 1.5px solid var(--ink);
        border-radius: 30px;
        background: var(--ivory);
      }

      .copy {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .brand {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }

      .brand-mark {
        position: relative;
        display: inline-block;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--cactus);
      }

      .brand-mark::before {
        position: absolute;
        top: 6px;
        left: 7px;
        width: 9px;
        height: 11px;
        border: 2px solid var(--ink);
        border-top: 0;
        border-right: 0;
        border-radius: 0 0 0 3px;
        content: "";
      }

      .brand-mark::after {
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--clay);
        content: "";
      }

      .kicker {
        margin: clamp(56px, 8vh, 90px) 0 18px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .stamp {
        display: flex;
        align-items: flex-end;
        gap: 18px;
      }

      .status {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(5rem, 10vw, 8.6rem);
        font-weight: 400;
        letter-spacing: -0.1em;
        line-height: 0.78;
      }

      .clay-bar {
        width: 10px;
        height: 50px;
        margin-bottom: 7px;
        border-radius: 999px;
        background: var(--clay);
      }

      h1 {
        max-width: 430px;
        margin: 32px 0 0;
        font-family: var(--serif);
        font-size: clamp(2.2rem, 4vw, 3.8rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .description {
        max-width: 390px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .description span { display: block; }

      .note {
        max-width: 390px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: auto;
        padding-top: 34px;
      }

      .action {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0 15px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .action:hover { background: var(--oat); }

      .action.primary {
        background: var(--ink);
        color: var(--ivory);
      }

      .action.primary:hover { background: #30302c; }

      .art-area {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 22px;
        background: var(--oat);
      }

      .art {
        display: block;
        width: 100%;
        height: auto;
        transform: scale(1.04);
      }

      @media (max-width: 880px) {
        .recovery-panel {
          grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
          gap: 28px;
          min-height: 620px;
          padding: 30px;
        }
        .action { padding: 0 12px; }
      }

      @media (max-width: 700px) {
        .board { display: block; padding-top: 64px; }
        .direction-tag { top: 24px; }
        .recovery-panel {
          display: block;
          min-height: 0;
          padding: 28px 22px 24px;
        }
        .kicker { margin-top: 52px; }
        h1 { max-width: 520px; }
        .actions { margin-top: 28px; padding-top: 0; }
        .art-area { margin-top: 38px; }
      }

      @media (max-width: 430px) {
        .board { padding: 62px 14px 28px; }
        .direction-tag { right: 14px; font-size: 9px; }
        .recovery-panel { border-radius: 24px; padding: 24px 18px 20px; }
        .status { font-size: clamp(4.8rem, 24vw, 6.6rem); }
        h1 { margin-top: 26px; font-size: clamp(2.05rem, 10vw, 3rem); }
        .actions { display: grid; grid-template-columns: 1fr; }
        .action { width: 100%; }
        .art-area { margin-right: -4px; margin-left: -4px; border-radius: 17px; }
      }
    </style>
  </head>
  <body>
    <main class="board" aria-labelledby="error-title">
      <p class="direction-tag" aria-hidden="true">Direction B · Cactus recovery</p>
      <section class="recovery-panel" aria-label="LMM Forge error recovery">
        <div class="copy">
          <div class="brand" aria-label="LMM Forge">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>LMM Forge</span>
          </div>

          <p class="kicker">SYSTEM NOTE</p>
          <div class="stamp">
            <p class="status" aria-label="500">500</p>
            <span class="clay-bar" aria-hidden="true"></span>
          </div>
          <h1 id="error-title">Oops! Something went wrong :')</h1>
          <p class="description">
            <span>We apologize for the inconvenience.</span>
            <span>Please try again later.</span>
          </p>
          <p class="note">If this keeps happening, please report it on GitHub Issues.</p>

          <nav class="actions" aria-label="Error recovery actions">
            <button class="action primary" type="button">Go Back</button>
            <a class="action" href="https://github.com/LIghtJUNction/api.lmm.best/issues">Report an issue</a>
            <button class="action" type="button">Back to Home</button>
          </nav>
        </div>

        <figure class="art-area" aria-label="A bent signal being gently supported back into alignment">
          <img class="art" src="../assets/error-recovery-oat.png" alt="" />
        </figure>
      </section>
    </main>
  </body>
</html>
