[package]
name = "lmm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
default-run = "lmm-core"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
axum = "=0.8.9"
rand = "=0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "macros"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "io-util"] }
fs2 = "=0.4.3"
prost = "=0.14.4"
subtle = "=2.6.1"
tokio-stream = { version = "=0.1.17", features = ["net"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"

[build-dependencies]
tonic-prost-build = "=0.14.6"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
# SQLx uses this feature to create isolated test databases, not to upgrade them.
sqlx = { version = "=0.8.6", default-features = false, features = ["migrate"] }
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[example]]
name = "protocol-events-fixture"
path = "src/events/fixture.rs"
