[package]
name = "lmm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
default-run = "lmm-core"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
axum = "=0.8.9"
rand = "=0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "migrate", "macros"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
