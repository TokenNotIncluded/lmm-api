<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Abstract animated product canvas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0d"/>
      <stop offset="0.55" stop-color="#101116"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#5d74ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#5d74ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow">
      <stop offset="0" stop-color="#ee7259" stop-opacity=".54"/>
      <stop offset="1" stop-color="#ee7259" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop offset="0" stop-color="#6fcba8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6fcba8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".095" stroke-width="1"/>
    </pattern>
    <filter id="blur48" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d23"/>
      <stop offset="1" stop-color="#121318"/>
    </linearGradient>
    <style>
      .drift-a { animation: driftA 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .drift-b { animation: driftB 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float-main { animation: mainFloat 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .toolbar { animation: toolbarFloat 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sat-a { animation: satA 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sat-b { animation: satB 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .spin-slow { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
      .grid-move { animation: gridMove 5s linear infinite; }
      @keyframes driftA { 0%,100% { transform: translate(-8px, 10px) rotate(-1.2deg); } 50% { transform: translate(18px, -10px) rotate(1.2deg); } }
      @keyframes driftB { 0%,100% { transform: translate(14px, -8px) rotate(1deg); } 50% { transform: translate(-15px, 12px) rotate(-1deg); } }
      @keyframes mainFloat { 0%,100% { transform: translate(-8px, 6px) rotate(-1.6deg); } 50% { transform: translate(11px, -8px) rotate(1.6deg); } }
      @keyframes toolbarFloat { 0%,100% { transform: translateY(5px); } 50% { transform: translateY(-6px); } }
      @keyframes satA { 0%,100% { transform: translate(0, 7px); } 50% { transform: translate(12px, -7px); } }
      @keyframes satB { 0%,100% { transform: translate(8px, -5px); } 50% { transform: translate(-10px, 7px); } }
      @keyframes pulse { 0%,100% { transform: scale(.82); opacity: .5; } 50% { transform: scale(1.14); opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(36px,24px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <g filter="url(#blur48)" opacity=".9">
    <circle class="drift-a" cx="245" cy="145" r="185" fill="url(#blueGlow)"/>
    <circle class="drift-b" cx="720" cy="175" r="170" fill="url(#warmGlow)"/>
    <circle class="drift-a" cx="520" cy="430" r="210" fill="url(#greenGlow)" opacity=".74"/>
  </g>

  <g class="grid-move">
    <rect x="-36" y="-24" width="1032" height="588" fill="url(#grid)"/>
  </g>

  <g class="drift-a" filter="url(#shadow)">
    <rect x="82" y="66" width="360" height="228" rx="28" fill="url(#panel)" stroke="#fff" stroke-opacity=".17"/>
    <rect x="104" y="90" width="132" height="72" rx="15" fill="#5f78dd" fill-opacity=".78"/>
    <rect x="254" y="90" width="158" height="72" rx="15" fill="#8c8ed5" fill-opacity=".78"/>
    <rect x="104" y="180" width="132" height="88" rx="15" fill="#7d86c1" fill-opacity=".7"/>
    <rect x="254" y="180" width="158" height="88" rx="15" fill="#b08bb6" fill-opacity=".62"/>
  </g>

  <g class="drift-b" filter="url(#shadow)">
    <rect x="548" y="86" width="334" height="250" rx="28" fill="url(#panel)" stroke="#fff" stroke-opacity=".15"/>
    <rect x="572" y="112" width="286" height="44" rx="13" fill="#fff" fill-opacity=".92"/>
    <rect x="572" y="176" width="286" height="44" rx="13" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".09"/>
    <rect x="590" y="193" width="122" height="10" rx="5" fill="#fff" fill-opacity=".54"/>
    <rect x="572" y="238" width="286" height="44" rx="13" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".09"/>
    <rect x="590" y="255" width="176" height="10" rx="5" fill="#fff" fill-opacity=".48"/>
    <rect x="752" y="296" width="106" height="24" rx="12" fill="#fff" fill-opacity=".9"/>
  </g>

  <g class="float-main" filter="url(#shadow)">
    <path d="M302 108 L730 116 L704 398 L278 386 Z" fill="#f3f3ef"/>
    <rect x="324" y="142" width="358" height="218" rx="26" fill="#14151a"/>

    <g class="spin-slow" fill="none" stroke="#8b73c8" stroke-opacity=".62">
      <circle cx="503" cy="251" r="34" stroke-width="2.5"/>
      <circle cx="503" cy="251" r="54" stroke-width="2.5"/>
      <circle cx="503" cy="251" r="74" stroke-width="2.5"/>
      <circle cx="503" cy="251" r="94" stroke-width="2.5"/>
      <circle cx="503" cy="251" r="114" stroke-width="2.5"/>
    </g>

    <path id="orbit" d="M389 251a114 72 0 1 0 228 0a114 72 0 1 0-228 0" fill="none"/>
    <g>
      <circle r="22" fill="none" stroke="#f7f7f2" stroke-opacity=".42" stroke-width="2"/>
      <circle r="9" fill="#f7f7f2"/>
      <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbit"/>
      </animateMotion>
    </g>

    <g class="pulse" opacity=".75">
      <circle cx="503" cy="251" r="18" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/>
    </g>
  </g>

  <g class="toolbar" filter="url(#shadow)">
    <rect x="374" y="368" width="258" height="56" rx="28" fill="#111217" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="410" cy="396" r="8" fill="#fff" fill-opacity=".58"/>
    <circle cx="456" cy="396" r="8" fill="#fff" fill-opacity=".72"/>
    <circle cx="503" cy="396" r="8" fill="#fff" fill-opacity=".96"/>
    <circle cx="550" cy="396" r="8" fill="#fff" fill-opacity=".72"/>
    <circle cx="596" cy="396" r="8" fill="#fff" fill-opacity=".58"/>
  </g>

  <g class="sat-a" filter="url(#shadow)">
    <rect x="116" y="354" width="116" height="64" rx="20" fill="#15161b" stroke="#fff" stroke-opacity=".18"/>
    <rect x="138" y="382" width="72" height="8" rx="4" fill="#fff" fill-opacity=".74"/>
  </g>

  <g class="sat-b" filter="url(#shadow)">
    <rect x="716" y="374" width="124" height="66" rx="20" fill="#15161b" stroke="#fff" stroke-opacity=".18"/>
    <rect x="741" y="403" width="75" height="8" rx="4" fill="#fff" fill-opacity=".7"/>
  </g>

  <rect x=".5" y=".5" width="959" height="539" rx="34" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
