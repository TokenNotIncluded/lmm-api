<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lmm-cut-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>LMM Forge | Open-Source Collaboration</title>
    <meta name="title" content="LMM Forge | Open-Source Collaboration" />
    <meta
      name="description"
      content="AI API access, Remote MCP tools, and open-source bounty collaboration."
    />
    <meta name="generator" content="LMM Forge" />

    <meta name="theme-color" content="#141413" />
    <script>
      ;(() => {
        const match = document.cookie.match(
          /(?:^|;\s*)vite-ui-theme=(dark|light|system)(?:;|$)/
        )
        const savedTheme = match?.[1]
        const theme =
          savedTheme === 'light' ||
          (savedTheme === 'system' &&
            !window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'light'
            : 'dark'
        document.documentElement.classList.add(theme)
        document
          .querySelector("meta[name='theme-color']")
          ?.setAttribute('content', theme === 'dark' ? '#020817' : '#fff')
      })()
    </script>
    <script
      src="https://cdn.agentlane.com/v1/snippet.js"
      data-domain="dom-plf25ce17li9"
    ></script>
