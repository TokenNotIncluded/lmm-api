<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23141413' d='M4 4h24v24H4z'/%3E%3Cpath fill='%23BCD1CA' d='M8 8h16v16H8z'/%3E%3Cpath fill='%23141413' d='M13 10h6v12h-6z'/%3E%3C/svg%3E"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>LMM Forge | Open-Source Collaboration</title>
    <meta name="title" content="LMM Forge | Open-Source Collaboration" />
    <meta
      name="description"
      content="Open-source bounty collaboration and delivery tracking."
    />
    <meta name="generator" content="LMM Forge" />

    <meta name="theme-color" content="#141413" />
    <script>
      ;(() => {
        const match = document.cookie.match(
          /(?:^|;\s*)vite-ui-theme=(dark|light|system)(?:;|$)/
        )
        const savedTheme = match?.[1]
        const theme =
          savedTheme === 'light' ||
          (savedTheme === 'system' &&
            !window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'light'
            : 'dark'
        document.documentElement.classList.add(theme)
        document
          .querySelector("meta[name='theme-color']")
          ?.setAttribute('content', theme === 'dark' ? '#020817' : '#fff')
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
