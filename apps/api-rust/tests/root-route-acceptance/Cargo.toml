[package]
name = "lmm-root-route-acceptance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Keep this opt-in acceptance harness outside the application workspace. The
# normal workspace test suite stays green while this gate deliberately remains
# red until all 353 frozen routes are mounted on the real Rust root router.
[workspace]

[features]
runtime = [
  "dep:async-trait",
  "dep:axum",
  "dep:ipnet",
  "dep:lmm-api-rs",
  "dep:lmm-application",
  "dep:lmm-contracts",
  "dep:lmm-domain",
  "dep:redis",
  "dep:secrecy",
  "dep:serde_json",
  "dep:sqlx",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "dep:tracing",
  "dep:uuid",
]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
axum = { version = "0.8.4", optional = true }
ipnet = { version = "2.11.0", optional = true }
lmm-api-rs = { path = "../..", optional = true }
lmm-application = { path = "../../crates/application", optional = true }
lmm-contracts = { path = "../../crates/contracts", optional = true }
lmm-domain = { path = "../../crates/domain", optional = true }
redis = { version = "0.32.4", features = ["tokio-comp"], optional = true }
secrecy = { version = "0.10.3", features = ["serde"], optional = true }
serde_json = { version = "1.0.142", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"], optional = true }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"], optional = true }
tower = { version = "0.5.2", features = ["util"], optional = true }
tower-http = { version = "0.6.6", features = ["fs"], optional = true }
tracing = { version = "0.1.41", optional = true }
uuid = { version = "1.17.0", features = ["v4"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
