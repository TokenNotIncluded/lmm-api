[package]
name = "lmm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
default-run = "lmm-core"
autobins = false
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "lmm-core"
path = "src/main.rs"

[features]
resource-acceptance = []

[dependencies]
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = "=0.5.3"
base64 = "=0.22.1"
bcrypt = "=0.17.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
jsonschema = { version = "=0.59.0", default-features = false, features = ["arbitrary-precision"] }
# Existing locked MIT/Apache-2.0 arithmetic; bounded tariff fractions must not
# overflow merely while finding a common denominator before final rounding.
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
# Required S256 primitive, upstream MIT OR Apache-2.0; durable grants are Core-owned.
oxide-auth = { git = "https://github.com/197g/oxide-auth", rev = "0e3ef86d924aa5546dc3275d1d7269ea63edfaf1" }
axum = { version = "=0.8.9", features = ["multipart"] }
http-body = "=1.1.0"
http-body-util = "=0.1.5"
# Existing locked MIT dependencies; native HTTP parsing and graceful connections.
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "server-graceful", "tokio", "service"] }
ipnet = "=2.12.2"
rand = "=0.8.6"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "multipart"] }
ring = "=0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "macros"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "io-util"] }
fs2 = "=0.4.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zstd = { version = "=0.13.3", default-features = false }
prost = "=0.14.4"
subtle = "=2.6.1"
totp-rs = { version = "=6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tower = { version = "=0.5.3", features = ["util"] }

[build-dependencies]
tonic-prost-build = "=0.14.6"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
# SQLx uses this feature to create isolated test databases, not to upgrade them.
sqlx = { version = "=0.8.6", default-features = false, features = ["migrate"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[example]]
name = "protocol-events-fixture"
path = "src/events/fixture.rs"
