# Include inside the production TLS `server` block.
# The frontend release script atomically updates this root's `current` symlink.
# Load MIME mappings at server scope: production intentionally has no global
# mime.types include, and ES modules are rejected when served as octet-stream.
include /etc/nginx/lmm-api-mime.types;
default_type application/octet-stream;
root /srv/lmm-api-frontend/current;

# All backend traffic reaches one named location so WebSocket upgrades and SSE
# streaming retain the original request URI and are never served by the SPA.
location @lmm_api_backend {
    # Intentional cleartext loopback hop: production binds the Go listener only
    # to 127.0.0.1:3000. This is HTTP/1.1 for WebSocket upgrades, not h2c.
    proxy_pass http://127.0.0.1:3000;
    # pi-lens-ignore: opengrep:generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $websocket_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_read_timeout 3600s;
}

# A CORS preflight must finish before the server-level access-policy subrequest.
# The internal 418 only selects this named location; clients always receive 204.
# Credentials are deliberately unsupported here: the actual request still has
# to pass both the access policy and the application's CORS middleware.
error_page 418 = @lmm_api_cors_preflight;
location @lmm_api_cors_preflight {
    auth_request off;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods $http_access_control_request_method always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
    return 204;
}

# Administrative API, OAuth API callbacks, relay APIs, and compatibility APIs.
# A rewrite-phase return is safe here and is the only path around auth_request;
# every non-OPTIONS method continues through the inherited access policy.
location ^~ /api/ {
    set $lmm_access_policy_original_uri $uri;
    if ($request_method = OPTIONS) { return 418; }
    try_files /.__lmm_backend__ @lmm_api_backend;
}
location = /api {
