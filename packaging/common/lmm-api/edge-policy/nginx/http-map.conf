# Include once in nginx's `http` context (not inside a server block).
# Only WebSocket upgrades are forwarded; h2c and arbitrary Upgrade values are dropped.
map $http_upgrade $websocket_upgrade {
    default       '';
    ~*^websocket$ websocket;
}

map $websocket_upgrade $connection_upgrade {
    default   close;
    websocket upgrade;
}

# The country database is consumed by the package-managed edge policy. The
# database is updated by lmm-api-go's native CLI and never by an ad-hoc shell
# hook. Nginx performs the pre-application country lookup so the Go service can
# evaluate ordered IP access route rules in auth_request.
geoip2 /var/lib/geoip2/DBIP-Country-Lite.mmdb {
    auto_reload 5m;
    $lmm_geoip_country_code country iso_code;
}

map $lmm_geoip_country_code $lmm_cn_source {
    default 0;
    CN      1;
}

# Never turn API POST errors into HTML or automatically replay a request.
map "$request_method:$http_accept" $lmm_service_error_uri {
    default /internal/errors/service-unavailable.json;
    ~*^(GET|HEAD):.*text/html /internal/errors/service-unavailable;
}

# Use the original URI: named locations and SPA fallbacks change $uri.
# OAuth requests and OAuth referrers can contain authorization parameters.
map $request_uri $lmm_oauth_request_loggable {
    default 1;
    ~^/(?:api/oauth2|api/user/auth/oauth2|oauth)(?:/|\?|$) 0;
}
map $http_referer $lmm_oauth_referer_loggable {
    default 1;
    ~*^https?://[^/]+/(?:api/oauth2|api/user/auth/oauth2|oauth)(?:/|\?|$) 0;
}
map "$lmm_oauth_request_loggable:$lmm_oauth_referer_loggable" $lmm_access_loggable {
    default 0;
    "1:1" 1;
}
