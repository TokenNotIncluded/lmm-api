<main><h1 id="title">服务暂时不可用</h1><p id="intro">当前请求未能完成，请稍后重试。</p><dl aria-live="polite"><dt id="reason-label">原因</dt><dd id="reason">服务器暂时未能完成请求，具体原因正在核实。</dd><dt id="scope-label">影响范围</dt><dd id="scope">LMM Best 服务</dd><dt id="eta-label">预计恢复</dt><dd id="eta">恢复时间尚未确定</dd></dl><div class="actions"><a class="retry" id="retry" href="/">重新尝试</a><a id="support" href="mailto:support@lmm.best">联系支持</a></div></main>

<script>

e.","retry":"Réessayer","support":"Contacter l’assistance","reference":"Identifiant de requête","maintenance":"Mise à jour du service en cours","migration":"Mise à jour de la structure des données","deploying":"Changement de version du service","recovering":"Restauration de la version stable","checking":"Vérification du rétablissement","ready":"Le service est de nouveau disponible. Vous pouvez réessayer.","none":"Service LMM Best"},"ja":{"title":"サービスを一時的に利用できません","intro":"リクエストを完了できませんでした。しばらくしてから再試行してください。","reason":"理由","unknown":"サーバーでリクエストを処理できませんでした。原因を確認しています。","scope":"影響範囲","eta":"復旧予定","pending":"復旧時刻はまだ確定していません","late":"予定時刻を過ぎています。新しい情報を確認中です。","retry":"再試行","support":"サポートに連絡","reference":"リクエスト ID","maintenance":"サービスを更新しています","migration":"サービスのデータ構造を更新しています","deploying":"サービスのバージョンを切り替えています","recovering":"安定版に復旧しています","checking":"サービスの復旧を確認しています","ready":"サービスが復旧しました。再試行できます。","none":"LMM Best サービス"},"ru":{"title":"Сервис временно недоступен","intro":"Не удалось выполнить запрос. Повторите попытку позже.","reason":"Причина","unknown":"Сервер не смог обработать запрос. Причина уточняется.","scope":"Затронутый сервис","eta":"Ожидаемое восстановление","pending":"Время восстановления пока не подтверждено","late":"Предполагаемое время прошло. Ожидается новая информация.","retry":"Повторить","support":"Связаться с поддержкой","reference":"Идентификатор запроса","maintenance":"Выполняется обновление сервиса","migration":"Обновляется структура данных сервиса","deploying":"Переключение версии сервиса","recovering":"Восстановление стабильной версии","checking":"Проверка восстановления сервиса","ready":"Сервис снова доступен. Можно повторить запрос.","none":"Сервис LMM Best"},"vi":{"title":"Dịch vụ tạm thời không khả dụng","intro":"Không thể hoàn tất yêu cầu. Vui lòng thử lại sau.","reason":"Nguyên nhân","unknown":"Máy chủ chưa thể xử lý yêu cầu. Chúng tôi đang kiểm tra nguyên nhân.","scope":"Dịch vụ bị ảnh hưởng","eta":"Dự kiến khôi phục","pending":"Chưa xác nhận thời gian khôi phục","late":"Đã qua thời gian dự kiến. Đang chờ thông tin cập nhật.","retry":"Thử lại","support":"Liên hệ hỗ trợ","reference":"Mã yêu cầu","maintenance":"Đang cập nhật dịch vụ","migration":"Đang cập nhật cấu trúc dữ liệu dịch vụ","deploying":"Đang chuyển phiên bản dịch vụ","recovering":"Đang khôi phục phiên bản ổn định","checking":"Đang kiểm tra việc khôi phục dịch vụ","ready":"Dịch vụ đã hoạt động trở lại. Bạn có thể thử lại.","none":"Dịch vụ LMM Best"}};
const preferred=(navigator.language||"zh").toLowerCase();
const language=preferred.startsWith("zh-tw")||preferred.startsWith("zh-hk")||preferred.startsWith("zh-hant")?"zh-TW":Object.keys(messages).find(function(key){return preferred.startsWith(key);})||"en";
const text=messages[language];document.documentElement.lang=language;
function put(id,value){document.getElementById(id).textContent=value;}
["title","intro","retry","support","reference"].forEach(function(key){put(key,text[key]);});["reason","scope","eta"].forEach(function(key){put(key+"-label",text[key]);});put("reason",text.unknown);put("scope",text.none);put("eta",text.pending);
document.getElementById("retry").addEventListener("click",function(event){event.preventDefault();location.reload();});
function fallback(){put("intro",text.intro);put("reason",text.unknown);put("scope",text.none);put("eta",text.pending);document.getElementById("eta-label").hidden=false;document.getElementById("eta").hidden=false;}
async function update(){
try{
const response=await fetch("/__lmm_service_status",{cache:"no-store",credentials:"omit",signal:AbortSignal.timeout(5000)});if(!response.ok)throw new Error("status unavailable");
const status=await response.json();
if(typeof status.updated_at!=="string"||!Number.isFinite(Date.parse(status.updated_at))||Date.now()-Date.parse(status.updated_at)>86400000)throw new Error("status expired");
const reasons={maintenance:text.maintenance,migration:text.migration,deploying:text.deploying,recovering:text.recovering,checking:text.checking,ready:text.ready};
if(!Object.prototype.hasOwnProperty.call(reasons,status.state))throw new Error("unknown status");
if(status.state==="ready"){
const health=await fetch("/api/livez",{cache:"no-store",credentials:"omit",signal:AbortSignal.timeout(5000)});if(!health.ok)throw new Error("health unavailable");const live=await health.json();if(live.live!==true)throw new Error("not live");
put("intro",text.ready);put("reason",text.ready);document.getElementById("eta-label").hidden=true;document.getElementById("eta").hidden=true;
}else{
put("intro",text.intro);document.getElementById("eta-label").hidden=false;document.getElementById("eta").hidden=false;
put("reason",typeof status.message==="string"&&status.message.length>0&&status.message.length<=512?status.message:reasons[status.state]);
const recovery=typeof status.estimated_recovery_at==="string"?Date.parse(status.estimated_recovery_at):NaN;
put("eta",Number.isFinite(recovery)?recovery>Date.now()?new Intl.DateTimeFormat(language,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",timeZoneName:"short"}).format(new Date(recovery)):text.late:text.pending);
}
put("scope",typeof status.service==="string"&&status.service.length>0&&status.service.length<=120?status.service:text.none);
}catch{fallback();}
}
update();setInterval(function(){if(!document.hidden)update();},15000);
})();
</script></body></html>
