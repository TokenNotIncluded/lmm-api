# PostgreSQL 17, isolated 256 MiB database experiment ONLY. Not a capacity claim.
listen_addresses = '*'
max_connections = 32
superuser_reserved_connections = 3
reserved_connections = 2
shared_buffers = '64MB'
work_mem = '1MB'
hash_mem_multiplier = 2
maintenance_work_mem = '16MB'
autovacuum_work_mem = '8MB'
autovacuum_max_workers = 1
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
max_parallel_workers = 0
temp_buffers = '1MB'
temp_file_limit = '32MB'
fsync = on
full_page_writes = on
synchronous_commit = on
wal_level = replica
wal_buffers = '4MB'
max_wal_senders = 4
max_replication_slots = 2
max_slot_wal_keep_size = '128MB'
min_wal_size = '80MB'
max_wal_size = '256MB'
checkpoint_timeout = '5min'
checkpoint_completion_target = 0.9
# max_wal_size is NOT a hard total-disk limit. Disk lifecycle belongs to dp-28.
# No archive_command: this lab does not pretend local WAL is independent backup.
statement_timeout = '10s'
lock_timeout = '3s'
idle_in_transaction_session_timeout = '10s'
password_encryption = 'scram-sha-256'
track_io_timing = on
track_wal_io_timing = on
log_checkpoints = on
log_min_error_statement = panic
log_statement = none
