# Optional standalone core: remote PostgreSQL, no Go and no local DB service.
# Combine with compose.core.yml. This is a fresh-install WIP, not production billing.
name: lmm-core-standalone
services:
  core:
    secrets: [core_database_url]
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 1.0
    pids_limit: 64

  # Never started with the runtime. It is the same lmm-core executable, used only
  # for explicit offline installation/bootstrap with separate owner authority.
  core-init:
    profiles: [tools]
    image: lmm-core:${LMM_DOCKER_CORE_IMAGE_TAG:-dev}
    entrypoint: [/usr/bin/lmm-core]
    command: [--config, /etc/lmm.conf.d/core.toml, init-db]
    configs:
      - source: core_init_config
        target: /etc/lmm.conf.d/core.toml
    secrets: [core_database_owner_url]
    networks: [core]
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: "no"
networks:
  core:
    # Do not reuse the extensions backplane for a standalone deployment.
    name: ${COMPOSE_PROJECT_NAME}-runtime
secrets:
  core_database_url:
    file: ${LMM_DOCKER_DATABASE_URL_SECRET_FILE:?Set an absolute restricted runtime URL secret file}
  core_database_owner_url:
    file: ${LMM_DOCKER_DATABASE_OWNER_URL_SECRET_FILE:-./.secrets/core-database-owner-url}
configs:
  core_config:
    file: ${LMM_DOCKER_CORE_CONFIG_FILE:-./config/core-standalone.toml}
  core_init_config:
    file: ${LMM_DOCKER_INIT_CONFIG_FILE:-./config/core-init.toml}
