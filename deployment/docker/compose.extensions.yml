name: lmm-extensions
services:
  extensions:
    image: lmm-extensions:${LMM_DOCKER_EXTENSIONS_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deployment/docker/extensions.Dockerfile
    ports:
      - "127.0.0.1:${LMM_DOCKER_EXTENSIONS_PORT:-18081}:8081"
    command: [--config, /etc/lmm.conf.d/extensions.toml]
    configs:
      - source: extensions_config
        target: /etc/lmm.conf.d/extensions.toml
    environment:
      GOMEMLIMIT: 128MiB
    secrets: [extension_token]
    restart: unless-stopped
    stop_grace_period: 35s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    networks: [core]
secrets:
  extension_token:
    file: ${LMM_DOCKER_EXTENSIONS_TOKEN_SECRET_FILE:-./.secrets/extensions-token}
configs:
  extensions_config:
    file: ${LMM_DOCKER_EXTENSIONS_CONFIG_FILE:-./config/extensions-base.toml}
networks:
  core:
    name: ${LMM_DOCKER_NETWORK:?Set the selected core project runtime network}
    external: true
