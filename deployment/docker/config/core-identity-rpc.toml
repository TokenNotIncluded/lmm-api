# Identity + private Unix RPC. Model traffic and financial extensions stay off.
version = 1
[server]
listen = "0.0.0.0:8080"
worker_threads = 1
max_inflight = 16
drain_timeout_seconds = 30
[database]
url_file = "/run/secrets/core_database_url"
max_connections = 2
[identity]
registration_enabled = false
password_slots = 1
[rpc]
socket = "/run/lmm-core-rpc/core.sock"
token_file = "/run/secrets/core_rpc_token"
