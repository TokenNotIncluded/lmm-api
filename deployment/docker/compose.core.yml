name: lmm-core
services:
  core:
    image: lmm-core:${LMM_DOCKER_CORE_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deployment/docker/core.Dockerfile
    ports:
      - "127.0.0.1:${LMM_DOCKER_CORE_PORT:-18080}:8080"
    command: [--config, /etc/lmm.conf.d/core.toml]
    configs:
      - source: core_config
        target: /etc/lmm.conf.d/core.toml
    restart: unless-stopped
    stop_grace_period: 30m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    mem_reservation: 128m
    cpu_shares: 2048
    pids_limit: 128
    networks: [core]
networks:
  core:
    name: ${COMPOSE_PROJECT_NAME}-runtime
configs:
  core_config:
    file: ${LMM_DOCKER_CORE_CONFIG_FILE:-./config/core-base.toml}
