# Combine with compose.core.yml for a fresh-install core database.
# Run core-admin init-db once. Startup never creates or upgrades tables.
services:
  core:
    environment:
      LMM_CORE_DATABASE_URL_FILE: /run/secrets/core_database_url
    secrets: [core_database_url]
    networks: [core, identity]
    depends_on:
      core-db:
        condition: service_healthy

  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lmm_core
      POSTGRES_USER: lmm_core
      POSTGRES_PASSWORD_FILE: /run/secrets/core_database_password
    secrets: [core_database_password]
    volumes:
      - core-identity-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 256m
    pids_limit: 128
    command: [postgres, -c, max_connections=32, -c, shared_buffers=64MB]
    healthcheck:
      test: [CMD, pg_isready, -U, lmm_core, -d, lmm_core]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [identity]

  core-admin:
    profiles: [tools]
    image: lmm-core:${LMM_CORE_IMAGE_TAG:-dev}
    entrypoint: [/usr/local/bin/lmm-core-admin]
    command: [init-db]
    environment:
      LMM_CORE_DATABASE_URL_FILE: /run/secrets/core_database_url
    secrets: [core_database_url]
    networks: [identity]
    depends_on:
      core-db:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: "no"

networks:
  identity:
    internal: true
volumes:
  core-identity-data:
secrets:
  core_database_url:
    file: ${LMM_CORE_DATABASE_URL_SECRET_FILE:?Set an absolute database URL secret file}
  core_database_password:
    file: ${LMM_CORE_DATABASE_PASSWORD_SECRET_FILE:?Set an absolute database password secret file}
