# Combine only with compose.extensions.yml. Never owns the core or its DB.
services:
  extensions:
    secrets: [core_rpc_token]
    volumes:
      - type: volume
        source: core-rpc
        target: /run/lmm-core-rpc
        read_only: true
secrets:
  core_rpc_token:
    file: ${LMM_DOCKER_RPC_TOKEN_SECRET_FILE:-./.secrets/core-rpc-token}
volumes:
  core-rpc:
    name: ${LMM_DOCKER_RPC_VOLUME:?Set the selected core RPC volume name}
    external: true
configs:
  extensions_config:
    file: ${LMM_DOCKER_EXTENSIONS_CONFIG_FILE:-./config/extensions-identity.toml}
