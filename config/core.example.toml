# Non-secret runtime configuration; install as /etc/lmm.conf.d/core.toml.
# Provision the restricted runtime database credential separately (0600).
# Use a separate private owner TOML for explicit init-db; never run as owner.
version = 1

[server]
listen = "127.0.0.1:8080"
worker_threads = 1
max_inflight = 16
drain_timeout_seconds = 30

[database]
url_file = "/etc/lmm.conf.d/secrets/core/database-url"
max_connections = 2
# Optional pool connection/acquisition wait, in seconds (1..30; default 3).
# acquire_timeout_seconds = 3
# Optional check-db read-only observation deadline (1..120; default 15).
# Does not change normal runtime SQL, transaction, or billing timeouts.
# check_timeout_seconds = 15

[identity]
registration_enabled = false
# All three settings below must be explicit before registration_enabled=true.
password_register_enabled = false
oauth_register_enabled = false
registration_disabled_methods = ["discord", "github", "linuxdo", "oidc", "telegram", "wechat"]
password_slots = 1
# Optional recoverable API Key encryption: a stable, independently generated
# exact 32-byte raw key. Never regenerate it on startup or use the Web key.
# api_key_encryption_key_file = "/etc/lmm.conf.d/secrets/core/api-key-encryption-key"

[console]
enabled = false

# Optional browser authentication; supply an exact trusted origin and a private key.
# [identity.web]
# origin = "https://api.example.invalid"
# refresh_key_file = "/etc/lmm.conf.d/secrets/core/web-refresh-key"
# local_http = false
# user_agreement_enabled = false
# privacy_policy_enabled = false

# Optional read-only lmm CLI issuer; requires the exact HTTPS identity.web
# origin and refresh key above, plus enable_oauth2=true runtime grants.
# Pi model delegation additionally requires explicit finite pi_max_credits and
# the actual [model] gateway; no developer upgrade or existing-db migration.
# [identity.oauth2]
# issuer = "https://api.example.invalid"
# groups = ["default"]
# access_ttl_seconds = 900
# family_ttl_seconds = 2592000
# Optional normal Pi consent ceiling in integer credits; no default/unlimited.
# pi_max_credits = 1000000

# Optional extension RPC; separately provision socket access and module grants.
# [rpc]
# socket = "/run/lmm/core/core.sock"
# token_file = "/etc/lmm.conf.d/secrets/core/rpc-token"
# Shared Unix group is opt-in. Set the actual numeric GID of lmm-rpc;
# also apply the matching service-manager group and directory permissions.
# shared_group_id = 12345

# Optional functionality is disabled until its TOML and credentials are supplied.
# [model]
# config_file = "/etc/lmm.conf.d/core-model.toml"
# local_http = false
# [payments]
# config_file = "/etc/lmm.conf.d/core-payments.toml"
# token_file = "/etc/lmm.conf.d/secrets/core/payments-token"
# [commerce]
# config_file = "/etc/lmm.conf.d/core-commerce.toml"
# token_file = "/etc/lmm.conf.d/secrets/core/commerce-token"

# Optional independent custom moderation upstream credential aliases.
# This does not enable model traffic; [model] remains explicit. Fixed text needs
# no sidecar. Public policy/API responses contain aliases, never secret paths.
# [abuse]
# credential_config_file = "/etc/lmm.conf.d/core-abuse-credentials.toml"
# local_http = false # explicit opt-in permits only numeric loopback URLs
