# Host-only aliases for the isolated moderation transport, version 1.
# Each referenced secret must be a regular 0400/0600 file, without symlinks.
# Do not reuse ordinary paid-provider credential references or files.
version = 1
credentials = []
# To add an alias, remove credentials=[] and provision a separate secret:
# [[credentials]]
# alias = "isolated-loopback"
# secret_file = "/etc/lmm.conf.d/secrets/core/abuse-isolated-loopback"
# allowed_origins = ["https://isolated-provider.example"]
# tls_ca_file = "/etc/lmm.conf.d/secrets/core/abuse-isolated-ca.pem" # optional private CA, this alias only
# Origins are required, exact scheme/host/effective port, without a base path.
# Numeric loopback HTTP additionally requires explicit abuse.local_http=true.
